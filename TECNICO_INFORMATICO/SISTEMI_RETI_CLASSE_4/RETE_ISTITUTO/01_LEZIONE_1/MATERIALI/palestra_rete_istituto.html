];
const GUIDED = STEPS.filter(s=>s.phase==="g"), CHAL = STEPS.filter(s=>s.phase==="x");
const idx = id => STEPS.findIndex(s=>s.id===id);

/* =====================================================================
   CODICE RISULTATO · firma come nelle altre palestre (djb2, base 36)
   ===================================================================== */
const FAM = "SIR", TOOL = "RET";
/* parole dell'avviso di riavvio che cambiano da una palestra all'altra */
const RS = {prove:"le domande", risp:"Le risposte", dove:"nel documento della consegna", lv:false};
function sig(s, tag){ let h=5381; const t=FAM+"*"+s+"*"+tag; for(let k=0;k<t.length;k++){ h=((h<<5)+h+t.charCodeAt(k))>>>0; } return h.toString(36).toUpperCase().slice(-5).padStart(5,"0"); }

/* =====================================================================
   APP
   ===================================================================== */
const App = (()=>{
  let pos = Math.min(Math.max(0, +store.get("pos")||0), STEPS.length-1), S={};
  const res = id => store.get("r_"+id);
  const curName = () => (store.get("nome")||"").replace(/\s+/g," ").trim();
  const rip = () => +store.get("rip")||0;
  const errs = () => store.get("errs")||{};
  function addErr(id){ const e=errs(); e[id]=(e[id]||0)+1; store.set("errs", e); }
  const mq = window.matchMedia ? window.matchMedia("(max-width:900px)") : null;

  function go(i){ pos=i; store.set("pos", i); render(); window.scrollTo(0,0); }
  function next(){ if(pos<STEPS.length-1) go(pos+1); }
  function say(kind, html){ const fb=$("#l-fb"); fb.className="fb "+kind; fb.innerHTML=html; }
  function placeDock(){
    const d=$("#dock");
    if(mq && mq.matches){ if(d.parentNode!==$("#work")) $("#work").appendChild(d); d.classList.add("docked"); }
    else { if(d.parentNode!==$("#lesson")) $("#lesson").appendChild(d); d.classList.remove("docked"); }
  }
  if(mq){ if(mq.addEventListener) mq.addEventListener("change", placeDock); else if(mq.addListener) mq.addListener(placeDock); }

  function counter(step){ return step.phase==="g" ? `Passo ${GUIDED.indexOf(step)+1} di ${GUIDED.length}` : `Sfida finale · domanda ${CHAL.indexOf(step)+1} di ${CHAL.length}`; }
  function mountEnv(step){
    const st=$("#stage");
    if(step.env==="sort") SORT.mount(st, {bins:step.sort.bins, cards:shuffle(step.sort.cards)});
    else if(step.env==="big") BIG.mount(st, step.big);
    else if(step.env==="order") ORDER.mount(st, step.order);
    else if(step.env==="fields") FIELDS.mount(st, val(step.fields));
    else if(step.env==="decide") DECIDE.mount(st, val(step.decide));
    else if(step.env==="lab") LAB.mount(st, step.lab);
    else st.innerHTML="";
  }
  function render(){
    const step=STEPS[pos];
    $("#pbar").style.width = Math.round(pos/(STEPS.length-1)*100)+"%";
    $("#h-name").textContent = curName();
    paintPocket();
    try{ speechSynthesis.cancel(); }catch(e){}
    if(step.screen){ $("#work").classList.add("hidden"); $("#screen").classList.remove("hidden"); SCREENS[step.screen]($("#screen")); return; }
    $("#screen").classList.add("hidden"); $("#work").classList.remove("hidden");
    S = {err:0, hint:false, done:false, firstDone:false};
    $("#l-lbl").textContent = counter(step);
    $("#l-speak").classList.toggle("hidden", !BES);
    $("#l-title").innerHTML = step.phase==="x" ? SEC[step.sec].name : step.title;
    $("#l-theory").innerHTML = step.theory||""; $("#l-theory").classList.toggle("hidden", !step.theory);
    const keys=val(step.keys); $("#l-keys").innerHTML=keys; $("#l-keys").classList.toggle("hidden", !keys);
    $("#l-tasklbl").textContent = step.phase==="x" ? "Domanda" : step.need ? "Prova e rispondi" : step.quiz ? "Domanda" : "Il tuo compito";
    $("#l-task").innerHTML = val(step.task);
    const q=$("#l-quiz"); q.classList.toggle("hidden", !step.quiz);
    q.innerHTML = step.quiz ? step.quiz.map((o,i)=>`<button type="button" class="qopt" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${o.t}</button>`).join("") : "";
    q.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>answer(+b.dataset.i, b));
    $("#l-fb").classList.add("hidden"); $("#l-hinttext").classList.add("hidden");
    $("#b-next").classList.add("hidden"); $("#b-hint").classList.add("hidden");
    $("#b-check").classList.toggle("hidden", !!step.quiz);
    const sk=$("#b-skip"); sk.classList.remove("hidden"); sk.textContent = step.phase==="g" ? "Salta il passo ⤼" : "Salta la domanda ⤼";
    mountEnv(step); placeDock();
  }
  function showHintBtn(){ if(STEPS[pos].hint && !S.hint && S.err >= (BES?1:2)) $("#b-hint").classList.remove("hidden"); }
  function recordFirst(ok){ const step=STEPS[pos]; if(step.phase!=="x" || S.firstDone) return; S.firstDone=true; if(!res(step.id)) store.set("r_"+step.id, {first:ok, done:false}); }
  function verify(step){
    if(step.env==="sort"){ const st=SORT.state(), cards=step.sort.cards;
      const miss=cards.filter(c=>!st.place[c.id]), wrong=cards.filter(c=>st.place[c.id] && st.place[c.id]!==c.bin);
      if(miss.length===cards.length) return {ok:false, noTry:true, msg:"Non hai ancora messo nessuna carta in un cestino."};
      if(!miss.length && !wrong.length) return {ok:true};
      if(!wrong.length) return {ok:false, noTry:true, msg: miss.length===1 ? "Manca ancora una carta da mettere in un cestino." : `Mancano ancora ${miss.length} carte da mettere nei cestini.`};
      let m = wrong[0].why + (wrong.length>1 ? ` Da spostare anche: ${wrong.slice(1).map(c=>"«"+c.label+"»").join(", ")}.` : "");
      if(miss.length) m += " " + (miss.length===1 ? "Manca ancora una carta da mettere in un cestino." : `Mancano ancora ${miss.length} carte da mettere nei cestini.`);
      return {ok:false, msg:m, bad:wrong.map(c=>c.id)}; }
    if(step.env==="order"){ const s=ORDER.state(), o=step.order, n=s.filter(Boolean).length;
      if(!n) return {ok:false, noTry:true, msg:"Non hai ancora messo nessuna carta in fila."};
      if(n<o.ans.length) return {ok:false, noTry:true, msg:`Mancano ancora ${o.ans.length-n} carte da mettere in fila.`};
      const wrong=s.filter((x,i)=>x!==o.ans[i]); if(!wrong.length) return {ok:true};
      return {ok:false, msg:`${wrong.length} carte fuori posto. ${o.cards.find(c=>c.id===wrong[0]).why}`, bad:wrong}; }
    if(step.env==="fields"){ const r=FIELDS.check();
      if(r.every(x=>x.empty)) return {ok:false, noTry:true, msg:"Le caselle sono ancora vuote."};
      if(r.some(x=>x.empty)) return {ok:false, noTry:true, msg:"Completa tutte le caselle, poi premi Controlla."};
      if(r.every(x=>x.ok)) return {ok:true};
      return {ok:false, msg:"Controlla le caselle in rosso: sotto ognuna c'è il perché."}; }
    if(step.env==="decide"){ const ch=DECIDE.state(), it=val(step.decide).items, miss=it.filter(r=>!ch[r.id]);
      if(miss.length===it.length) return {ok:false, noTry:true, msg:"Non hai ancora deciso nessuna richiesta."};
      if(miss.length) return {ok:false, noTry:true, msg: miss.length===1 ? "Manca ancora una richiesta da decidere." : `Mancano ancora ${miss.length} richieste da decidere.`};
      const wrong=it.filter(r=>ch[r.id]!==r.a); if(!wrong.length) return {ok:true};
      return {ok:false, msg: wrong[0].why + (wrong.length>1 ? ` Da rivedere anche altre ${wrong.length-1}.` : ""), bad:wrong.map(r=>r.id)}; }
    if(step.env==="lab"){ const n=LAB.countOk(); if(n===30) return {ok:true};
      return {ok:false, msg:`Per ora riescono ${n} ping su 30. Premi «Prova tutte le coppie» e clicca una cella rossa: il messaggio dice dove si ferma il pacchetto.`}; }
    return {ok:true};
  }
  function check(){
    const step=STEPS[pos]; if(!step || step.screen || step.quiz) return;
    if(S.done){ next(); return; }
    const v=verify(step);
    if(!v.ok){
      if(!v.noTry){ S.err++; recordFirst(false); if(step.phase==="x") addErr(step.id); }
      if(v.bad && v.bad.length) (step.env==="order" ? ORDER : step.env==="decide" ? DECIDE : SORT).markBad(v.bad);
      say(v.noTry?"mid":"ko", (v.noTry?"":"Non ancora. ")+v.msg); showHintBtn(); return; }
    recordFirst(true); success(step);
  }
  function answer(i, btn){
    const step=STEPS[pos]; if(S.done) return; const o=step.quiz[i];
    /* nei passi «prova e rispondi» la risposta si accetta solo dopo la prova */
    if(step.need){ const m=step.need(); if(m){ say("mid", m); return; } }
    if(o.ok){ recordFirst(true); btn.classList.add("right"); $("#l-quiz").querySelectorAll(".qopt").forEach(b=>b.disabled=true); success(step); return; }
    if(btn.classList.contains("wrong")) return;
    recordFirst(false); if(step.phase==="x") addErr(step.id);
    btn.classList.add("wrong"); btn.setAttribute("aria-disabled","true"); S.err++; say("ko", "Non è così. "+o.fb); showHintBtn();
  }
  function success(step){
    S.done=true;
    if(step.phase==="g"){ const r=Object.assign({}, res(step.id)||{}, {ok:1, err:S.err}); if(S.hint) r.hint=1; delete r.skip; store.set("r_"+step.id, r);
      say("ok", "✔ Giusto! "+val(step.success)); paintPocket(); }
    else { const r=res(step.id)||{first:true}; store.set("r_"+step.id, {first:!!r.first, done:true}); say("ok", (r.first?"✔ Giusto al primo colpo! ":"✔ Ora è giusta. ")+val(step.why)); }
    $("#b-check").classList.add("hidden"); $("#b-hint").classList.add("hidden"); $("#b-skip").classList.add("hidden");
    const nb=$("#b-next"); nb.classList.remove("hidden"); nb.textContent = STEPS[pos+1] && STEPS[pos+1].screen ? "Continua →" : "Avanti →"; nb.focus({preventScroll:true});
  }
  /* un passo saltato resta nel codice e vale zero */
  function skip(){
    const step=STEPS[pos]; if(!step || step.screen || S.done) return; const r=res(step.id);
    if(step.phase==="g"){ if(!(r && r.ok)) store.set("r_"+step.id, Object.assign({}, r||{}, {skip:1})); }
    else store.set("r_"+step.id, {first:false, done:false, skip:1});
    next();
  }
  function hint(){ S.hint=true; const id=STEPS[pos].id; store.set("r_"+id, Object.assign({}, res(id)||{}, {hint:1}));
    const h=$("#l-hinttext"); h.innerHTML="💡 "+val(STEPS[pos].hint); h.classList.remove("hidden"); $("#b-hint").classList.add("hidden"); }

  /* tasca: chiusa durante la sfida */
  function paintPocket(){
    const learned = GUIDED.filter(s=>s.learn && (res(s.id)||{}).ok), cur=STEPS[pos], closed = cur && (cur.phase==="x" || cur.id==="x0");
    const b=$("#pocket-btn"); b.classList.toggle("hidden", !learned.length || closed); b.textContent=`🎒 Tasca (${learned.length})`;
    if(closed){ $("#pocket").classList.add("hidden"); b.setAttribute("aria-expanded","false"); }
    $("#pocket").innerHTML = `<h3>Cosa so già</h3><ul>${learned.map(s=>`<li><b>${val(s.learn.k)}</b> — ${s.learn.d}</li>`).join("")}</ul>`;
  }
  $("#pocket-btn").onclick = e=>{ e.stopPropagation(); const open=$("#pocket").classList.toggle("hidden"); $("#pocket-btn").setAttribute("aria-expanded", String(!open)); };
  document.addEventListener("click", e=>{ if(!e.target.closest("#pocket") && !$("#pocket").classList.contains("hidden")){ $("#pocket").classList.add("hidden"); $("#pocket-btn").setAttribute("aria-expanded","false"); } });

  /* riepilogo e codice */
  function guided(){ const r=GUIDED.map(s=>res(s.id)||{}), ok=r.filter(x=>x.ok).length, skip=r.filter(x=>x.skip && !x.ok).length;
    return {ok, skip, miss:GUIDED.length-ok-skip, hint:(+store.get("hintsPrev")||0)+r.filter(x=>x.hint).length}; }
  function tally(){
    const secs = Object.keys(SEC).map(k=>{ const qs=CHAL.filter(q=>q.sec===k), r=qs.map(q=>res(q.id));
      return {k, n:qs.length, ok:r.filter(x=>x && x.first && !x.skip).length, skip:r.filter(x=>x && x.skip).length, miss:r.filter(x=>!x).length}; });
    const skips = CHAL.filter(q=>{ const r=res(q.id); return r && r.skip; });
    return {secs, n:CHAL.length, miss:secs.reduce((a,x)=>a+x.miss,0), ok:secs.reduce((a,x)=>a+x.ok,0), skips};
  }
  const pl = (n, one, many) => `${n} ${n===1?one:many}`;
  function code(){
    const t=tally(), g=guided(), e=errs();
    const gx=[]; if(g.skip) gx.push(pl(g.skip,"saltato","saltati")); if(g.miss) gx.push(pl(g.miss,"non fatto","non fatti"));
    const parts=[FAM+"-"+TOOL, curName()||"(nome non inserito)", `PASSI ${g.ok}/${GUIDED.length}`+(gx.length?` (${gx.join(", ")})`:""), `aiuti ${g.hint}`];
    t.secs.forEach(x=>{ const ex=[]; if(x.skip) ex.push(pl(x.skip,"saltata","saltate")); if(x.miss) ex.push(pl(x.miss,"non fatta","non fatte"));
      parts.push(`${SEC[x.k].code} ${x.ok}/${x.n}`+(ex.length?` (${ex.join(", ")})`:"")); });
    parts.push(`TOT ${t.ok}/${t.n}`);
    const el=CHAL.filter(q=>e[q.id]).map(q=>`${q.code}(${e[q.id]})`);
    parts.push("errori "+(el.length?el.join(" "):"-"));
    if(t.skips.length) parts.push("saltate "+t.skips.map(q=>q.code).join(" "));
    parts.push("ripetizioni "+rip());
    if(BES) parts.push("modalità facilitata");
    const n0=store.get("nome0"); if(n0 && nameKey(n0)!==nameKey(curName())) parts.push("nome iniziale: "+n0);
    const body=parts.join(" | ");
    return body+" | #"+sig(body, TOOL);
  }
  function codeBlock(){
    const t=tally(), g=guided(), e=errs(), rev=CHAL.filter(q=>e[q.id] || t.skips.includes(q));
    const note = x => { const ex=[]; if(x.skip) ex.push(pl(x.skip,"saltata","saltate")); if(x.miss) ex.push(pl(x.miss,"non fatta","non fatte")); return ex.length?`<small>${ex.join(", ")}</small>`:""; };
    const tag = q => [e[q.id]?`<i>(sbagliata ${e[q.id]===1?"1 volta":e[q.id]+" volte"})</i>`:"", t.skips.includes(q)?"<i>(saltata)</i>":""].filter(Boolean).join(" ");
    return `<div class="stats">${t.secs.map(x=>`<div class="stat"><small>${SEC[x.k].name}</small><b>${x.ok}/${x.n}</b>${note(x)}</div>`).join("")}<div class="stat tot"><small>Giuste al primo colpo</small><b>${t.ok}/${t.n}</b></div></div>
      <p class="small">Passi guidati: <b>${g.ok}/${GUIDED.length}</b>${g.skip?`, ${pl(g.skip,"saltato","saltati")}`:""}${g.hint?`, aiuti usati: ${g.hint}`:""}${rip()?` · ripetizioni della sfida: ${rip()}`:""}.</p>
      ${rev.length?`<details class="review" open><summary>Da ripassare (${rev.length})</summary><ul>${rev.map(q=>`<li><b>${plain(val(q.task))}</b> ${tag(q)}<br>${q.why}</li>`).join("")}</ul></details>`:""}
      <h3>Il tuo codice</h3>
      <p>Clic nel riquadro, ${K(CT,"A")} e ${K(CT,"C")}, poi incollalo con ${K(CT,"V")} <b>${RS.dove}</b>.</p>
      <textarea class="copy" readonly aria-label="Codice risultato">${esc(code())}</textarea>
      <p><button type="button" class="btn alt" data-copy>📋 Copia il codice</button> <span class="small" data-copied aria-live="polite"></span></p>
      <p class="small">I risultati restano solo su questo computer. Il codice finisce con un controllo (#…): se qualcuno modifica i numeri, il controllo non torna più.</p>`;
  }
  document.addEventListener("click", e=>{
    const b=e.target.closest("[data-copy]"); if(!b) return;
    const box=b.closest(".screen").querySelector("textarea.copy"), out=b.parentNode.querySelector("[data-copied]");
    const ok=()=>{ out.textContent="Copiato ✓ Ora incollalo "+RS.dove+"."; };
    const fallback=()=>{ box.focus(); box.select(); try{ document.execCommand("copy"); ok(); }catch(err){ out.textContent="Copia a mano: clic nel riquadro, "+CT+"+A e "+CT+"+C."; } };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(box.value).then(ok, fallback); else fallback();
  });

  /* «Nuovo studente»: se il nome tornerà sullo stesso PC, errori, aiuti e ripetizioni ripartono da dove erano */
  function anyWork(){ return STEPS.some(s=>res(s.id)) || Object.keys(errs()).length>0 || rip()>0; }
  function saveHistory(){
    const n=curName(); if(!n || !anyWork()) return;
    const h=store.get("hist")||{}; h[hashName(n)]={rip:rip()+1, errs:errs(), hints:guided().hint, bes:BES}; store.set("hist", h);
  }
  function restoreHistory(n){
    if(anyWork()) return; const h=store.get("hist")||{}, k=hashName(n), p=h[k]; if(!p) return;
    store.set("rip", p.rip||0); store.set("errs", p.errs||{}); store.set("hintsPrev", p.hints||0); if(p.bes){ BES=true; store.set("bes", true); document.body.classList.add("bes"); const ob=$("#o-bes"); if(ob) ob.checked=true; } delete h[k]; store.set("hist", h);
  }

  /* schermate */
  const SCREENS = {
    welcome(el){
      el.innerHTML = `<h2>🏫 Il tecnico di rete</h2>
        <p>Primo giorno come tecnico di rete dell'Istituto. Elena, la responsabile dei sistemi, ti consegna lo schema progettato in classe: «<b>Adesso la rete va fatta funzionare. E quando si rompe, la ripari tu</b>».</p>
        <p>Si va <b>un passo alla volta</b>: smisti i dispositivi nelle VLAN, calcoli gli indirizzi, decidi per il firewall, poi configuri il laboratorio come in Packet Tracer e vai a caccia di un guasto. Alla fine <b>${CHAL.length} domande</b>, poi il codice da incollare nella consegna.</p>
        <p class="small">Se un passo proprio non ti riesce puoi saltarlo: nel codice risulta saltato e non vale punti.</p>
        <p><label for="w-name"><b>Il tuo nome e cognome</b></label><br><input type="text" id="w-name" autocomplete="off" value="${esc(curName())}" placeholder="Nome e cognome"></p>
        <div class="fb ko hidden" id="w-err" role="alert"></div>
        <p><button type="button" class="btn" id="w-go">Inizia →</button></p>`;
      const go1=()=>{ const v=$("#w-name").value.replace(/\s+/g," ").trim();
        if(v.length<3){ const er=$("#w-err"); er.textContent="Scrivi il tuo nome e cognome (almeno 3 lettere), poi premi Inizia."; er.classList.remove("hidden"); $("#w-name").focus(); return; }
        const old=curName(), any=STEPS.some(s=>res(s.id));
        if(old && nameKey(old)!==nameKey(v) && any && !store.get("nome0")) store.set("nome0", old);
        restoreHistory(v);
        store.set("nome", v); next(); };
      $("#w-go").onclick=go1; $("#w-name").addEventListener("keydown", e=>{ if(e.key==="Enter") go1(); }); $("#w-name").focus();
    },
    finalX(el){
      el.innerHTML = `<h2>🏁 Sfida finale · La rete dell'Istituto</h2>
        <p>Elena ti lascia da solo. <b>${CHAL.length} domande</b> in tre gruppi: VLAN e indirizzi, servizi e sicurezza, caccia al guasto.</p>
        <p>Conta la <b>prima risposta</b>. Se sbagli, leggi perché e riprova: alla fine trovi l'elenco delle cose da ripassare. Puoi anche saltare una domanda, ma vale zero.</p>
        <p class="small">Nelle domande sui guasti puoi fare tutti i ping che vuoi e aprire i dispositivi, ma non cambiare la configurazione. Durante la sfida la 🎒 Tasca resta chiusa.</p>
        <p><button type="button" class="btn" id="s-go">Inizia la sfida →</button></p>`;
      $("#s-go").onclick=next; $("#s-go").focus();
    },
    end(el){
      const t=tally();
      el.innerHTML = `<h2>${t.miss===0 && !t.skips.length?"🎉 Palestra completata":"📋 Riepilogo"}</h2>${codeBlock()}
        ${restartBox()}
        <details style="margin-top:14px"><summary class="small">Area docente: verifica un codice</summary>
          <textarea class="copy" id="r-verify" style="height:62px" aria-label="Codice da verificare"></textarea><p><button type="button" class="btn alt" id="r-vbtn">Verifica</button> <b id="r-vres" aria-live="polite"></b></p></details>`;
      $("#e-redo").onclick=e=>askRestart("sfida", e.currentTarget); $("#e-zero").onclick=e=>askRestart("zero", e.currentTarget);
      $("#r-vbtn").onclick=()=>{ const raw=$("#r-verify").value.replace(/\s+/g," ").trim(), k=raw.lastIndexOf(" | #"), r=$("#r-vres");
        if(k<0 || !new RegExp("^"+FAM+"-[A-Z]{3} \\|").test(raw)){ r.textContent="✘ Codice incompleto"; r.style.color="#b3261e"; return; }
        const ok = sig(raw.slice(0,k), raw.slice(4, raw.indexOf(" |")))===raw.slice(k+4).trim();
        r.textContent = ok ? "✔ Codice valido" : "✘ Codice NON valido: il testo è stato modificato"; r.style.color = ok ? "#1e7d3a" : "#b3261e"; };
    }
  };

  /* pulsanti */
  $("#b-check").onclick=check; $("#b-next").onclick=next; $("#b-hint").onclick=hint; $("#b-skip").onclick=skip;
  $("#l-speak").onclick=()=>{ try{ speechSynthesis.cancel(); const step=STEPS[pos];
    const txt=[$("#l-title").innerText, $("#l-theory").innerText, $("#l-task").innerText, step.quiz?step.quiz.map((o,i)=>String.fromCharCode(65+i)+". "+plain(o.t)).join(". "):""].filter(Boolean).join(". ");
    const u=new SpeechSynthesisUtterance(txt); u.lang="it-IT"; u.rate=.95; speechSynthesis.speak(u); }catch(e){} };
  /* RIAVVIO-JS inizio: scelta alla fine e avviso grande prima di cancellare il codice */
  function redoChallenge(){ CHAL.forEach(q=>store.del("r_"+q.id)); store.set("rip", rip()+1); go(idx("x0")); }
  function resetAll(){ saveHistory(); store.clear(); window.scrollTo(0,0); location.reload(); }
  function restartBox(){
    const n=curName();
    return `<div class="restart"><h3>Vuoi ricominciare?</h3>
      <p>${n?`Questo è il lavoro di <b>${esc(n)}</b>. `:""}<b>Prima incolla il codice ${RS.dove}</b>: se ricominci, il codice qui sopra si cancella e alla fine ne avrai uno nuovo.</p>
      <p><button type="button" class="btn alt" id="e-redo">↺ Rifai solo la sfida</button> <span class="rs-note">Restano il nome e i passi guidati. Rifai solo ${RS.prove} della sfida.</span></p>
      <p><button type="button" class="btn danger" id="e-zero">🗑️ Ricomincia tutto da zero</button> <span class="rs-note">Si cancella tutto, anche il nome. Serve anche quando tocca a un compagno.</span></p>
      <p class="small">Puoi ricominciare quante volte vuoi: il codice nuovo conta le ripetizioni e ricorda tutti gli errori.</p></div>`;
  }
  function askRestart(kind, opener){
    if(document.getElementById("rs-wrap")) return;
    const zero=kind==="zero", n=curName(), who=n?`il codice di ${esc(n)}`:"il codice salvato su questo computer";
    try{ speechSynthesis.cancel(); }catch(e){}
    const w=document.createElement("div"); w.id="rs-wrap"; w.className="modal rs-wrap";
    w.innerHTML=`<div class="screen warn" role="alertdialog" aria-modal="true" aria-labelledby="rs-t" aria-describedby="rs-d">
      <div class="warn-body">
        <div class="warn-ic" aria-hidden="true">⚠️</div>
        <h2 id="rs-t">${zero?"Ricominci tutto da zero?":"Rifai solo la sfida?"}</h2>
        <p class="warn-key" id="rs-d">Attenzione: <b>${zero?who:"il codice di adesso"} si perde per sempre</b>. È il codice da consegnare all'insegnante.</p>
        <p>${zero ? (n?`<b>Sei tu?</b> Prima incolla il codice ${RS.dove}. <b>Non sei tu?</b> Chiedi a ${esc(n)} se l'ha già copiato.`:`<b>È tuo?</b> Prima incolla il codice ${RS.dove}.`) : `<b>Non l'hai ancora incollato ${RS.dove}?</b> Copialo adesso.`}</p>
        <textarea class="copy" readonly aria-label="Il codice di adesso">${esc(code())}</textarea>
        <p><button type="button" class="btn alt" data-copy>📋 Copia il codice</button> <span class="rs-copied" data-copied aria-live="polite"></span></p>
        <p>${zero?`Si cancella tutto: nome, passi guidati e sfida. Se ricominci tu, il codice nuovo conta la ripetizione e ricorda gli errori di prima.`:`${RS.risp} di adesso si cancellano; nome e passi guidati restano. Se ti fermi a metà, nel codice nuovo il resto risulta non fatto. Il codice nuovo conta la ripetizione e ricorda gli errori di prima.`}</p>
      </div>
      <div class="warn-acts"><button type="button" class="btn" id="rs-no">No, lascio tutto com'è</button><button type="button" class="btn danger" id="rs-yes">🗑️ ${zero?"Sì, cancello tutto e ricomincio":"Sì, cancello e rifaccio la sfida"}</button></div></div>`;
    document.body.appendChild(w);
    const t0=Date.now(), no=w.querySelector("#rs-no"), yes=w.querySelector("#rs-yes");
    const onKey=e=>{ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if(e.key==="Tab"){ const f=[...w.querySelectorAll("button,textarea")], a=f[0], z=f[f.length-1];
        if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } } };
    const onFocus=e=>{ if(!w.contains(e.target)) no.focus({preventScroll:true}); };
    function close(back){ document.removeEventListener("keydown", onKey, true); document.removeEventListener("focusin", onFocus, true); w.remove();
      if(back && opener && document.contains(opener)) opener.focus({preventScroll:true}); }
    document.addEventListener("keydown", onKey, true); document.addEventListener("focusin", onFocus, true);
    /* i primi 600 ms non contano: il secondo colpo di un doppio clic non conferma e non chiude */
    no.onclick=()=>{ if(Date.now()-t0<600) return; close(true); };
    yes.onclick=()=>{ if(Date.now()-t0<600) return; close(false); if(zero) resetAll(); else redoChallenge(); };
    no.focus({preventScroll:true}); w.querySelector(".warn-body").scrollTop=0;
  }
  /* RIAVVIO-JS fine */
  $("#f-code").onclick=()=>{ const m=$("#modal"); m.innerHTML=`<div class="screen">${codeBlock()}<p><button type="button" class="btn alt" id="m-close">Chiudi e continua</button></p></div>`; m.classList.remove("hidden"); $("#m-close").onclick=()=>{ m.classList.add("hidden"); $("#f-code").focus(); }; $("#m-close").focus(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#modal").classList.contains("hidden")){ $("#modal").classList.add("hidden"); $("#f-code").focus(); } });
  $("#o-bes").checked=BES; document.body.classList.toggle("bes", BES);
  $("#o-bes").onchange=e=>{ BES=e.target.checked; store.set("bes", BES); document.body.classList.toggle("bes", BES); render(); };
  $("#o-reset").onclick=e=>{ if(!anyWork()){ resetAll(); return; } askRestart("zero", e.currentTarget); };
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ $("#opts").open=false; go(idx(b.dataset.jump)); });

  return {render};
})();
App.render();
</script>
</body>
</html>
