<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La rete della scuola · Sistemi e reti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
<style>
:root{--teal:#0B6E75;--teal-d:#085055;--teal-l:#E3F2F2;--orange:#D9661A;--orange-d:#9a4410;--orange-l:#FDEBDC;--ink:#1d2329;--muted:#55616a;--ok:#1e7d3a;--ok-l:#dff3e4;--ko:#b3261e;--ko-l:#fbe3e1;--bg:#fbf6ea;--line:#d5dade}
*{box-sizing:border-box}
body{margin:0;font-family:Verdana,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:20px;line-height:1.7;letter-spacing:.01em}
.hidden{display:none!important}
header{background:var(--teal);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:15px}
.hbtn{background:#fff;color:var(--teal-d);border:0;border-radius:20px;padding:6px 14px;cursor:pointer;font:inherit;font-size:16px;font-weight:bold}
.dots{max-width:760px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--teal);background:#fff}
.dot.on{background:var(--teal)}.dot.now{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-l)}
.dots span{margin-left:8px;font-size:16px;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:12px 16px 30px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.count{margin:0;font-size:15px;color:var(--muted);font-weight:bold}
h2{margin:0 0 10px;color:var(--teal-d);font-size:1.45em;line-height:1.3;outline:none}
.scene{background:#f3f8f8;border:2px solid var(--teal-l);border-radius:14px;padding:6px;margin:0 0 14px}
.scene svg{display:block;width:100%;height:auto}
.say{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.say p{margin:0;flex:1;max-width:32em}
.say .q{font-weight:bold;font-size:1.08em}
.spk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--teal);background:#fff;font-size:20px;cursor:pointer;line-height:1}
.spk:hover{background:var(--teal-l)}
.btn{background:var(--teal);color:#fff;border:0;padding:14px 22px;border-radius:12px;font:inherit;font-weight:bold;cursor:pointer}
.btn:hover{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);border:2px solid var(--teal);padding:10px 16px;font-weight:normal;font-size:.85em}
.btn.act{background:var(--orange);font-size:1.1em;border:4px solid var(--orange-d);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,102,26,.55)}50%{box-shadow:0 0 0 12px rgba(217,102,26,0)}}
@media(prefers-reduced-motion:reduce){.btn.act{animation:none;box-shadow:0 0 0 5px var(--orange-l)}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:6px 0 0}
.opt{position:relative}
.pick{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:4px solid var(--teal);border-radius:16px;padding:14px 10px 12px;font:inherit;font-weight:bold;color:var(--ink);cursor:pointer;text-align:center;line-height:1.35}
.pick svg{width:104px;height:104px}
.pick:hover{background:var(--teal-l)}
.pick.right{border-color:var(--ok);background:var(--ok-l)}
.pick.wrong{border-color:#9aa4ab;border-style:dashed;background:#f1f2f3;color:#6b767e;cursor:default}
.pick.wrong svg{opacity:.35}
.pick .mk{font-size:.85em}
.pick.right .mk{color:var(--ok)}.pick.wrong .mk{color:var(--ko)}
.opt .spk{position:absolute;top:8px;right:8px;width:40px;height:40px;font-size:17px}
.fb{border-radius:12px;padding:12px 16px;margin:14px 0 0}
.fb.ok{background:var(--ok-l);color:#14532b}.fb.ko{background:var(--orange-l);color:#6b2f0a}
.word{display:flex;gap:14px;align-items:center;border:3px solid var(--teal);border-radius:14px;padding:10px 14px;margin:14px 0 0;background:var(--teal-l)}
.word svg{width:70px;height:70px;flex:none}
.word small{display:block;color:var(--teal-d);font-weight:bold;font-size:.75em}
.word b{font-size:1.15em}.word span{display:block;line-height:1.45}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.words .word{margin:0}
.next{margin-top:16px}
input[type=text]{font:inherit;padding:10px 12px;border:3px solid var(--line);border-radius:10px;width:100%;max-width:400px}
textarea.copy{width:100%;height:110px;font-family:"Courier New",monospace;font-size:15px;padding:8px;border:3px solid var(--line);border-radius:10px}
.stars{font-size:1.2em;font-weight:bold;color:var(--teal-d)}
.small{font-size:15px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .sheet{max-width:720px;width:100%;max-height:92vh;overflow:auto}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.linkbtn{background:none;border:0;color:var(--teal-d);text-decoration:underline;cursor:pointer;font:inherit;padding:4px 0}
details summary{cursor:pointer}
@media(max-width:520px){body{font-size:18px}.sheet{padding:16px 14px}.pick svg{width:84px;height:84px}.opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<header>
  <h1>🏫 La rete della scuola</h1>
  <div class="who"><span id="h-name"></span><button type="button" class="hbtn" id="b-words">📖 Le mie parole</button></div>
</header>
<div class="dots" id="dots" aria-hidden="true"></div>
<main><section class="sheet" id="app" aria-live="polite"></section></main>
<footer>
  <button type="button" class="linkbtn" id="f-code">📋 Il mio codice (anche se non ho finito)</button>
  <button type="button" class="linkbtn" id="f-reset">Nuovo studente: cancella tutto</button>
  <details><summary>Solo docente</summary><p class="small">Vai a: <button type="button" class="linkbtn" data-jump="g1">inizio</button> · <button type="button" class="linkbtn" data-jump="g4">passo 4</button> · <button type="button" class="linkbtn" data-jump="r">ripasso</button> · <button type="button" class="linkbtn" data-jump="x1">domande</button>. I passi saltati così nel codice risultano non fatti.</p></details>
</footer>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<noscript><p style="padding:20px">Per usare la palestra serve JavaScript attivo nel browser.</p></noscript>

<script>
"use strict";
/* =====================================================================
   Palestra BES della lezione sulla rete dell'Istituto.
   Regole di scrittura: una frase per volta, al massimo 15 parole;
   una parola nuova per passo; risposte a carte con disegno.
   ===================================================================== */
const $ = s => document.querySelector(s);
const PFX = "sirreb_", mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(PFX+k); if(v!==null) return JSON.parse(v); }catch(e){} return k in mem ? mem[k] : null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(PFX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(PFX+k); }catch(e){} },
  clear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(PFX)).forEach(k=>localStorage.removeItem(k)); }catch(e){} for(const k in mem) delete mem[k]; }
};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
const plain = h => { const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); };
function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="it-IT"; u.rate=.85; speechSynthesis.speak(u); }catch(e){} }

/* =====================================================================
   DISEGNI
   ===================================================================== */
const T="#0B6E75", TD="#085055", D="#34424c", G="#c3cacf", GD="#7a8790", O="#D9661A", R="#b3261e", K="#1e7d3a", L="#d9e6ea", W="#ffffff", B="#2563eb", P="#ea580c";
const srv = (x,y,on=true,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-26" y="-20" width="52" height="40" rx="6" fill="${on?T:G}" stroke="${on?TD:GD}" stroke-width="2"/><path d="M-17 -8h24M-17 1h24M-17 10h24" stroke="${W}" stroke-width="2.5" opacity=".85"/><circle cx="16" cy="-8" r="4" fill="${on?"#8df0a0":GD}"/>${on?"":`<path d="M-10 -10l20 20M10 -10l-20 20" stroke="${R}" stroke-width="6" stroke-linecap="round"/>`}</g>`;
const pc = (x,y,c=D,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-16" y="-13" width="32" height="22" rx="3" fill="${c}"/><rect x="-13" y="-10" width="26" height="16" fill="${L}"/><rect x="-21" y="10" width="42" height="5" rx="2.5" fill="${c}"/></g>`;
const man = (x,y,c=D,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-12" r="6.5" fill="${c}"/><path d="M-10 13c0-11 3-16 10-16s10 5 10 16z" fill="${c}"/></g>`;
const wire = (x1,y1,x2,y2,c=GD,dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="3.5"${dash?' stroke-dasharray="8 7"':""} stroke-linecap="round"/>`;
const lab = (x,y,t,c=D,sz=17) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="${sz}" font-weight="700" fill="${c}">${t}</text>`;
const cross = (x,y) => `<path d="M${x-11} ${y-11}l22 22M${x+11} ${y-11}l-22 22" stroke="${R}" stroke-width="6" stroke-linecap="round"/>`;
const check = (x,y) => `<path d="M${x-11} ${y}l8 8 15-16" fill="none" stroke="${K}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
/* switch: scatola larga con le porte */
const sw = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-44" y="-15" width="88" height="30" rx="5" fill="${T}" stroke="${TD}" stroke-width="2"/>${[-32,-20,-8,4,16,28].map(d=>`<rect x="${d}" y="-6" width="8" height="8" rx="1" fill="${W}"/>`).join("")}<circle cx="37" cy="-7" r="2.5" fill="#8df0a0"/></g>`;
/* router: disco con le frecce */
const router = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="30" ry="18" fill="${TD}"/><path d="M-16 -4h12l-4 -4M16 4h-12l4 4" stroke="${W}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
/* firewall: muro di mattoni */
const wall = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-24" y="-32" width="48" height="64" rx="3" fill="${O}"/>${[-24,-8,8,24].map((dy,i)=>`<path d="M-24 ${dy}h48" stroke="${W}" stroke-width="2.5"/>${(i%2?[-8,8]:[0]).map(dx=>`<path d="M${dx} ${dy-16}v16" stroke="${W}" stroke-width="2.5"/>`).join("")}`).join("")}</g>`;
const cloud = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 14a14 14 0 0 1 2-28a20 20 0 0 1 36-6a15 15 0 0 1 22 18a10 10 0 0 1 -2 16z" fill="${L}" stroke="${GD}" stroke-width="3"/>${lab(0,6,"Internet",D,12)}</g>`;
const phone = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-17" y="-29" width="34" height="58" rx="6" fill="${D}"/><rect x="-13" y="-23" width="26" height="42" rx="2" fill="${L}"/><path d="M-8 -6a12 12 0 0 1 16 0M-4 -1a6 6 0 0 1 8 0" stroke="${T}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cy="4" r="2.5" fill="${T}"/><circle cy="24" r="2" fill="${GD}"/></g>`;
const disk = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-20" y="-24" width="40" height="48" rx="6" fill="${D}"/><rect x="-13" y="-17" width="26" height="14" rx="2" fill="${L}"/><circle cy="10" r="7" fill="${GD}"/><circle cy="10" r="2.5" fill="${D}"/></g>`;
const bug = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="13" ry="16" fill="${R}"/><circle cy="-18" r="7" fill="${R}"/>${[-8,0,8].map(d=>`<path d="M-12 ${d}h-10M12 ${d}h10" stroke="${R}" stroke-width="3" stroke-linecap="round"/>`).join("")}<path d="M0 -12v26" stroke="${W}" stroke-width="2"/></g>`;
const lock = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-11 -4v-8a11 11 0 0 1 22 0v8" fill="none" stroke="${D}" stroke-width="5"/><rect x="-17" y="-5" width="34" height="27" rx="5" fill="${K}"/><circle cy="7" r="4" fill="${W}"/></g>`;
const eye = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-26 0c8-13 17-18 26-18s18 5 26 18c-8 13-17 18-26 18S-18 13-26 0z" fill="${W}" stroke="${D}" stroke-width="4"/><circle r="8" fill="${R}"/></g>`;
const printer = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="-24" width="28" height="14" fill="${W}" stroke="${D}" stroke-width="2.5"/><rect x="-24" y="-12" width="48" height="24" rx="4" fill="${D}"/><rect x="-14" y="6" width="28" height="16" fill="${W}" stroke="${D}" stroke-width="2.5"/></g>`;
const board = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-28" y="-18" width="56" height="34" rx="3" fill="${W}" stroke="${D}" stroke-width="4"/><path d="M-16 -4h22M-16 5h14" stroke="${T}" stroke-width="3" stroke-linecap="round"/><path d="M0 16v10M-10 26h20" stroke="${D}" stroke-width="4" stroke-linecap="round"/></g>`;
/* un gruppo colorato di computer */
const group = (x,y,c,name,n=2) => `<rect x="${x-62}" y="${y-30}" width="124" height="84" rx="12" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="3"/>` + Array.from({length:n},(_,i)=>pc(x+(i-(n-1)/2)*48,y,c)).join("") + lab(x,y+42,name,c,14);
const icon = inner => `<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">${inner}</svg>`;
const I = {
  sw:      icon(sw(32,32,.66)),
  router:  icon(router(32,32,.95)),
  wall:    icon(wall(32,32,.85)),
  printer: icon(printer(32,34,1)),
  pc:      icon(pc(32,30,D,1.4)),
  board:   icon(board(32,30,1)),
  eye:     icon(eye(32,32,1.05)),
  lock:    icon(lock(32,34,1.2)),
  groups:  icon(`<rect x="3" y="14" width="26" height="36" rx="5" fill="${B}" fill-opacity=".2" stroke="${B}" stroke-width="3"/><rect x="35" y="14" width="26" height="36" rx="5" fill="${P}" fill-opacity=".2" stroke="${P}" stroke-width="3"/>`+pc(16,32,B,.6)+pc(48,32,P,.6)),
  guest:   icon(phone(22,32,.85)+man(47,38,O,1.1)),
  office:  icon(srv(32,30,true,.9)+lock(48,46,.55)),
  disk:    icon(disk(32,32,1)),
  broken:  icon(srv(32,32,false)),
  backup:  icon(srv(22,26,true,.6)+disk(44,40,.62)),
  cloud:   icon(cloud(32,34,.8))
};
const scene = (inner,label,h=230) => `<svg viewBox="0 0 480 ${h}" role="img" aria-label="${label}">${inner}</svg>`;
/* scene ricorrenti */
const swScene = () => [80,180,300,400].map(x=>wire(x,170,240,96)).join("") + sw(240,80,1.4) + [80,180,300,400].map(x=>pc(x,180)).join("") + lab(240,36,"Switch");
const vlanScene = split => split
  ? wire(160,120,240,64,B)+wire(320,120,240,64,P)+sw(240,52,1.2)+group(130,130,B,"Segreteria")+group(350,130,P,"Studenti")+cross(240,140)
  : wire(160,120,240,64)+wire(320,120,240,64)+sw(240,52,1.2)+group(130,130,GD,"Segreteria")+group(350,130,GD,"Studenti");
const netScene = on => sw(80,110,1) + wire(126,110,186,110) + router(220,110,1.2) + wire(258,110,330,110,on?K:GD,!on) + cloud(390,110,1.6) + lab(80,62,"Scuola") + lab(220,62,"Router") + (on?check(295,80):"");
const fwScene = tried => man(70,120,R,1.6) + lab(70,190,"Estraneo",R,15) + wire(100,112,200,112,tried?R:GD,true) + wall(240,112,1.2) + lab(240,40,"Firewall",O,15) + wire(280,112,370,112) + srv(410,112,true,1.1) + lab(410,170,"Dati della",D,14) + lab(410,188,"segreteria",D,14) + (tried?cross(175,112):"");
const wifiScene = () => phone(240,110,1.6) + `<rect x="20" y="40" width="150" height="140" rx="12" fill="${O}" fill-opacity=".12" stroke="${O}" stroke-width="3"/>` + man(95,100,O,1.4) + lab(95,160,"Rete ospiti",O,15) + `<rect x="310" y="40" width="150" height="140" rx="12" fill="${K}" fill-opacity=".1" stroke="${K}" stroke-width="3"/>` + srv(385,100,true,1) + lock(415,128,.6) + lab(385,160,"Segreteria",K,15);
const bkScene = hit => srv(150,100,!hit,1.5) + lab(150,40,"Computer") + disk(340,100,1.4) + lab(340,40,"Copia") + (hit?bug(150,165,.9)+check(340,175):"") + wire(200,100,300,100,GD,true);

/* =====================================================================
   PAROLE (una per passo, sei in tutto)
   ===================================================================== */
const WORDS = {
  sw:{k:"Switch",       ic:I.sw,     d:"Collega con i cavi i computer della scuola."},
  vl:{k:"VLAN",         ic:I.groups, d:"Gruppi separati: non si vedono tra loro."},
  ro:{k:"Router",       ic:I.router, d:"Porta la scuola su Internet."},
  fw:{k:"Firewall",     ic:I.wall,   d:"Il guardiano: decide chi può passare."},
  os:{k:"Rete ospiti",  ic:I.guest,  d:"Il Wi-Fi per chi viene da fuori."},
  bk:{k:"Backup",       ic:I.backup, d:"Una copia dei dati, tenuta al sicuro."}
};
const ORDER = ["sw","vl","ro","fw","os","bk"];
const wordCard = (w,lbl) => `<div class="word">${w.ic}<div>${lbl?`<small>${lbl}</small>`:""}<b>${w.k}</b><span>${w.d}</span></div></div>`;

/* =====================================================================
   PASSI
   acts = gesti da fare, uno per volta (il pulsante lampeggia)
   qs   = domande del passo; opts = carte con disegno
   ===================================================================== */
const STEPS = [
 {id:"w", screen:"welcome"},

 {id:"g1", phase:"g", title:"Tutti collegati", words:["sw"],
  scene:()=>scene(swScene(),"Quattro computer collegati con i cavi a uno switch."),
  say:"Nella scuola ci sono tanti computer. Ogni cavo arriva a una scatola: lo switch.",
  qs:[{q:"Che cosa collega i computer?", opts:[{ic:I.printer,t:"La stampante",fb:"La stampante stampa i fogli. Guarda dove arrivano i cavi."},{ic:I.sw,t:"Lo switch",ok:true}]}],
  done:"Lo switch collega con i cavi i computer della scuola."},

 {id:"g2", phase:"g", title:"Gruppi separati", words:["vl"],
  scene:a=>scene(vlanScene(a>=1),"Lo switch con due gruppi di computer: segreteria e studenti."),
  say:"Segreteria e studenti usano lo stesso switch. Per ora si vedono tutti.",
  acts:[{label:"🎨 Separa i due gruppi", after:"Adesso sono due gruppi, di due colori. Lo switch è sempre uno."}],
  qs:[{q:"Gli studenti vedono i dati della segreteria?", opts:[{ic:I.eye,t:"Sì, li vedono",fb:"Guarda la croce rossa tra i due gruppi."},{ic:I.lock,t:"No, sono separati",ok:true}]}],
  done:"Due gruppi separati sullo stesso switch: si chiamano VLAN."},

 {id:"g3", phase:"g", title:"Verso Internet", words:["ro"],
  scene:a=>scene(netScene(a>=1),"La scuola, il router e Internet.",200),
  say:"La scuola vuole andare su Internet.",
  acts:[{label:"🌐 Collega a Internet", after:"Il cavo verde va dal router a Internet."}],
  qs:[{q:"Chi porta la scuola su Internet?", opts:[{ic:I.router,t:"Il router",ok:true},{ic:I.board,t:"La lavagna",fb:"La lavagna serve per la lezione. Cerca l'apparecchio tra la scuola e Internet."}]}],
  done:"Il router collega la scuola a Internet."},

 {id:"g4", phase:"g", title:"Il guardiano", words:["fw"],
  scene:a=>scene(fwScene(a>=1),"Un estraneo, un muro arancione e i dati della segreteria.",210),
  say:"Un estraneo vuole i dati della segreteria. In mezzo c'è un muro arancione.",
  acts:[{label:"🚶 L'estraneo prova a entrare", after:"Stop! Il muro non lo fa passare."}],
  qs:[{q:"Chi ha fermato l'estraneo?", opts:[{ic:I.sw,t:"Lo switch",fb:"Lo switch collega i computer. Il muro arancione è un'altra cosa."},{ic:I.wall,t:"Il firewall",ok:true}]}],
  done:"Il firewall è il guardiano: decide chi può passare."},

 {id:"g5", phase:"g", title:"Il Wi-Fi degli ospiti", words:["os"],
  scene:()=>scene(wifiScene(),"Uno smartphone. A sinistra la rete ospiti, a destra la segreteria.",220),
  say:"Un genitore aspetta il colloquio. Vuole usare il Wi-Fi con il telefono.",
  qs:[{q:"A quale rete lo colleghi?", opts:[{ic:I.guest,t:"Alla rete ospiti",ok:true},{ic:I.office,t:"Alla rete della segreteria",fb:"La segreteria ha dati importanti. Per chi viene da fuori c'è un'altra rete."}]}],
  done:"Chi viene da fuori usa la rete ospiti: ha Internet, ma non vede la scuola."},

 {id:"g6", phase:"g", title:"La copia di sicurezza", words:["bk"],
  scene:a=>scene(bkScene(a>=1),"Un computer e un disco con la copia dei dati.",220),
  say:"I dati sono sul computer. Ogni sera se ne fa una copia su un disco.",
  acts:[{label:"🦠 Arriva un virus", after:"Il virus ha rotto il computer. Il disco è staccato: è salvo."}],
  qs:[{q:"Da dove riprendi i dati?", opts:[{ic:I.broken,t:"Dal computer rotto",fb:"Il computer ha la croce rossa. Cerca la copia."},{ic:I.disk,t:"Dalla copia sul disco",ok:true}]}],
  done:"La copia di sicurezza si chiama backup."},

 {id:"r", screen:"review"},

 {id:"x1", phase:"x", code:"D1", scene:()=>scene(swScene(),"Computer collegati a uno switch."),
  q:"Come si chiama la scatola che collega i computer?",
  opts:[{ic:I.sw,t:"Switch",ok:true},{ic:I.router,t:"Router"}], why:"Lo switch collega i computer della scuola."},
 {id:"x2", phase:"x", code:"D2", scene:()=>scene(vlanScene(true),"Due gruppi separati sullo stesso switch."),
  q:"Due gruppi separati sullo stesso switch. Come si chiamano?",
  opts:[{ic:I.backup,t:"Backup"},{ic:I.groups,t:"VLAN",ok:true}], why:"Gruppi separati sullo stesso switch: VLAN."},
 {id:"x3", phase:"x", code:"D3", scene:()=>scene(netScene(true),"La scuola collegata a Internet.",200),
  q:"Chi collega la scuola a Internet?",
  opts:[{ic:I.router,t:"Router",ok:true},{ic:I.printer,t:"Stampante"}], why:"Il router porta la scuola su Internet."},
 {id:"x4", phase:"x", code:"D4", scene:()=>scene(fwScene(true),"Un estraneo fermato dal muro.",210),
  q:"Un estraneo vuole i dati della segreteria. Chi lo ferma?",
  opts:[{ic:I.sw,t:"Switch"},{ic:I.wall,t:"Firewall",ok:true}], why:"Il firewall decide chi può passare."},
 {id:"x5", phase:"x", code:"D5", scene:()=>scene(wifiScene(),"Uno smartphone tra due reti.",220),
  q:"Un ospite vuole Internet. Che rete gli dai?",
  opts:[{ic:I.guest,t:"Rete ospiti",ok:true},{ic:I.office,t:"Rete della segreteria"}], why:"Chi viene da fuori usa la rete ospiti."},
 {id:"x6", phase:"x", code:"D6", scene:()=>scene(bkScene(true),"Un virus sul computer, la copia salva sul disco.",220),
  q:"Un virus rompe i dati. Che cosa ti salva?",
  opts:[{ic:I.pc,t:"Un computer nuovo"},{ic:I.backup,t:"Il backup",ok:true}], why:"Il backup è una copia dei dati, tenuta al sicuro."},

 {id:"f", screen:"phrase"},
 {id:"end", screen:"end"}
];
const GUIDED = STEPS.filter(s=>s.phase==="g"), CHAL = STEPS.filter(s=>s.phase==="x");
const idx = id => STEPS.findIndex(s=>s.id===id);
const PHRASE = {q:"Le VLAN servono a…", opts:[{ic:I.cloud,t:"andare più veloci su Internet"},{ic:I.groups,t:"tenere separati i gruppi di computer",ok:true}], why:"Le VLAN tengono separati i gruppi: la segreteria è al sicuro."};

/* =====================================================================
   CODICE RISULTATO · stessa firma delle altre palestre (djb2, base 36)
   ===================================================================== */
const FAM = "SIR", TOOL = "REB";
function sig(s, tag){ let h=5381; const t=FAM+"*"+s+"*"+tag; for(let k=0;k<t.length;k++){ h=((h<<5)+h+t.charCodeAt(k))>>>0; } return h.toString(36).toUpperCase().slice(-5).padStart(5,"0"); }

/* =====================================================================
   APP
   ===================================================================== */
const App = (()=>{
  let pos = Math.min(Math.max(0, +store.get("pos")||0), STEPS.length-1), S={};
  const res = id => store.get("r_"+id);
  const curName = () => (store.get("nome")||"").replace(/\s+/g," ").trim();
  const rip = () => +store.get("rip")||0;
  const app = $("#app");

  function go(i){ pos=i; store.set("pos", i); S={a:0, qi:0, err:0, off:[], right:false, first:null}; render(); window.scrollTo(0,0); const h=app.querySelector("h2"); if(h) h.focus({preventScroll:true}); }
  const next = () => { if(pos<STEPS.length-1) go(pos+1); };

  function dots(){
    const work=[...GUIDED,...CHAL], cur=STEPS[pos], k=work.indexOf(cur), doneN = k>=0 ? k : (cur.id==="w" ? 0 : cur.id==="r" ? GUIDED.length : work.length);
    const left=work.length-doneN;
    $("#dots").innerHTML = work.map((s,i)=>`<i class="dot${i<doneN?" on":""}${i===k?" now":""}"></i>`).join("") + `<span>${left===0?"Hai finito!":left===1?"Ti manca 1 passo":"Ti mancano "+left+" passi"}</span>`;
    $("#h-name").textContent = curName();
  }
  const sayBox = (ctx,q) => `<div class="say"><div style="flex:1">${ctx?`<p>${ctx}</p>`:""}${q?`<p class="q">${q}</p>`:""}</div><button type="button" class="spk" data-say aria-label="Ascolta il testo" title="Ascolta">🔊</button></div>`;
  function optsBox(opts){
    return `<div class="opts" role="group" aria-label="Risposte">${opts.map((o,i)=>{ const off=S.off.includes(i), ok=S.right && o.ok;
      return `<div class="opt"><button type="button" class="pick${off?" wrong":""}${ok?" right":""}" data-i="${i}"${off||S.right?" disabled":""}>${o.ic}<span>${o.t}</span>${off?`<span class="mk">✗ non è questa</span>`:ok?`<span class="mk">✔ giusto</span>`:""}</button><button type="button" class="spk" data-opt="${i}" aria-label="Ascolta: ${esc(o.t)}" title="Ascolta">🔊</button></div>`; }).join("")}</div>`;
  }
  function bind(opts, onPick){
    app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak([...b.parentNode.querySelectorAll("p")].map(p=>p.textContent).join(" ")));
    app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>speak(opts[+b.dataset.opt].t));
    app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>onPick(+b.dataset.i));
    const n=app.querySelector("#b-next"); if(n){ n.onclick=S.onNext; n.focus({preventScroll:true}); }
    const a=app.querySelector("#b-act"); if(a) a.onclick=()=>{ S.a++; render(); const f=app.querySelector("#b-act") || app.querySelector(".pick:not([disabled])"); if(f) f.focus({preventScroll:true}); };
  }

  /* ---- un passo guidato ---- */
  function guided(step){
    const acts=step.acts||[], inActs=S.a<acts.length, q=step.qs[S.qi], last=S.qi===step.qs.length-1, finished=S.right && last;
    const ctx = S.a===0 ? step.say : acts[S.a-1].after;
    let h = `<p class="count">Passo ${GUIDED.indexOf(step)+1} di ${GUIDED.length}</p><h2 tabindex="-1">${step.title}</h2>`;
    if(step.scene) h += `<div class="scene">${step.scene(S.a)}</div>`;
    if(inActs) h += sayBox(ctx, "Premi il pulsante arancione.") + `<p><button type="button" class="btn act" id="b-act">${acts[S.a].label}</button></p>`;
    else {
      h += sayBox(S.qi===0 ? ctx : "", q.q) + optsBox(q.opts);
      if(S.fb) h += `<div class="fb ko" role="status">${S.fb}</div>`;
      if(S.right) h += `<div class="fb ok" role="status">✔ Giusto! ${finished ? step.done : ""}</div>`;
      if(finished && step.words) h += step.words.map(w=>wordCard(WORDS[w],"Parola nuova")).join("");
      if(S.right) h += `<p class="next"><button type="button" class="btn" id="b-next">Avanti →</button></p>`;
    }
    app.innerHTML = h;
    S.onNext = () => { if(!last){ S.qi++; S.off=[]; S.right=false; S.fb=""; render(); const f=app.querySelector(".pick"); if(f) f.focus({preventScroll:true}); } else next(); };
    bind(q.opts, i=>{ const o=q.opts[i];
      if(o.ok){ S.right=true; S.fb=""; if(last) store.set("r_"+step.id, {ok:1, err:S.err}); }
      else { S.err++; S.off.push(i); S.fb="Non è questa. "+(o.fb||q.fb||"Riprova con un'altra carta."); }
      render(); });
  }
  /* ---- una domanda finale: conta la prima risposta ---- */
  function question(step, cfg){
    const q = cfg || step;
    let h = cfg ? `<p class="count">Ultima cosa</p><h2 tabindex="-1">Completa la frase</h2>` : `<p class="count">Domanda ${CHAL.indexOf(step)+1} di ${CHAL.length}</p><h2 tabindex="-1">Domanda ${CHAL.indexOf(step)+1}</h2><div class="scene">${step.scene()}</div>`;
    h += sayBox("", q.q) + optsBox(q.opts);
    if(S.right) h += `<div class="fb ok" role="status">${S.first?"✔ Giusto al primo colpo! ":"✔ Adesso è giusta. "}${q.why}</div><p class="next"><button type="button" class="btn" id="b-next">Avanti →</button></p>`;
    else if(S.fb) h += `<div class="fb ko" role="status">${S.fb}</div>`;
    app.innerHTML = h; S.onNext = next;
    bind(q.opts, i=>{ const o=q.opts[i];
      if(S.first===null){ S.first=!!o.ok; if(!res(step.id)) store.set("r_"+step.id, {first:S.first}); }
      if(o.ok) S.right=true; else { S.off.push(i); S.fb="Non è questa. Guarda bene il disegno e tocca l'altra carta."; }
      render(); });
  }

  /* ---- schermate ---- */
  const SCREENS = {
    welcome(){
      app.innerHTML = `<h2 tabindex="-1">La rete della scuola</h2>
        <div class="scene">${scene(netScene(true),"La scuola, il router e Internet.",200)}</div>
        ${sayBox("Oggi scopri come sono collegati i computer della scuola.","Ci sono 6 passi e 6 domande. Vai con calma: non c'è tempo.")}
        <ul><li>Il pulsante 🔊 legge il testo.</li><li>In alto, 📖 <b>Le mie parole</b> ti ricorda le parole nuove.</li><li>Se sbagli, riprovi.</li></ul>
        <p><label for="w-name"><b>Scrivi nome e cognome</b></label><br><input type="text" id="w-name" autocomplete="off" value="${esc(curName())}"></p>
        <div class="fb ko hidden" id="w-err" role="alert">Scrivi il tuo nome e cognome, poi premi Inizia.</div>
        <p><button type="button" class="btn" id="w-go">Inizia →</button></p>`;
      const start=()=>{ const v=$("#w-name").value.replace(/\s+/g," ").trim(); if(v.length<3){ $("#w-err").classList.remove("hidden"); $("#w-name").focus(); return; } store.set("nome", v); next(); };
      $("#w-go").onclick=start; $("#w-name").addEventListener("keydown", e=>{ if(e.key==="Enter") start(); });
      app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak([...b.parentNode.querySelectorAll("p")].map(p=>p.textContent).join(" ")));
    },
    review(){
      app.innerHTML = `<p class="count">Ripasso</p><h2 tabindex="-1">Le tue 6 parole</h2>
        ${sayBox("Hai finito i passi. Bravo!","Rileggi le parole. Poi ci sono 6 domande.")}
        <div class="words">${ORDER.map(k=>`<div style="position:relative">${wordCard(WORDS[k])}<button type="button" class="spk" data-w="${k}" style="position:absolute;top:8px;right:8px;width:40px;height:40px;font-size:17px" aria-label="Ascolta: ${WORDS[k].k}">🔊</button></div>`).join("")}</div>
        <p class="small">Durante le domande puoi riaprire 📖 Le mie parole.</p>
        <p class="next"><button type="button" class="btn" id="b-next">Vai alle domande →</button></p>`;
      $("#b-next").onclick=next;
      app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak([...b.parentNode.querySelectorAll("p")].map(p=>p.textContent).join(" ")));
      app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>speak(WORDS[b.dataset.w].k+". "+WORDS[b.dataset.w].d));
    },
    phrase(){ question(STEPS[pos], PHRASE); },
    end(){
      const t=tally();
      app.innerHTML = `<h2 tabindex="-1">🎉 Hai finito!</h2>${summary()}
        <div style="border:2px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:18px"><p><b>Vuoi rifare?</b> Prima incolla il codice nella consegna: se ricominci, questo codice si cancella.</p>
        <p><button type="button" class="btn alt" id="e-redo">↺ Rifaccio solo le domande</button> <button type="button" class="btn alt" id="e-zero">🗑️ Ricomincio tutto</button></p></div>
        <details style="margin-top:14px"><summary class="small">Area docente: verifica un codice</summary>
          <textarea class="copy" id="r-verify" style="height:70px" aria-label="Codice da verificare"></textarea><p><button type="button" class="btn alt" id="r-vbtn">Verifica</button> <b id="r-vres" aria-live="polite"></b></p></details>`;
      $("#e-redo").onclick=()=>{ if(!confirm("Rifai le domande?\n\nIl codice di adesso si cancella. L'hai già incollato nella consegna?")) return; CHAL.forEach(q=>store.del("r_"+q.id)); store.del("r_f"); store.set("rip", rip()+1); go(idx("x1")); };
      $("#e-zero").onclick=resetAll;
      $("#r-vbtn").onclick=()=>{ const raw=$("#r-verify").value.replace(/\s+/g," ").trim(), k=raw.lastIndexOf(" | #"), r=$("#r-vres");
        if(k<0 || !new RegExp("^"+FAM+"-[A-Z]{3} \\|").test(raw)){ r.textContent="✘ Codice incompleto"; r.style.color=R; return; }
        const ok = sig(raw.slice(0,k), raw.slice(4, raw.indexOf(" |")))===raw.slice(k+4).trim();
        r.textContent = ok ? "✔ Codice valido" : "✘ Codice NON valido: il testo è stato modificato"; r.style.color = ok ? K : R; };
    }
  };

  /* ---- riepilogo e codice ---- */
  function tally(){ const g=GUIDED.map(s=>res(s.id)), x=CHAL.map(s=>res(s.id)), f=res("f");
    return {gok:g.filter(Boolean).length, gerr:g.reduce((a,r)=>a+(r?r.err||0:0),0), xok:x.filter(r=>r && r.first).length, xdone:x.filter(Boolean).length,
            xbad:CHAL.filter(s=>{ const r=res(s.id); return r && !r.first; }).map(s=>s.code), f}; }
  function code(){ const t=tally();
    const parts=[FAM+"-"+TOOL, curName()||"(nome non inserito)", `PASSI ${t.gok}/${GUIDED.length}`, `tentativi sbagliati nei passi ${t.gerr}`,
      `DOMANDE ${t.xok}/${CHAL.length}`+(t.xdone<CHAL.length?` (${CHAL.length-t.xdone} non fatte)`:""), "sbagliate "+(t.xbad.length?t.xbad.join(" "):"-"),
      "FRASE "+(t.f ? (t.f.first?"giusta":"sbagliata") : "non fatta"), "ripetizioni "+rip(), "palestra BES"];
    const body=parts.join(" | "); return body+" | #"+sig(body, TOOL); }
  function summary(){ const t=tally();
    return `<p class="stars">⭐ Passi fatti: ${t.gok} su ${GUIDED.length}<br>⭐ Domande giuste al primo colpo: ${t.xok} su ${CHAL.length}</p>
      <h3 style="margin:14px 0 4px">Il tuo codice</h3><p>Premi <b>Copia il codice</b>. Poi incollalo nella consegna di Classroom.</p>
      <textarea class="copy" readonly aria-label="Codice risultato">${esc(code())}</textarea>
      <p><button type="button" class="btn" data-copy>📋 Copia il codice</button> <b data-copied aria-live="polite" style="color:var(--ok)"></b></p>`; }
  document.addEventListener("click", e=>{ const b=e.target.closest("[data-copy]"); if(!b) return;
    const box=b.closest(".sheet").querySelector("textarea.copy"), out=b.parentNode.querySelector("[data-copied]"), ok=()=>{ out.textContent="Copiato ✓ Ora incollalo nella consegna."; };
    const fb=()=>{ box.focus(); box.select(); try{ document.execCommand("copy"); ok(); }catch(err){ out.textContent="Seleziona il codice e copialo a mano."; } };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(box.value).then(ok, fb); else fb(); });
  function resetAll(){ const any=STEPS.some(s=>res(s.id));
    if(any && !confirm("Cancello tutto: nome, passi e codice.\n\nIl codice è già stato incollato nella consegna?")) return;
    store.clear(); location.reload(); }

  /* ---- finestre ---- */
  function modal(html){ const m=$("#modal"); m.innerHTML=`<div class="sheet">${html}<p class="next"><button type="button" class="btn" id="m-close">Chiudi</button></p></div>`; m.classList.remove("hidden");
    const back=document.activeElement; $("#m-close").onclick=()=>{ m.classList.add("hidden"); try{ speechSynthesis.cancel(); }catch(e){} if(back && back.focus) back.focus(); }; $("#m-close").focus();
    m.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>speak(WORDS[b.dataset.w].k+". "+WORDS[b.dataset.w].d)); }
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#modal").classList.contains("hidden")) $("#m-close").click(); });
  $("#b-words").onclick=()=>{ const all = pos>=idx("r"), known = ORDER.filter(k=>all || GUIDED.some(s=>s.words && s.words.includes(k) && res(s.id)));
    modal(`<h2>📖 Le mie parole</h2>${known.length ? `<div class="words">${known.map(k=>`<div style="position:relative">${wordCard(WORDS[k])}<button type="button" class="spk" data-w="${k}" style="position:absolute;top:8px;right:8px;width:40px;height:40px;font-size:17px" aria-label="Ascolta: ${WORDS[k].k}">🔊</button></div>`).join("")}</div>` : "<p>Ancora nessuna parola. Arrivano una alla volta, dopo ogni passo.</p>"}`); };
  $("#f-code").onclick=()=>modal(`<h2>📋 Il mio codice</h2>${summary()}`);
  $("#f-reset").onclick=resetAll;
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>go(idx(b.dataset.jump)));

  function render(){ dots(); try{ speechSynthesis.cancel(); }catch(e){}
    const step=STEPS[pos];
    if(step.screen) SCREENS[step.screen](); else if(step.phase==="g") guided(step); else question(step); }
  S={a:0, qi:0, err:0, off:[], right:false, first:null};
  return {render};
})();
App.render();
</script>
</body>
</html>
