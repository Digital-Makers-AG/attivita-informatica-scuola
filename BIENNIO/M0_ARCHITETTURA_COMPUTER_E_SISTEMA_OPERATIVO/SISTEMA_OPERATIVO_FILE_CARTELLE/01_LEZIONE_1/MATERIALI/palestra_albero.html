<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Albero dei file · Sistema operativo, file e cartelle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--teal:#0B6E75;--teal-d:#085055;--teal-l:#E3F2F2;--orange:#D9661A;--orange-d:#9a4410;--orange-l:#FDEBDC;--ink:#1d2329;--muted:#5f6b73;--ok:#1e7d3a;--ok-l:#dff3e4;--ko:#b3261e;--ko-l:#fbe3e1;--mid:#7a5c00;--mid-l:#fff4cc;--bg:#f7f5f0;--line:#d5dade;--fs:16px}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.45}
body.bes{--fs:19px}
header{background:var(--teal);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
.pbar{height:6px;background:#cfe3e4}.pbar div{height:100%;background:var(--orange);width:0;transition:width .4s}
main{max-width:1240px;margin:0 auto;padding:18px 20px 30px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.kbd{display:inline-block;border:1px solid #9aa4ab;border-bottom-width:3px;border-radius:5px;padding:0 7px;background:#fff;font-size:.9em;margin:0 1px;white-space:nowrap;color:var(--ink);font-weight:normal}
.keys{white-space:nowrap}
.menu-path{display:inline-block;background:#fff;border:1px solid #b9c2c9;border-radius:6px;padding:0 7px;font-size:.92em;white-space:nowrap}
code,.path{background:#f1f1f1;border-radius:4px;padding:1px 5px;font-size:.92em;font-family:Consolas,"Courier New",monospace;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#fff;border:1px solid #c9d3d8;border-radius:14px;padding:2px 10px;font-size:.92em}
.btn{background:var(--teal);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:1em;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal);border:2px solid var(--teal);padding:8px 14px}
.btn.hintb{background:#fff;color:var(--orange-d);border:2px solid var(--orange);padding:8px 14px}
.btn.skipb{background:#fff;color:var(--muted);border:2px solid var(--line);padding:8px 14px;margin-left:auto}
.btn.skipb:hover{background:#f2f4f5;color:var(--ink)}
.btn:focus-visible,input:focus-visible,.linkbtn:focus-visible,summary:focus-visible,.qopt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;font-family:inherit}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:14px;font-family:inherit}
/* schermate */
.screen{max-width:760px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.screen h2{color:var(--teal);margin:0 0 12px;font-size:1.6em}
.screen h3{color:var(--teal-d);margin:18px 0 6px}
.screen input[type=text]{font-size:1.1em;padding:9px 11px;border:2px solid var(--line);border-radius:8px;width:100%;max-width:360px;font-family:inherit}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--teal-l);border-radius:10px;padding:10px 14px;min-width:130px;flex:1}
.stat b{display:block;font-size:24px;color:var(--teal)}.stat small{display:block;color:var(--muted);font-size:13px}
.stat.tot{background:var(--orange-l)}.stat.tot b{color:var(--orange-d)}
details.review{background:#fffaf2;border:1px solid #f0d9bf;border-radius:10px;padding:8px 14px;margin:10px 0}
details.review summary{cursor:pointer;font-weight:bold;color:var(--orange-d)}
details.review li{margin:6px 0}
textarea.copy{width:100%;height:92px;font-family:"Courier New",monospace;font-size:14px;padding:8px;border:2px solid var(--line);border-radius:8px;resize:vertical}
/* lavoro */
.work{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.work{grid-template-columns:minmax(0,1fr)}.lesson{position:static!important}}
.lesson{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:sticky;top:12px}
.step-lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:bold;display:flex;align-items:center;gap:8px}
.lesson h2{margin:4px 0 10px;color:var(--teal);font-size:1.35em;outline:none}
.theory p{margin:0 0 10px}
.keybox{display:block;background:var(--teal-l);border-radius:10px;padding:10px 12px;margin:6px 0 12px;font-size:1em}
.taskbox{border-left:5px solid var(--orange);background:var(--orange-l);border-radius:8px;padding:10px 14px;margin:12px 0 4px}
.taskbox .lbl{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-d);font-weight:bold;margin-bottom:2px}
.dock.docked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.dock.docked .quiz,.dock.docked .fields{margin-top:0}
.quiz{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qopt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98em;cursor:pointer;font-family:inherit;color:var(--ink);overflow-wrap:anywhere}
.qopt:hover{border-color:var(--teal)}
.qopt.wrong{border-color:var(--ko);background:var(--ko-l);text-decoration:line-through;cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-l);font-weight:bold}
.qopt.right::after{content:" ✔"}
.qopt:disabled{cursor:default;color:var(--ink)}
.qopt .path{background:transparent;padding:0;font-size:.95em}
.fields{display:grid;gap:8px;margin-top:12px}
.fld label{display:block;font-weight:bold;font-size:.95em;margin-bottom:3px}
.fld input{font:15px Consolas,"Courier New",monospace;padding:8px 9px;border:2px solid var(--line);border-radius:8px;width:100%}
.fld input.okf{border-color:var(--ok)}.fld input.kof{border-color:var(--ko)}
.fmsg{display:block;font-size:13px;margin-top:3px}.fmsg.ok{color:var(--ok)}.fmsg.ko{color:var(--ko)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:12px;border-radius:8px;padding:10px 12px}
.fb.ok{background:var(--ok-l);color:#14532b}.fb.ko{background:var(--ko-l);color:#7d1a14}.fb.mid{background:var(--mid-l);color:var(--mid)}
.hinttext{margin-top:10px;background:#fff;border:2px dashed var(--orange);border-radius:8px;padding:8px 12px}
.speak{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;padding:2px 9px;cursor:pointer;font-size:13px;font-family:inherit}
.pocket{position:absolute;right:20px;top:52px;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 16px;width:min(400px,calc(100vw - 32px))}
.pocket h3{margin:0 0 8px;color:var(--teal);font-size:16px}.pocket li{margin:0 0 6px}.pocket ul{padding-left:18px;margin:0}
.stage{min-width:0}
.stagecap{margin:8px 2px 0}
/* ===== Esplora file (Windows 11) ===== */
.xp{position:relative;border:1px solid #c3cbd1;border-radius:10px;background:#fff;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#1b1b1b;box-shadow:0 6px 18px rgba(0,0,0,.08);user-select:none}
.xp button{font-family:inherit;color:#1b1b1b}
.xp-title{display:flex;align-items:flex-end;gap:8px;background:#e9edf0;padding:6px 12px 0;font-size:13px;min-height:34px}
.xp-title .tab{background:#fff;border-radius:8px 8px 0 0;padding:5px 14px;font-weight:600;max-width:65%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xp-ctl{margin-left:auto;letter-spacing:10px;color:#555;font-size:12px;align-self:center}
.xp-nav{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid #e5e5e5}
.nb{width:30px;height:30px;border:0;background:transparent;border-radius:6px;font-size:16px;cursor:pointer;flex:none}
.nb:hover:not(:disabled){background:#eef1f3}.nb:disabled{opacity:.3;cursor:default}
.nb:focus-visible,.xp-cmd button:focus-visible,.tn button:focus-visible,.cr:focus-visible,.xp-menu button:focus-visible{outline:2px solid #0067c0;outline-offset:1px}
.xp-addr{flex:1;min-width:0;display:flex;align-items:center;border:1px solid #d3d3d3;border-radius:6px;height:32px;padding:0 4px;background:#f7f7f7;cursor:text;overflow:hidden}
.xp-addr:hover{background:#fff}
.crumbs{display:flex;align-items:center;white-space:nowrap;overflow:hidden;justify-content:flex-start;min-width:0;max-width:calc(100% - 48px)}
.xa-ico{border:0;background:transparent;padding:2px 5px;cursor:text;font-size:14px;flex:none;border-radius:4px}
.xa-ico:hover{background:#e3e7ea}
.cr{border:0;background:transparent;padding:3px 6px;border-radius:4px;font-size:13px;cursor:pointer;flex:none}
.cr:hover{background:#e3e7ea}
.crumbs .sep{color:#777;font-size:12px;padding:0 1px;flex:none}
.crumbs.ov{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px);mask-image:linear-gradient(90deg,transparent 0,#000 28px)}
.xa-in{width:100%;border:0;background:#fff;font:13px Consolas,"Courier New",monospace;outline:none;padding:0 6px;height:28px}
.xp-cmd{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid #e5e5e5;flex-wrap:wrap;min-height:40px}
.xp-cmd button{border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.xp-cmd button:hover:not(:disabled){background:#eef1f3}
.xp-cmd button:disabled{opacity:.38;cursor:default}
.xp-cmd .vsep{width:1px;height:22px;background:#e0e0e0;margin:0 4px}
.xp-body{display:grid;grid-template-columns:230px minmax(0,1fr);height:340px}
.xp-body.notree{grid-template-columns:minmax(0,1fr)}
.xp-tree{position:relative;border-right:1px solid #ececec;overflow:auto;padding:6px 4px;font-size:13px}
.tn{display:flex;align-items:center;border-radius:5px;white-space:nowrap;min-height:26px}
.tn:hover{background:#eef3f7}
.tn.cur{background:#dbe9f5}
.tn.hlt{box-shadow:inset 4px 0 0 var(--orange)}
.tn.drop{background:#cfe3f7;outline:2px solid #0067c0;outline-offset:-2px}
.tn .tg{width:18px;flex:none;border:0;background:transparent;font-size:10px;color:#555;cursor:pointer;padding:4px 0;text-align:center}
.tn .tl{border:0;background:transparent;font-size:13px;cursor:pointer;padding:3px 6px 3px 2px;text-align:left;white-space:nowrap}
.xp-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.xp-head,.xr{display:grid;grid-template-columns:30px minmax(0,1fr) 200px 86px;align-items:center}
.xp-head{font-size:12.5px;color:#555;border-bottom:1px solid #ececec;padding:5px 0}
.xp-head div{padding:0 6px}
.xp-list{flex:1;overflow:auto;outline:none;position:relative;min-height:0}
.xp-list:focus-visible{box-shadow:inset 0 0 0 2px #7fb7ff}
.xr{min-height:30px;font-size:13.5px;border:1px solid transparent;cursor:default;touch-action:pan-y}
.xr>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr>div:first-child{padding:0 0 0 7px;overflow:visible;text-overflow:clip}
.xr .c3,.xr .c4{color:#555}.xr .c4{text-align:right}
.xr:hover{background:#eaf4fd}
.xr.sel{background:#cce8ff;border-color:#99d1ff}
.xr.foc{outline:1px dotted #555;outline-offset:-2px}
.xr.cut{opacity:.45}
.xr.drop{background:#cfe3f7;outline:2px solid #0067c0;outline-offset:-2px}
.xr.hl{box-shadow:inset 5px 0 0 var(--orange);background:#fff1e4}
.xr.hl.sel{background:#cce8ff}
.xr.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#ffe08a}100%{background:transparent}}
.xr input.ren{width:100%;font:13.5px "Segoe UI",Arial,sans-serif;border:1px solid #0067c0;padding:2px 4px;outline:none;user-select:text}
.xp-empty{padding:24px;color:#777;font-size:13px;text-align:center}
.xp-status{display:flex;gap:14px;font-size:12.5px;color:#444;padding:5px 12px;border-top:1px solid #ececec;background:#fafafa;min-height:28px;flex-wrap:wrap}
.xp-status .clip{margin-left:auto;color:var(--orange-d)}
.xp-toast{position:absolute;left:12px;right:12px;bottom:36px;background:#1d2329;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.xp-toast.on{opacity:.95;transform:none}
.xp-menu{position:absolute;z-index:30;background:#fff;border:1px solid #d0d0d0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:210px}
.xp-menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:6px 10px;border-radius:5px;font-size:13px;text-align:left;cursor:pointer}
.xp-menu button:hover:not(:disabled){background:#eef3f7}
.xp-menu button:disabled{color:#9a9a9a;cursor:default}
.xp-menu .ck{width:16px;flex:none;text-align:center}
.xp-menu .arr{margin-left:auto;color:#666}
.xp-menu hr{border:0;border-top:1px solid #eee;margin:3px 0}
.dragghost{position:fixed;z-index:80;pointer-events:none;background:#fff;border:1px solid #99d1ff;border-radius:6px;padding:4px 9px;font:13px "Segoe UI",Arial,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.2);max-width:280px}
.dragghost .act{display:block;font-size:12px;color:#0067c0;margin-top:2px}
.dragghost .act.no{color:#b3261e}
.dlg-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.dlg{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:16px 18px;font-family:"Segoe UI",Arial,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.3);color:#1b1b1b}
.dlg h4{margin:0 0 8px;font-size:15px}
.dlg p{margin:0 0 10px;font-size:13.5px}
.dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dlg .opts button{text-align:left;border:1px solid #d6d6d6;background:#fafafa;border-radius:6px;padding:8px 10px;font:inherit;font-size:13.5px;cursor:pointer}
.dlg .opts button:hover,.dlg .opts button:focus-visible{border-color:#0067c0;background:#eef6fd;outline:none}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.dlg .row button{border:1px solid #c9c9c9;background:#fff;border-radius:6px;padding:6px 18px;font:inherit;cursor:pointer}
.dlg .row button.pri{background:#0067c0;color:#fff;border-color:#0067c0}
.dlg .row button:focus-visible{outline:2px solid #0067c0;outline-offset:2px}
/* piede */
footer{max-width:1240px;margin:0 auto;padding:0 20px 30px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;font-size:13px;color:var(--muted)}
footer details{max-width:560px}footer summary{cursor:pointer}
.opt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px}
.opt p{margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .screen{margin:0;max-height:90vh;overflow:auto;width:100%}
/* RIAVVIO-CSS inizio: riquadro finale e avviso grande */
.restart{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
.restart h3{margin:0 0 6px}
.restart p{margin:8px 0}
.rs-note{display:inline-block;margin-left:4px}
.btn.danger{background:#fff;color:var(--ko);border:3px solid var(--ko);padding:7px 14px;font-weight:bold}
.btn.danger:hover{background:var(--ko-l)}
.modal.rs-wrap{top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(0,0,0,.6)}
.modal .screen.warn{display:flex;flex-direction:column;overflow:hidden;padding:0;max-width:640px;border:6px solid var(--ko);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}
.warn-body{overflow:auto;min-height:0;padding:20px 24px 8px;overscroll-behavior:contain}
.warn-ic{font-size:54px;line-height:1;text-align:center}
.screen.warn h2{color:var(--ko);text-align:center;margin:6px 0 10px}
.warn-key{border-left:6px solid var(--ko);background:var(--ko-l);color:#7d1a14;border-radius:8px;padding:10px 14px;font-size:1.15em;margin:0 0 10px}
.warn-body p{margin:8px 0}
.warn-body textarea.copy{height:62px}
.rs-copied{font-weight:bold;color:var(--ok)}
.warn-acts{display:flex;flex-wrap:wrap-reverse;gap:12px;padding:12px 24px 16px;border-top:1px solid var(--line);background:#fff}
.warn-acts .btn{flex:1 1 15em;padding:14px 16px;font-size:1.05em;font-weight:bold}
/* RIAVVIO-CSS fine */
@media(max-width:700px){
  main{padding:12px 12px 24px}
  .screen{padding:20px 16px}
  .lesson{padding:14px 16px}
  .xp-body{grid-template-columns:minmax(0,1fr);grid-template-rows:150px minmax(0,1fr);height:470px}
  .xp-tree{border-right:0;border-bottom:1px solid #ececec}
  .xp-head,.xr{grid-template-columns:28px minmax(0,1fr) 120px}
  .xp-head .c4,.xr .c4{display:none}
  .xp-cmd .lab:not(.keep){display:none}
  .crumbs{justify-content:flex-end}
  .pocket{right:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>🗂️ Albero dei file</h1>
  <div class="who"><span id="h-name"></span><button type="button" class="hbtn hidden" id="pocket-btn" aria-expanded="false" aria-controls="pocket">🎒 Tasca</button></div>
</header>
<div class="pbar" aria-hidden="true"><div id="pbar"></div></div>
<div class="pocket hidden" id="pocket" role="dialog" aria-label="Cosa so già"></div>

<main>
  <section id="screen" class="screen hidden"></section>
  <div id="work" class="work hidden">
    <aside class="lesson" id="lesson">
      <div class="step-lbl"><span id="l-lbl"></span><button type="button" class="speak hidden" id="l-speak" title="Leggi ad alta voce">🔊 Leggi</button></div>
      <h2 id="l-title" tabindex="-1"></h2>
      <div class="theory" id="l-theory"></div>
      <div class="keybox hidden" id="l-keys"></div>
      <div class="taskbox"><span class="lbl" id="l-tasklbl">Il tuo compito</span><div id="l-task"></div></div>
      <div class="dock" id="dock">
        <div class="quiz hidden" id="l-quiz" role="group" aria-label="Risposte"></div>
        <div class="fields hidden" id="l-fields"></div>
        <div class="fb hidden" id="l-fb" role="status" aria-live="polite"></div>
        <div class="hinttext hidden" id="l-hinttext"></div>
        <div class="actions">
          <button type="button" class="btn" id="b-check">✔ Controlla</button>
          <button type="button" class="btn hidden" id="b-next">Avanti →</button>
          <button type="button" class="btn hintb hidden" id="b-hint">💡 Aiuto</button>
          <button type="button" class="btn skipb hidden" id="b-skip" title="Un passo saltato non vale punti">Salta il passo ⤼</button>
        </div>
      </div>
    </aside>
    <div class="stage" id="stage"></div>
  </div>
</main>

<footer>
  <button type="button" class="linkbtn" id="f-code">📋 Riepilogo e codice (anche se non hai finito)</button>
  <details id="opts"><summary>⚙ Opzioni</summary>
    <div class="opt">
      <p><label><input type="checkbox" id="o-bes"> <b>Modalità facilitata</b>: testo più grande, file e cartelle giusti evidenziati nei passi guidati, aiuto dopo il primo errore, lettura ad alta voce.</label></p>
      <p><button type="button" class="linkbtn" id="o-reset">Nuovo studente: cancella nome e risultati</button></p>
      <p><b>Solo docente</b> · vai a:
        <button type="button" class="linkbtn" data-jump="g1">inizio</button> ·
        <button type="button" class="linkbtn" data-jump="g4">l'albero</button> ·
        <button type="button" class="linkbtn" data-jump="g6">i percorsi</button> ·
        <button type="button" class="linkbtn" data-jump="g8">cartelle nuove</button> ·
        <button type="button" class="linkbtn" data-jump="x0">sfida finale</button><br>
        <span class="small">I passi che salti con questi link risultano «non fatti» nel codice.</span></p>
    </div>
  </details>

<script>
"use strict";
/* =====================================================================

const $ = s => document.querySelector(s);

const PFX = "hwsalb_", KEEP = "hist", mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(PFX+k); if(v!==null) return JSON.parse(v); }catch(e){} return k in mem ? mem[k] : null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(PFX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(PFX+k); }catch(e){} },

};

/* =====================================================================

   ===================================================================== */
const BS = "\\";
const lc = s => String(s).toLowerCase();
const extOf = n => ((String(n).match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
const F = (name, size, date) => ({name, type:"file", size, date:date||"2026-09-20"});
const DIR = (name, children=[]) => ({name, type:"dir", children});
const clone = o => JSON.parse(JSON.stringify(o));
const KIND = {docx:"Documento di Microsoft Word", pdf:"Documento PDF", jpg:"File JPG", png:"File PNG", txt:"Documento di testo", mp3:"File MP3", mp4:"File MP4", pptx:"Presentazione di Microsoft PowerPoint", xlsx:"Foglio di lavoro di Microsoft Excel", zip:"Cartella compressa"};
const ICO = {docx:"📘", pdf:"📕", jpg:"🖼️", png:"🖼️", txt:"📝", mp3:"🎵", mp4:"🎬", pptx:"📙", xlsx:"📗", zip:"🗜️"};
const EXT_DESC = {docx:"un documento di Word", pdf:"un documento PDF", jpg:"una foto", png:"un'immagine", txt:"un documento di testo", mp3:"un file audio", mp4:"un video", pptx:"una presentazione"};
const isCont = n => !!n && (n.type==="dir" || n.type==="drive" || n.type==="root");
const pathEq = (a,b) => a.length===b.length && a.every((x,i)=>lc(x)===lc(b[i]));
const within = (p, base) => p.length>=base.length && base.every((x,i)=>lc(x)===lc(p[i]));
const pstr = p => !p.length ? "Questo PC" : p.length===1 ? p[0]+BS : p.join(BS);
let FS=null, BIN=[], CLIP=null, EXT=false, USED=new Set(), OPS=[];
function nodeAt(path){ let n=FS; for(const p of path){ if(!isCont(n)) return null; n=n.children.find(c=>lc(c.name)===lc(p)); if(!n) return null; } return n; }
function resolve(parts){ let n=FS; const out=[]; for(const p of parts){ if(!isCont(n)) return null; const c=n.children.find(x=>lc(x.name)===lc(p)); if(!c) return null; out.push(c.name); n=c; } return {node:n, path:out}; }
const childOf = (d,name) => d.children.find(c=>lc(c.name)===lc(name));
const namesAt = path => { const n=nodeAt(path); return n && isCont(n) ? n.children.map(c=>c.name) : []; };
const has = (path,name) => { const n=nodeAt(path); return !!(n && isCont(n) && childOf(n,name)); };

/* =====================================================================
   ESPLORA FILE (Windows 11), una o più finestre sullo stesso disco
   ===================================================================== */
const XP = (()=>{
  const all=[]; let D=null, dlgOpen=false;
  const sorted = n => n.children.slice().sort((a,b)=> ((a.type==="file")-(b.type==="file")) || a.name.localeCompare(b.name,"it",{numeric:true,sensitivity:"base"}));
  const disp = c => c.type==="drive" ? c.label : c.type==="file" && !EXT ? c.name.replace(/\.[^.]+$/,"") : c.name;
  const kindOf = c => c.type==="dir" ? "Cartella di file" : c.type==="drive" ? (c.usb?"Unità rimovibile":"Disco locale") : (KIND[extOf(c.name)] || ("File "+extOf(c.name).toUpperCase()));
  const icoOf = c => c.type==="dir" ? "📁" : c.type==="drive" ? (c.usb?"💾":"💽") : (ICO[extOf(c.name)]||"📄");
  const kb = b => (b===0?0:Math.ceil(b/1024)).toLocaleString("it-IT")+" KB";
  const human = b => b<1024 ? b+" byte" : b<1048576 ? Math.ceil(b/1024).toLocaleString("it-IT")+" KB" : (Math.round(b/1048576*10)/10).toLocaleString("it-IT")+" MB";
  const dname = p => p[0]==="::bin" ? "Cestino" : !p.length ? "Questo PC" : p.length===1 ? ((FS.children.find(d=>lc(d.name)===lc(p[0]))||{}).label||p[0]) : p[p.length-1];
  const dateIt = d => (d||"").split("-").reverse().join("/");
  const J = v => esc(JSON.stringify(v));
  const inBin = X => X.cwd[0]==="::bin";

  function load(fs, o={}){ FS=fs; BIN=[]; CLIP=null; EXT=!!o.ext; USED=new Set(); OPS=[]; all.length=0; closeMenus(); }
  function mount(host, o){
    const X={host, o, cwd:o.cwd.slice(), back:[], fwd:[], sel:new Set(), anchor:null, foc:0, ren:null, addr:false,
      exp:new Set(), hl:new Set((o.hl||[]).map(lc)), hlt:new Set((o.hlTree||[]).map(p=>lc(pstr(p)))), lastTap:null, flash:new Set(), order:[], items:[]};
    (o.expand||[]).forEach(p=>expandTo(X,p,true));
    expandTo(X, X.cwd, true);
    all.push(X); render(X); return X;
  }
  function expandTo(X, p, inclusive){ for(let i=1;i<=p.length-(inclusive?0:1);i++) X.exp.add(lc(pstr(p.slice(0,i)))); }
  function refresh(focusX){ all.forEach(X=>render(X, X===focusX)); }

  /* ---------- disegno ---------- */
  function render(X, keepFocus){
    if(!inBin(X)) while(X.cwd.length && !nodeAt(X.cwd)) X.cwd.pop();
    const here = inBin(X) ? null : X.cwd.length ? nodeAt(X.cwd) : FS;
    const items = inBin(X) ? BIN.map((b,i)=>Object.assign({}, b.node, {_bin:i, _from:b.from})) : sorted(here);
    X.items=items; X.order = items.map(c=> c._bin!=null ? "#"+c._bin : c.name);
    if(X.foc>=items.length) X.foc=Math.max(0,items.length-1);
    [...X.sel].forEach(k=>{ if(!X.order.some(o=>lc(o)===lc(k))) X.sel.delete(k); });
    const selItems = items.filter((c,i)=>isSel(X, X.order[i]));
    const bin=inBin(X), atPC=!X.cwd.length, canSel=X.sel.size>0 && !bin && !atPC;
    const crumbs = bin ? [[["::bin"],"Cestino"]] : [[[],"Questo PC"], ...X.cwd.map((_,i)=>[X.cwd.slice(0,i+1), dname(X.cwd.slice(0,i+1))])];
    const addr = X.addr ? `<input class="xa-in" value="${esc(bin?"Cestino":pstr(X.cwd))}" aria-label="Percorso della cartella" spellcheck="false" autocomplete="off">`
      : `<button type="button" class="xa-ico" aria-label="Mostra il percorso scritto" title="Mostra il percorso scritto">${bin?"🗑️":atPC?"🖥️":"📁"}</button><div class="crumbs">${crumbs.map((c,i)=>`${i?'<span class="sep">›</span>':""}<button type="button" class="cr" data-cr="${i}">${esc(c[1])}</button>`).join("")}</div>`;
    const cmd = bin
      ? `<button type="button" data-a="restore" ${X.sel.size?"":"disabled"}>↩️ <span class="lab">Ripristina gli elementi selezionati</span></button>`
      : `<button type="button" data-a="new" ${atPC?"disabled":""} aria-haspopup="true">➕ <span class="lab keep">Nuovo</span> ▾</button><span class="vsep"></span>
        <button type="button" data-a="cut" title="Taglia (${CT}+X)" aria-label="Taglia" ${canSel?"":"disabled"}>✂️ <span class="lab">Taglia</span></button>

        <button type="button" data-a="ren" title="Rinomina (F2)" aria-label="Rinomina" ${X.sel.size===1 && !atPC?"":"disabled"}>✏️ <span class="lab">Rinomina</span></button>
        <button type="button" data-a="del" title="Elimina (Canc)" aria-label="Elimina" ${canSel?"":"disabled"}>🗑️ <span class="lab">Elimina</span></button>
        <span class="vsep"></span><button type="button" data-a="view" aria-haspopup="true">👁️ <span class="lab keep">Visualizza</span> ▾</button>`;
    const head = `<div class="xp-head"><div></div><div>Nome</div><div class="c3">${bin?"Percorso originale":"Tipo"}</div><div class="c4">Dimensione</div></div>`;
    const cutNow = c => CLIP && CLIP.mode==="cut" && !bin && pathEq(CLIP.src, X.cwd) && CLIP.names.some(n=>lc(n)===lc(c.name));
    const rows = items.map((c,i)=>{ const k=X.order[i], s=isSel(X,k), rn = X.ren && !bin && lc(X.ren.name)===lc(c.name);
      const drop = !bin && (c.type==="dir"||c.type==="drive") ? ` data-drop="${J(X.cwd.concat(c.name))}"` : "";
      const nm = rn ? `<input class="ren" value="${esc(X.ren.value)}" aria-label="Nuovo nome" spellcheck="false" autocomplete="off">` : esc(disp(c));
      return `<div class="xr${s?" sel":""}${i===X.foc?" foc":""}${cutNow(c)?" cut":""}${X.hl.has(lc(c.name))?" hl":""}${X.flash.has(lc(c.name))?" new":""}" data-i="${i}" role="option" aria-selected="${s}"${drop}><div aria-hidden="true">${icoOf(c)}</div><div class="nm">${nm}</div><div class="c3">${esc(bin?pstr(c._from):kindOf(c))}</div><div class="c4">${c.type==="file"?kb(c.size):""}</div></div>`; }).join("");
    X.flash.clear();
    const tot=selItems.filter(c=>c.type==="file").reduce((a,c)=>a+c.size,0);
    const selInfo = X.sel.size ? `${X.sel.size} element${X.sel.size===1?"o selezionato":"i selezionati"}${tot?" · "+human(tot):""}` : "";
    const clipInfo = CLIP ? `📋 Appunti: ${CLIP.names.length===1?"«"+esc(CLIP.names[0])+"»":CLIP.names.length+" elementi"} ${CLIP.mode==="cut"?"(tagliato)":"(copiato)"}` : "";
    const tree = X.o.tree===false ? "" : `<nav class="xp-tree" aria-label="Albero delle cartelle">${treeHtml(X)}</nav>`;
    X.host.innerHTML = `<div class="xp">
      <div class="xp-title"><span class="tab">${bin?"🗑️":atPC?"🖥️":"📁"} ${esc(dname(X.cwd))}</span><span class="xp-ctl" aria-hidden="true">─ ▢ ✕</span></div>
      <div class="xp-nav"><button type="button" class="nb" data-a="back" ${X.back.length?"":"disabled"} aria-label="Indietro" title="Indietro (Alt+←)">←</button><button type="button" class="nb" data-a="fwd" ${X.fwd.length?"":"disabled"} aria-label="Avanti" title="Avanti (Alt+→)">→</button><button type="button" class="nb" data-a="up" ${atPC||bin?"disabled":""} aria-label="Su di un livello" title="Su di un livello (Alt+↑)">↑</button>
        <div class="xp-addr" title="Clic qui per vedere e scrivere il percorso">${addr}</div></div>
      <div class="xp-cmd">${cmd}</div>
      <div class="xp-body${X.o.tree===false?" notree":""}">${tree}<div class="xp-main">${head}<div class="xp-list" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Contenuto di ${esc(dname(X.cwd))}" data-drop="${J(bin?"::bin":X.cwd)}">${rows || `<div class="xp-empty">Questa cartella è vuota.</div>`}</div></div></div>
      <div class="xp-status"><span>${items.length} element${items.length===1?"o":"i"}</span><span>${selInfo}</span><span class="clip">${clipInfo}</span></div>
      <div class="xp-toast" aria-live="polite"></div></div>`;
    wire(X);
    const cr=X.host.querySelector(".crumbs"); if(cr){ const w=[...cr.children].reduce((a,c)=>a+c.offsetWidth,0); cr.classList.toggle("ov", w>cr.clientWidth+1); }
    const list=X.host.querySelector(".xp-list"), fr=list.querySelector(`.xr[data-i="${X.foc}"]`);
    if(fr && X.sel.size){ const t=fr.offsetTop, b=t+fr.offsetHeight; if(t<list.scrollTop) list.scrollTop=t; else if(b>list.scrollTop+list.clientHeight) list.scrollTop=b-list.clientHeight; }
    if(X.ren){ const inp=X.host.querySelector("input.ren"); if(inp){ inp.focus({preventScroll:true}); const dot = X.ren.isFile && EXT ? X.ren.value.lastIndexOf(".") : -1; inp.setSelectionRange(0, dot>0?dot:X.ren.value.length); } }
    else if(X.addr){ const a=X.host.querySelector(".xa-in"); a.focus(); a.select(); }
    else if(keepFocus) list.focus({preventScroll:true});
    const cur=X.host.querySelector(".tn.cur"); if(cur){ const tr=X.host.querySelector(".xp-tree"); if(cur.offsetTop<tr.scrollTop || cur.offsetTop>tr.scrollTop+tr.clientHeight-26) tr.scrollTop=cur.offsetTop-40; }
  }
  const isSel = (X,k) => [...X.sel].some(s=>lc(s)===lc(k));
  function treeHtml(X){
    const row=(path,label,ico,depth,kids,open)=>`<div class="tn${pathEq(path,X.cwd)?" cur":""}${X.hlt.has(lc(pstr(path)))?" hlt":""}" style="padding-left:${2+depth*14}px" data-drop="${J(path.length&&path[0]==="::bin"?"::bin":path)}">${kids?`<button type="button" class="tg" data-tg="${J(path)}" aria-label="${open?"Chiudi":"Apri"} il ramo ${esc(label)}" aria-expanded="${open}">${open?"▾":"▸"}</button>`:`<span class="tg"></span>`}<button type="button" class="tl" data-go="${J(path)}">${ico} ${esc(label)}</button></div>`;
    let h=row([], "Questo PC", "🖥️", 0, false, true);
    const walk=(n,path,depth)=>{ n.children.filter(c=>c.type==="dir").sort((a,b)=>a.name.localeCompare(b.name,"it",{numeric:true,sensitivity:"base"})).forEach(c=>{
      const p=path.concat(c.name), kids=c.children.some(x=>x.type==="dir"), open=kids && X.exp.has(lc(pstr(p)));
      h+=row(p, c.name, "📁", depth, kids, open); if(open) walk(c,p,depth+1); }); };
    FS.children.forEach(d=>{ const p=[d.name], kids=d.children.some(c=>c.type==="dir"), open=kids && X.exp.has(lc(pstr(p)));
      h+=row(p, d.label, d.usb?"💾":"💽", 1, kids, open); if(open) walk(d,p,2); });
    if(X.o.bin) h+=row(["::bin"], "Cestino", "🗑️", 0, false, false);
    return h;
  }

  /* ---------- eventi ---------- */
  function wire(X){
    const H=X.host;
    H.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click", e=>act(X, b.dataset.a, e)));
    H.querySelectorAll(".cr").forEach(b=>b.addEventListener("click", e=>{ e.stopPropagation(); const i=+b.dataset.cr; if(inBin(X)) return; const p = i===0 ? [] : X.cwd.slice(0,i); nav(X, p, "crumb"); }));
    const addr=H.querySelector(".xp-addr");
    addr.addEventListener("click", e=>{ if(e.target.closest(".cr") || X.addr) return; X.addr=true; USED.add("addrview"); render(X); });
    const ai=H.querySelector(".xa-in");
    if(ai){ ai.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); goTyped(X, ai.value); } else if(e.key==="Escape"){ e.preventDefault(); X.addr=false; render(X,true); } });
      ai.addEventListener("blur", ()=>{ setTimeout(()=>{ if(X.addr && !dlgOpen){ X.addr=false; render(X); } }, 120); }); }
    H.querySelectorAll(".tl").forEach(b=>b.addEventListener("click", ()=>{ const p=JSON.parse(b.dataset.go); nav(X, p, "tree"); }));
    H.querySelectorAll(".tg").forEach(b=>{ if(b.tagName!=="BUTTON") return; b.addEventListener("click", ()=>{ const p=JSON.parse(b.dataset.tg), k=lc(pstr(p)); X.exp.has(k)?X.exp.delete(k):X.exp.add(k); USED.add("treetoggle"); render(X); const nb=X.host.querySelector(`.tg[data-tg="${CSS.escape(JSON.stringify(p))}"]`); if(nb) nb.focus(); }); });
    const list=H.querySelector(".xp-list");
    list.addEventListener("pointerdown", e=>{ if(e.button!==0) return; if(X.ren && e.target.closest("input.ren")) return; closeMenus();
      if(X.ren){ const ri=X.host.querySelector("input.ren"); if(ri) commitRen(X, ri.value); return; }
      if(e.pointerType==="mouse") e.preventDefault();   // il fuoco lo gestisce render(): l'elenco viene ridisegnato
      const row=e.target.closest(".xr");
      if(!row){ if(!(IS_MAC?e.metaKey:e.ctrlKey)) X.sel.clear(); render(X,true); return; }
      rowDown(X, +row.dataset.i, e); });
    list.addEventListener("keydown", e=>listKey(X,e));
    list.addEventListener("contextmenu", e=>{ e.preventDefault(); if(X.ren) return; const row=e.target.closest(".xr");
      if(row){ const k=X.order[+row.dataset.i]; if(!isSel(X,k)){ X.sel=new Set([k]); X.anchor=X.foc=+row.dataset.i; render(X,true); } ctx(X, k, e.clientX, e.clientY); }
      else { X.sel.clear(); render(X,true); ctx(X, null, e.clientX, e.clientY); } });
    const ri=H.querySelector("input.ren");
    if(ri){ ri.addEventListener("keydown", e=>{ e.stopPropagation(); if(e.key==="Enter"){ e.preventDefault(); commitRen(X, ri.value); } else if(e.key==="Escape"){ e.preventDefault(); X.ren=null; render(X,true); } });
      ri.addEventListener("blur", ()=>{ setTimeout(()=>{ if(X.ren && !dlgOpen && document.activeElement!==ri) commitRen(X, ri.value); }, 60); }); }
  }
  function rowDown(X, i, e){
    const k=X.order[i], multi = IS_MAC ? e.metaKey : e.ctrlKey; let pendingSingle=null;
    if(e.shiftKey && X.anchor!=null){ const a=Math.min(X.anchor,i), b=Math.max(X.anchor,i); X.sel=new Set(X.order.slice(a,b+1)); }
    else if(multi){ isSel(X,k) ? X.sel.forEach(s=>{ if(lc(s)===lc(k)) X.sel.delete(s); }) : X.sel.add(k); X.anchor=i; }
    else if(!isSel(X,k)){ X.sel=new Set([k]); X.anchor=i; }
    else pendingSingle=k;
    X.foc=i; render(X,true);
    D={X, k, x0:e.clientX, y0:e.clientY, type:e.pointerType, id:e.pointerId, on:false, pendingSingle, multi:multi||e.shiftKey};
    window.addEventListener("pointermove", dmove, {passive:false}); window.addEventListener("pointerup", dup); window.addEventListener("pointercancel", dcancel);
  }
  function dmove(e){
    if(!D || e.pointerId!==D.id) return;
    const dx=e.clientX-D.x0, dy=e.clientY-D.y0;
    if(!D.on){
      if(inBin(D.X) || !D.X.cwd.length) return;
      if(D.type==="touch"){ if(Math.abs(dy)>10 && Math.abs(dy)>=Math.abs(dx)) return dcancel(); if(Math.abs(dx)<12) return; }
      else if(Math.hypot(dx,dy)<6) return;
      D.on=true; D.src=D.X.cwd.slice(); D.names=D.X.order.filter(o=>isSel(D.X,o));
      D.ghost=document.createElement("div"); D.ghost.className="dragghost"; document.body.appendChild(D.ghost);
    }
    e.preventDefault();
    D.ghost.style.left=(e.clientX+14)+"px"; D.ghost.style.top=(e.clientY+12)+"px";
    const t=dropAt(e.clientX, e.clientY); document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
    D.target=t; D.eff = t ? effect(D, t.path, e) : null;
    if(t && D.eff && t.el.classList.contains("xr")) t.el.classList.add("drop"); else if(t && D.eff && t.el.classList.contains("tn")) t.el.classList.add("drop");
    const what = D.names.length===1 ? `${icoOf(childOf(nodeAt(D.src),D.names[0])||{type:"file",name:D.names[0]})} ${esc(disp(childOf(nodeAt(D.src),D.names[0])||{type:"file",name:D.names[0]}))}` : `📄 ${D.names.length} elementi`;
    const lab = !D.eff ? `<span class="act no">🚫 qui non si può</span>` : D.eff==="del" ? `<span class="act">→ Sposta nel Cestino</span>` : D.eff==="move" ? `<span class="act">→ Sposta in ${esc(dname(t.path))}</span>` : `<span class="act">+ Copia in ${esc(dname(t.path))}</span>`;
    D.ghost.innerHTML = what+lab;
  }
  function dropAt(x,y){ const el=document.elementFromPoint(x,y); const t=el && el.closest ? el.closest("[data-drop]") : null; if(!t) return null; return {el:t, path:JSON.parse(t.dataset.drop)}; }
  function effect(d, path, e){
    if(path==="::bin") return "del";
    if(!Array.isArray(path) || !path.length) return null;
    if(pathEq(path, d.src)) return null;
    for(const n of d.names) if(within(path, d.src.concat(n))) return null;
    const node=nodeAt(path); if(!node || !isCont(node)) return null;
    const same = lc(path[0])===lc(d.src[0]), copyK = IS_MAC ? e.altKey : e.ctrlKey;

  }
  function dcleanup(){ window.removeEventListener("pointermove", dmove); window.removeEventListener("pointerup", dup); window.removeEventListener("pointercancel", dcancel); if(D && D.ghost) D.ghost.remove(); document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop")); }

  if(a.length===b.length && a.every((x,i)=>lc(x)===lc(b[i]))) return true;
  const last=b[b.length-1];
  if(a.length===b.length && a.slice(0,-1).every((x,i)=>lc(x)===lc(b[i])) && lc(a[a.length-1])===lc(last.replace(/\.[^.]+$/,""))) return `Manca l'estensione alla fine: <b>.${extOf(last)}</b>`;
  for(let i=0;i<b.length;i++){ if(lc(a[i]||"")!==lc(b[i])) return a[i]===undefined ? `Manca la fine: dopo «${esc(b[i-1])}» viene «${esc(b[i])}».` : `Dopo «${esc(b[i-1])}» viene «${esc(b[i])}», non «${esc(a[i])}».`; }
  return "Alla fine c'è un pezzo in più: il percorso finisce con il nome del file.";
}; }
function ruleDiag(n, exp){
  const t=[]; if(/[A-Z]/.test(n)) t.push("tutto minuscolo"); if(/\s/.test(n)) t.push("niente spazi: usa _"); if(/[àèéìíòóùúÀÈÉÌÒÙ'’]/.test(n)) t.push("niente accenti né apostrofi");
  return `La cartella si chiama «${esc(n)}». ` + (t.length ? `La regola dice: ${t.join(", ")}.` : `Secondo la regola deve chiamarsi «${exp}».`) + ` Per correggere: selezionala e premi F2 (o Rinomina).`;
}
const X0 = () => XP.all[0];
const idle = () => !USED.size && !OPS.length;
const newDirs = (path, before) => namesAt(path).filter(n=>!before.some(b=>lc(b)===lc(n)) && isCont(childOf(nodeAt(path), n)));
function folderTask(path, exp, before){
  const nd=newDirs(path, before), good=nd.filter(x=>x===exp), others=nd.filter(x=>x!==exp);
  if(good.length && !others.length) return {ok:true};
  if(!nd.length) return {ok:false, noTry:idle(), msg:"Non vedo ancora una cartella nuova qui: Nuovo › Cartella."};
  if(good.length) return {ok:false, reset:true, msg:`La cartella «${esc(exp)}» va bene, ma hai creato anche «${esc(others.join("», «"))}», che non serve: selezionala ed eliminala.`};
  const n=others[0];
  if(/^nuova cartella/i.test(n)) return {ok:false, msg:"La cartella si chiama ancora «"+esc(n)+"»: selezionala, premi F2 (o Rinomina) e scrivi il nome giusto."};
  return {ok:false, msg:ruleDiag(n, exp)};
}
function placeTask(moves, start){
  if(idle()) return {ok:false, noTry:true, msg:"Non hai ancora spostato niente."};
  const last = p => esc(p[p.length-1]);
  for(const m of moves){   // prima gli sbagli da correggere, poi quello che manca
    const inDest=has(m.to, m.name), inSrc=has(m.from, m.name);
    if(inDest && inSrc) return {ok:false, reset:true, msg:`«${esc(m.name)}» è in ${last(m.to)}, ma anche ancora in ${last(m.from)}: l'hai <b>copiato</b>, non spostato. Usa Taglia (o trascina).`};
    if(!inDest && !inSrc){ const where=findFile(m.name); return {ok:false, reset:true, msg: where ? `«${esc(m.name)}» è finito in «${last(where)}»: va in <b>${last(m.to)}</b>.` : `Non trovo più «${esc(m.name)}»: forse l'hai eliminato.`}; }
  }
  const miss=moves.filter(m=>!has(m.to, m.name));
  if(miss.length) return {ok:false, msg: miss.length===1 ? `Manca ancora «${esc(miss[0].name)}»: va in <b>${last(miss[0].to)}</b>.` : `Mancano ancora ${miss.length} file: ${miss.map(m=>`«${esc(m.name)}» in <b>${last(m.to)}</b>`).join(", ")}.`};
  return {ok:true};
}
function findFile(name, n=FS, path=[]){ for(const c of (n.children||[])){ if(c.type==="file" && lc(c.name)===lc(name)) return path; if(isCont(c)){ const r=findFile(name, c, path.concat(c.name)); if(r) return r; } } return null; }
function cwdTask(target, hintFn){
  const X=X0(); if(pathEq(X.cwd, target)) return {ok:true};
  if(idle()) return {ok:false, noTry:true, msg:"Non ti sei ancora spostato: apri le cartelle con un doppio clic o dall'albero."};
  return {ok:false, msg: hintFn ? hintFn(X.cwd) : `Sei in «${esc(pstr(X.cwd))}». Devi arrivare in «${esc(target[target.length-1])}».`};
}

   CODICE RISULTATO · firma come nelle altre palestre (djb2, base 36)
   ===================================================================== */
const TOOL = "ALB";
/* parole dell'avviso di riavvio che cambiano da una palestra all'altra */
const RS = {prove:"i compiti", risp:"I compiti", dove:"nella scheda", lv:false};
function sig(s, tag){ let h=5381; const t="HWS*"+s+"*"+tag; for(let k=0;k<t.length;k++){ h=((h<<5)+h+t.charCodeAt(k))>>>0; } return h.toString(36).toUpperCase().slice(-5).padStart(5,"0"); }

/* =====================================================================
   APP
   ===================================================================== */
const App = (()=>{
  let pos = Math.min(Math.max(0, +store.get("pos")||0), STEPS.length-1), S={};
  const res = id => store.get("r_"+id);
  const curName = () => (store.get("nome")||"").replace(/\s+/g," ").trim();
  const rip = () => +store.get("rip")||0;
  const errs = () => store.get("errs")||{};
  function addErr(id){ const e=errs(); e[id]=(e[id]||0)+1; store.set("errs", e); }
  const mq = window.matchMedia ? window.matchMedia("(max-width:900px)") : null;

  function go(i){ pos=i; store.set("pos", i); render(); window.scrollTo(0,0); }
  function next(){ if(pos<STEPS.length-1) go(pos+1); }
  function say(kind, html, reset){
    const fb=$("#l-fb"); fb.className="fb "+kind; fb.innerHTML = html + (reset?` <button type="button" class="linkbtn" id="fb-reset">↺ rimetti tutto com'era</button>`:"");
    if(reset) $("#fb-reset").onclick=()=>{ mountEnv(STEPS[pos]); fb.classList.add("hidden"); };
  }
  function placeDock(){
    const d=$("#dock");
    if(mq && mq.matches){ if(d.parentNode!==$("#work")) $("#work").appendChild(d); d.classList.add("docked"); }
    else { if(d.parentNode!==$("#lesson")) $("#lesson").appendChild(d); d.classList.remove("docked"); }
  }
  if(mq){ if(mq.addEventListener) mq.addEventListener("change", placeDock); else if(mq.addListener) mq.addListener(placeDock); }

  function counter(step){ return step.phase==="g" ? `Passo ${GUIDED.indexOf(step)+1} di ${GUIDED.length}` : `Sfida finale · compito ${CHAL.indexOf(step)+1} di ${CHAL.length}`; }
  function mountEnv(step){
    const e=step.env||{}, st=$("#stage");
    XP.load(world(e.mod), {ext:!!e.ext});
    st.innerHTML=`<div id="xp-host"></div><p class="small stagecap">Questa finestra imita <b>Esplora file di Windows 11</b>. Doppio clic per aprire una cartella; tasto destro (o dito premuto) per il menu.</p>`;
    const guided = step.phase==="g" && BES;
    XP.mount($("#xp-host"), {cwd:e.cwd, expand:e.expand, hl: guided ? e.hl : [], hlTree: guided ? e.hlTree : [], tree:true, bin:false});
    S.before = step.before ? step.before() : null;
  }
  function render(){
    const step=STEPS[pos];
    $("#pbar").style.width = Math.round(pos/(STEPS.length-1)*100)+"%";
    $("#h-name").textContent = curName();
    paintPocket();
    try{ speechSynthesis.cancel(); }catch(e){}
    if(step.screen){ $("#work").classList.add("hidden"); $("#screen").classList.remove("hidden"); SCREENS[step.screen]($("#screen")); return; }
    $("#screen").classList.add("hidden"); $("#work").classList.remove("hidden");
    S = {err:0, hint:false, done:false, firstDone:false};
    $("#l-lbl").textContent = counter(step);
    $("#l-speak").classList.toggle("hidden", !BES);
    $("#l-title").innerHTML = step.phase==="x" ? SEC[step.sec].name : step.title;
    const th=val(step.theory); $("#l-theory").innerHTML = th; $("#l-theory").classList.toggle("hidden", !th);
    const keys=val(step.keys); $("#l-keys").innerHTML=keys; $("#l-keys").classList.toggle("hidden", !keys);
    $("#l-tasklbl").textContent = step.quiz ? "Domanda" : step.phase==="g" ? "Il tuo compito" : "Obiettivo";
    $("#l-task").innerHTML = val(step.task);
    const q=$("#l-quiz"); q.classList.toggle("hidden", !step.quiz);
    q.innerHTML = step.quiz ? step.quiz.map((o,i)=>`<button type="button" class="qopt" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${o.t}</button>`).join("") : "";
    q.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>answer(+b.dataset.i, b));
    const fl=$("#l-fields"); fl.classList.toggle("hidden", !step.fields);
    fl.innerHTML = step.fields ? step.fields.map(f=>`<div class="fld"><label for="f-${f.id}">${f.label}</label><input type="text" id="f-${f.id}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="m-${f.id}" placeholder="C:\\…"><small class="fmsg" id="m-${f.id}"></small></div>`).join("") : "";
    fl.querySelectorAll("input").forEach(i=>i.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } }));
    $("#l-fb").classList.add("hidden"); $("#l-hinttext").classList.add("hidden");
    $("#b-next").classList.add("hidden"); $("#b-hint").classList.add("hidden");
    $("#b-check").classList.toggle("hidden", !!step.quiz);
    const sk=$("#b-skip"); sk.classList.remove("hidden"); sk.textContent = step.phase==="g" ? "Salta il passo ⤼" : "Salta il compito ⤼";
    mountEnv(step); placeDock();
  }
  function showHintBtn(){ if(STEPS[pos].hint && !S.hint && S.err >= (BES?1:2)) $("#b-hint").classList.remove("hidden"); }
  function recordFirst(ok){ const step=STEPS[pos]; if(step.phase!=="x" || S.firstDone) return; S.firstDone=true; if(!res(step.id)) store.set("r_"+step.id, {first:ok, done:false}); }
  function verify(step){
    if(step.fields){ let bad=0, empty=0;
      step.fields.forEach(f=>{ const el=$("#f-"+f.id), m=$("#m-"+f.id); if(!el.value.trim()){ empty++; return; } const r=f.check(el.value), ok=r===true; if(!ok) bad++;
        el.classList.toggle("okf", ok); el.classList.toggle("kof", !ok); el.setAttribute("aria-invalid", String(!ok)); m.className="fmsg "+(ok?"ok":"ko"); m.innerHTML = ok ? "✔ giusto" : "✗ "+r; });
      if(empty) return {ok:false, noTry:true, msg:"Scrivi il percorso nella casella, poi premi Controlla."};
      return bad ? {ok:false, msg:"Il percorso non è ancora giusto: sotto la casella trovi il perché."} : {ok:true}; }
    if(step.check) return step.check(S);
    return {ok:true};
  }
  function check(){
    const step=STEPS[pos]; if(!step || step.screen || step.quiz) return;
    if(S.done){ next(); return; }
    if(XP.dlg) return;
    const v=verify(step);
    if(!v.ok){
      if(!v.noTry){ S.err++; recordFirst(false); if(step.phase==="x") addErr(step.id); }
      say(v.noTry?"mid":"ko", (v.noTry?"":"Non ancora. ")+v.msg, v.reset); showHintBtn(); return; }
    recordFirst(true); success(step);
  }
  function answer(i, btn){
    const step=STEPS[pos]; if(S.done) return; const o=step.quiz[i];
    if(o.ok){ recordFirst(true); btn.classList.add("right"); $("#l-quiz").querySelectorAll(".qopt").forEach(b=>b.disabled=true); success(step); return; }
    if(btn.classList.contains("wrong")) return;
    recordFirst(false); if(step.phase==="x") addErr(step.id);
    btn.classList.add("wrong"); btn.setAttribute("aria-disabled","true"); S.err++; say("ko", "Non è così. "+o.fb); showHintBtn();
  }
  function success(step){
    S.done=true;
    if(step.phase==="g"){ const r=Object.assign({}, res(step.id)||{}, {ok:1, err:S.err}); if(S.hint) r.hint=1; delete r.skip; store.set("r_"+step.id, r);
      say("ok", "✔ Giusto! "+val(step.success)); paintPocket(); if(step.after) step.after(); }
    else { const r=res(step.id)||{first:true}; store.set("r_"+step.id, {first:!!r.first, done:true}); say("ok", (r.first?"✔ Giusto al primo colpo! ":"✔ Ora è giusto. ")+val(step.why)); }
    $("#b-check").classList.add("hidden"); $("#b-hint").classList.add("hidden"); $("#b-skip").classList.add("hidden");
    const nb=$("#b-next"); nb.classList.remove("hidden"); nb.textContent = STEPS[pos+1] && STEPS[pos+1].screen ? "Continua →" : "Avanti →"; if(!step.after) nb.focus({preventScroll:true});
  }
  function skip(){
    const step=STEPS[pos]; if(!step || step.screen || S.done) return; const r=res(step.id);
    if(step.phase==="g"){ if(!(r && r.ok)) store.set("r_"+step.id, Object.assign({}, r||{}, {skip:1})); }
    else store.set("r_"+step.id, {first:false, done:false, skip:1});
    next();
  }
  function hint(){ S.hint=true; const id=STEPS[pos].id; store.set("r_"+id, Object.assign({}, res(id)||{}, {hint:1}));
    const h=$("#l-hinttext"); h.innerHTML="💡 "+val(STEPS[pos].hint); h.classList.remove("hidden"); $("#b-hint").classList.add("hidden"); }

  function paintPocket(){
    const learned = GUIDED.filter(s=>s.learn && (res(s.id)||{}).ok), cur=STEPS[pos], closed = cur && (cur.phase==="x" || cur.id==="x0");
    const b=$("#pocket-btn"); b.classList.toggle("hidden", !learned.length || closed); b.textContent=`🎒 Tasca (${learned.length})`;
    if(closed){ $("#pocket").classList.add("hidden"); b.setAttribute("aria-expanded","false"); }
    $("#pocket").innerHTML = `<h3>Cosa so già</h3><ul>${learned.map(s=>`<li><b>${val(s.learn.k)}</b> — ${s.learn.d}</li>`).join("")}</ul>`;
  }
  $("#pocket-btn").onclick = e=>{ e.stopPropagation(); const open=$("#pocket").classList.toggle("hidden"); $("#pocket-btn").setAttribute("aria-expanded", String(!open)); };
  document.addEventListener("click", e=>{ if(!e.target.closest("#pocket") && !$("#pocket").classList.contains("hidden")){ $("#pocket").classList.add("hidden"); $("#pocket-btn").setAttribute("aria-expanded","false"); } });

  function guided(){ const r=GUIDED.map(s=>res(s.id)||{}), ok=r.filter(x=>x.ok).length, skip=r.filter(x=>x.skip && !x.ok).length;
    return {ok, skip, miss:GUIDED.length-ok-skip, hint:(+store.get("hintsPrev")||0)+r.filter(x=>x.hint).length}; }
  function tally(){
    const secs = Object.keys(SEC).map(k=>{ const qs=CHAL.filter(q=>q.sec===k), r=qs.map(q=>res(q.id));
      return {k, n:qs.length, ok:r.filter(x=>x && x.first && !x.skip).length, skip:r.filter(x=>x && x.skip).length, miss:r.filter(x=>!x).length}; });
    const skips = CHAL.filter(q=>{ const r=res(q.id); return r && r.skip; });
    return {secs, n:CHAL.length, miss:secs.reduce((a,x)=>a+x.miss,0), ok:secs.reduce((a,x)=>a+x.ok,0), skips};
  }
  const pl = (n, one, many) => `${n} ${n===1?one:many}`;
  function code(){
    const t=tally(), g=guided(), e=errs();
    const gx=[]; if(g.skip) gx.push(pl(g.skip,"saltato","saltati")); if(g.miss) gx.push(pl(g.miss,"non fatto","non fatti"));
    const parts=["HWS-"+TOOL, curName()||"(nome non inserito)", `PASSI ${g.ok}/${GUIDED.length}`+(gx.length?` (${gx.join(", ")})`:""), `aiuti ${g.hint}`];
    t.secs.forEach(x=>{ const ex=[]; if(x.skip) ex.push(pl(x.skip,"saltata","saltate")); if(x.miss) ex.push(pl(x.miss,"non fatta","non fatte"));
      parts.push(`${SEC[x.k].code} ${x.ok}/${x.n}`+(ex.length?` (${ex.join(", ")})`:"")); });
    parts.push(`TOT ${t.ok}/${t.n}`);
    const el=CHAL.filter(q=>e[q.id]).map(q=>`${q.code}(${e[q.id]})`);
    parts.push("errori "+(el.length?el.join(" "):"-"));
    if(t.skips.length) parts.push("saltate "+t.skips.map(q=>q.code).join(" "));
    parts.push("ripetizioni "+rip());
    if(BES) parts.push("modalità facilitata");
    const n0=store.get("nome0"); if(n0 && nameKey(n0)!==nameKey(curName())) parts.push("nome iniziale: "+n0);
    const body=parts.join(" | ");
    return body+" | #"+sig(body, TOOL);
  }
  function codeBlock(){
    const t=tally(), g=guided(), e=errs(), rev=CHAL.filter(q=>e[q.id] || t.skips.includes(q));
    const note = x => { const ex=[]; if(x.skip) ex.push(pl(x.skip,"saltato","saltati")); if(x.miss) ex.push(pl(x.miss,"non fatto","non fatti")); return ex.length?`<small>${ex.join(", ")}</small>`:""; };
    const tag = q => [e[q.id]?`<i>(sbagliato ${e[q.id]===1?"1 volta":e[q.id]+" volte"})</i>`:"", t.skips.includes(q)?"<i>(saltato)</i>":""].filter(Boolean).join(" ");
    return `<div class="stats">${t.secs.map(x=>`<div class="stat"><small>${SEC[x.k].name}</small><b>${x.ok}/${x.n}</b>${note(x)}</div>`).join("")}<div class="stat tot"><small>Giusti al primo colpo</small><b>${t.ok}/${t.n}</b></div></div>
      <p class="small">Passi guidati: <b>${g.ok}/${GUIDED.length}</b>${g.skip?`, ${pl(g.skip,"saltato","saltati")}`:""}${g.hint?`, aiuti usati: ${g.hint}`:""}${rip()?` · ripetizioni della sfida: ${rip()}`:""}.</p>
      ${rev.length?`<details class="review" open><summary>Da ripassare (${rev.length})</summary><ul>${rev.map(q=>`<li><b>${plain(val(q.task))}</b> ${tag(q)}<br>${q.why}</li>`).join("")}</ul></details>`:""}
      <h3>Il tuo codice</h3>
      <p>Clic nel riquadro, ${K(CT,"A")} e ${K(CT,"C")}, poi incollalo con ${K(CT,"V")} nella tua <b>scheda</b>.</p>
      <textarea class="copy" readonly aria-label="Codice risultato">${esc(code())}</textarea>
      <p><button type="button" class="btn alt" data-copy>📋 Copia il codice</button> <span class="small" data-copied aria-live="polite"></span></p>
      <p class="small">I risultati restano solo su questo computer. Il codice finisce con un controllo (#…): se qualcuno modifica i numeri, il controllo non torna più.</p>`;
  }
  document.addEventListener("click", e=>{
    const b=e.target.closest("[data-copy]"); if(!b) return;
    const box=b.closest(".screen").querySelector("textarea.copy"), out=b.parentNode.querySelector("[data-copied]");
    const ok=()=>{ out.textContent="Copiato ✓ Ora incollalo nella scheda."; };
    const fallback=()=>{ box.focus(); box.select(); try{ document.execCommand("copy"); ok(); }catch(err){ out.textContent="Copia a mano: clic nel riquadro, "+CT+"+A e "+CT+"+C."; } };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(box.value).then(ok, fallback); else fallback();
  });

  function anyWork(){ return STEPS.some(s=>res(s.id)) || Object.keys(errs()).length>0 || rip()>0; }
  function saveHistory(){ const n=curName(); if(!n || !anyWork()) return; const h=store.get("hist")||{}; h[hashName(n)]={rip:rip()+1, errs:errs(), hints:guided().hint, bes:BES}; store.set("hist", h); }
  function restoreHistory(n){ if(anyWork()) return; const h=store.get("hist")||{}, k=hashName(n), p=h[k]; if(!p) return;
    store.set("rip", p.rip||0); store.set("errs", p.errs||{}); store.set("hintsPrev", p.hints||0); if(p.bes){ BES=true; store.set("bes", true); document.body.classList.add("bes"); const ob=$("#o-bes"); if(ob) ob.checked=true; } delete h[k]; store.set("hist", h); }

  const SCREENS = {
    welcome(el){
      el.innerHTML = `<h2>🗂️ Albero dei file</h2>
        <p>Sul PC della scuola hai una cartella tutta tua: <code>C:\\Utenti\\studente</code>. È il tuo zaino digitale. Oggi impari a muoverti tra le cartelle, a leggere e scrivere i percorsi e a mettere ogni file al suo posto.</p>
        <p>Si va <b>un passo alla volta</b>: leggi la spiegazione, prova nella finestra, poi premi <b>Controlla</b>. Alla fine c'è una sfida di <b>${CHAL.length} compiti</b> e il codice da incollare nella scheda.</p>
        <p class="small">Se un passo proprio non ti riesce puoi saltarlo: nel codice risulta saltato e non vale punti.</p>
        <p><label for="w-name"><b>Il tuo nome e cognome</b></label><br><input type="text" id="w-name" autocomplete="off" value="${esc(curName())}" placeholder="Nome e cognome"></p>
        <div class="fb ko hidden" id="w-err" role="alert"></div>
        <p><button type="button" class="btn" id="w-go">Inizia →</button></p>`;
      const go1=()=>{ const v=$("#w-name").value.replace(/\s+/g," ").trim();
        if(v.length<3){ const er=$("#w-err"); er.textContent="Scrivi il tuo nome e cognome (almeno 3 lettere), poi premi Inizia."; er.classList.remove("hidden"); $("#w-name").focus(); return; }
        const old=curName(), any=STEPS.some(s=>res(s.id));
        if(old && nameKey(old)!==nameKey(v) && any && !store.get("nome0")) store.set("nome0", old);
        restoreHistory(v); store.set("nome", v); next(); };
      $("#w-go").onclick=go1; $("#w-name").addEventListener("keydown", e=>{ if(e.key==="Enter") go1(); }); $("#w-name").focus();
    },
    finalX(el){
      el.innerHTML = `<h2>🏁 Sfida finale</h2>
        <p><b>${CHAL.length} compiti</b> in tre gruppi: navigare tra le cartelle, leggere e scrivere i percorsi, mettere in ordine. Ogni compito dice solo <b>che cosa</b> ottenere: <b>come</b> lo scegli tu.</p>
        <p>Conta il <b>primo tentativo</b>. Se sbagli, leggi perché e riprova: alla fine trovi l'elenco delle cose da ripassare. Puoi anche saltare un compito, ma vale zero.</p>
        <p class="small">Durante la sfida la 🎒 Tasca resta chiusa: conta quello che ricordi. La ritrovi alla fine.</p>
        <p><button type="button" class="btn" id="s-go">Inizia la sfida →</button></p>`;
      $("#s-go").onclick=next; $("#s-go").focus();
    },
    end(el){
      const t=tally();
      el.innerHTML = `<h2>${t.miss===0 && !t.skips.length?"🎉 Palestra completata":"📋 Riepilogo"}</h2>${codeBlock()}
        ${restartBox()}
        <details style="margin-top:14px"><summary class="small">Area docente: verifica un codice</summary>
          <textarea class="copy" id="r-verify" style="height:62px" aria-label="Codice da verificare"></textarea><p><button type="button" class="btn alt" id="r-vbtn">Verifica</button> <b id="r-vres" aria-live="polite"></b></p></details>`;
      $("#e-redo").onclick=e=>askRestart("sfida", e.currentTarget); $("#e-zero").onclick=e=>askRestart("zero", e.currentTarget);
      $("#r-vbtn").onclick=()=>{ const raw=$("#r-verify").value.replace(/\s+/g," ").trim(), k=raw.lastIndexOf(" | #"), r=$("#r-vres");
        if(k<0 || !/^HWS-[A-Z]{3} \|/.test(raw)){ r.textContent="✘ Codice incompleto"; r.style.color="#b3261e"; return; }
        const ok = sig(raw.slice(0,k), raw.slice(4, raw.indexOf(" |")))===raw.slice(k+4).trim();
        r.textContent = ok ? "✔ Codice valido" : "✘ Codice NON valido: il testo è stato modificato"; r.style.color = ok ? "#1e7d3a" : "#b3261e"; };
    }
  };

  $("#b-check").onclick=check; $("#b-next").onclick=next; $("#b-hint").onclick=hint; $("#b-skip").onclick=skip;
  $("#l-speak").onclick=()=>{ try{ speechSynthesis.cancel(); const step=STEPS[pos];
    const txt=[$("#l-title").innerText, $("#l-theory").innerText, $("#l-task").innerText, step.quiz?step.quiz.map((o,i)=>String.fromCharCode(65+i)+". "+plain(o.t)).join(". "):""].filter(Boolean).join(". ");
    const u=new SpeechSynthesisUtterance(txt); u.lang="it-IT"; u.rate=.95; speechSynthesis.speak(u); }catch(e){} };
  /* RIAVVIO-JS inizio: scelta alla fine e avviso grande prima di cancellare il codice */
  function redoChallenge(){ CHAL.forEach(q=>store.del("r_"+q.id)); store.set("rip", rip()+1); go(idx("x0")); }
  function resetAll(){ saveHistory(); store.clear(); window.scrollTo(0,0); location.reload(); }
  function restartBox(){
    const n=curName();
    return `<div class="restart"><h3>Vuoi ricominciare?</h3>
      <p>${n?`Questo è il lavoro di <b>${esc(n)}</b>. `:""}<b>Prima incolla il codice ${RS.dove}</b>: se ricominci, il codice qui sopra si cancella e alla fine ne avrai uno nuovo.</p>
      <p><button type="button" class="btn alt" id="e-redo">↺ Rifai solo la sfida</button> <span class="rs-note">Restano il nome e i passi guidati. Rifai solo ${RS.prove} della sfida.</span></p>
      <p><button type="button" class="btn danger" id="e-zero">🗑️ Ricomincia tutto da zero</button> <span class="rs-note">Si cancella tutto, anche il nome. Serve anche quando tocca a un compagno.</span></p>
      ${RS.lv?`<p>Vuoi fare l'altro livello? Ricomincia tutto da zero: lo scegli nella prima schermata.</p>`:""}
      <p class="small">Puoi ricominciare quante volte vuoi: il codice nuovo conta le ripetizioni e ricorda tutti gli errori.</p></div>`;
  }
  function askRestart(kind, opener){
    if(document.getElementById("rs-wrap")) return;
    const zero=kind==="zero", n=curName(), who=n?`il codice di ${esc(n)}`:"il codice salvato su questo computer";
    try{ speechSynthesis.cancel(); }catch(e){}
    const w=document.createElement("div"); w.id="rs-wrap"; w.className="modal rs-wrap";
    w.innerHTML=`<div class="screen warn" role="alertdialog" aria-modal="true" aria-labelledby="rs-t" aria-describedby="rs-d">
      <div class="warn-body">
        <div class="warn-ic" aria-hidden="true">⚠️</div>
        <h2 id="rs-t">${zero?"Ricominci tutto da zero?":"Rifai solo la sfida?"}</h2>
        <p class="warn-key" id="rs-d">Attenzione: <b>${zero?who:"il codice di adesso"} si perde per sempre</b>. È il codice da consegnare all'insegnante.</p>
        <p>${zero ? (n?`<b>Sei tu?</b> Prima incolla il codice ${RS.dove}. <b>Non sei tu?</b> Chiedi a ${esc(n)} se l'ha già copiato.`:`<b>È tuo?</b> Prima incolla il codice ${RS.dove}.`) : `<b>Non l'hai ancora incollato ${RS.dove}?</b> Copialo adesso.`}</p>
        <textarea class="copy" readonly aria-label="Il codice di adesso">${esc(code())}</textarea>
        <p><button type="button" class="btn alt" data-copy>📋 Copia il codice</button> <span class="rs-copied" data-copied aria-live="polite"></span></p>
        <p>${zero?`Si cancella tutto: nome, ${RS.lv?"livello, ":""}passi guidati e sfida. Se ricominci tu${RS.lv?" con lo stesso livello":""}, il codice nuovo conta la ripetizione e ricorda gli errori di prima.`:`${RS.risp} di adesso si cancellano; nome e passi guidati restano. Se ti fermi a metà, nel codice nuovo il resto risulta non fatto. Il codice nuovo conta la ripetizione e ricorda gli errori di prima.`}</p>
      </div>
      <div class="warn-acts"><button type="button" class="btn" id="rs-no">No, lascio tutto com'è</button><button type="button" class="btn danger" id="rs-yes">🗑️ ${zero?"Sì, cancello tutto e ricomincio":"Sì, cancello e rifaccio la sfida"}</button></div></div>`;
    document.body.appendChild(w);
    const t0=Date.now(), no=w.querySelector("#rs-no"), yes=w.querySelector("#rs-yes");
    const onKey=e=>{ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if(e.key==="Tab"){ const f=[...w.querySelectorAll("button,textarea")], a=f[0], z=f[f.length-1];
        if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } } };
    const onFocus=e=>{ if(!w.contains(e.target)) no.focus({preventScroll:true}); };
    function close(back){ document.removeEventListener("keydown", onKey, true); document.removeEventListener("focusin", onFocus, true); w.remove();
      if(back && opener && document.contains(opener)) opener.focus({preventScroll:true}); }
    document.addEventListener("keydown", onKey, true); document.addEventListener("focusin", onFocus, true);
    /* i primi 600 ms non contano: il secondo colpo di un doppio clic non conferma e non chiude */
    no.onclick=()=>{ if(Date.now()-t0<600) return; close(true); };
    yes.onclick=()=>{ if(Date.now()-t0<600) return; close(false); if(zero) resetAll(); else redoChallenge(); };
    no.focus({preventScroll:true}); w.querySelector(".warn-body").scrollTop=0;
  }
  /* RIAVVIO-JS fine */
  $("#f-code").onclick=()=>{ const m=$("#modal"); m.innerHTML=`<div class="screen">${codeBlock()}<p><button type="button" class="btn alt" id="m-close">Chiudi e continua</button></p></div>`; m.classList.remove("hidden"); $("#m-close").onclick=()=>{ m.classList.add("hidden"); $("#f-code").focus(); }; $("#m-close").focus(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#modal").classList.contains("hidden")){ $("#modal").classList.add("hidden"); $("#f-code").focus(); } });
  $("#o-bes").checked=BES; document.body.classList.toggle("bes", BES);
  $("#o-bes").onchange=e=>{ BES=e.target.checked; store.set("bes", BES); document.body.classList.toggle("bes", BES); render(); };
  $("#o-reset").onclick=e=>{ if(!anyWork()){ resetAll(); return; } askRestart("zero", e.currentTarget); };
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ $("#opts").open=false; go(idx(b.dataset.jump)); });

  return {render};
})();
App.render();
</script>
</body>
</html>
