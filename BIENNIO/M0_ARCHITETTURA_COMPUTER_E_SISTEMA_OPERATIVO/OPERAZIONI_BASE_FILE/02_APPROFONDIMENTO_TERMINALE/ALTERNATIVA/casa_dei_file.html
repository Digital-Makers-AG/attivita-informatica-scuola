<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La casa dei file</title>
<style>
:root{--teal:#0B6E75;--teal-d:#085055;--teal-l:#E3F2F2;--orange:#D9661A;--orange-l:#FDEBDC;--ink:#1d2329;--muted:#55616a;--ok:#1e7d3a;--ok-l:#dff3e4;--soft:#fff4cc;--bg:#f7f5f0;--line:#cfd6db;--glow:#ffb020}
*{box-sizing:border-box}
body{margin:0;font-family:Verdana,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:20px;line-height:1.5}
body.small-text{font-size:17px}
header{background:var(--teal);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
.stickers{display:flex;gap:6px;font-size:26px;margin-left:auto}
.stickers span{opacity:.25}.stickers span.got{opacity:1}
.gear{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:4px 12px;cursor:pointer;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:20px}
.hidden{display:none!important}
button{font-family:inherit}
.big{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:16px 28px;font-size:1.1em;cursor:pointer;min-height:64px}
.big:hover{background:var(--teal-d)}
.big.alt{background:#fff;color:var(--teal);border:3px solid var(--teal)}
.big:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:26px 30px}
.intro{max-width:760px;margin:10px auto;text-align:center}
.intro .pic{font-size:80px;line-height:1.1;margin:6px 0 10px}
.intro h2{color:var(--teal);margin:0 0 10px;font-size:1.5em}
.intro p{margin:0 0 14px}
.intro input{font-size:1em;padding:12px 14px;border:3px solid var(--line);border-radius:12px;width:100%;max-width:360px;font-family:inherit;text-align:center}
/* compito */
.task{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--teal);border-radius:18px;padding:14px 18px;margin-bottom:14px}
.task .say{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--teal-l);font-size:28px;cursor:pointer}
.task .txt{flex:1;font-size:1.15em;font-weight:bold}
.task .dots{flex:none;display:flex;gap:6px}
.task .dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.task .dots i.done{background:var(--ok)}.task .dots i.now{background:var(--orange)}
.fb{border-radius:14px;padding:12px 18px;margin:12px 0;font-size:1.05em;min-height:0}
.fb.ok{background:var(--ok-l);color:#14532b;font-weight:bold}
.fb.soft{background:var(--soft);color:#5a4500}
.controls{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:10px}
/* evidenziazione del passo giusto */
.glow{animation:glow 1.1s ease-in-out infinite;box-shadow:0 0 0 5px var(--glow)!important;position:relative}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px var(--glow)}50%{box-shadow:0 0 0 10px rgba(255,176,32,.45)}}
@media (prefers-reduced-motion: reduce){.glow{animation:none}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ordina */
.holding{display:flex;justify-content:center;margin:6px 0 18px}
.item{background:#fff;border:3px dashed var(--orange);border-radius:18px;padding:14px 26px;text-align:center;min-width:220px}
.item .ic{font-size:70px;line-height:1.1}
.item .nm{font-weight:bold}
.folders{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.tile{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 10px;width:170px;min-height:160px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.95em;color:var(--ink)}
.tile:hover{border-color:var(--teal)}
.tile .ic{font-size:58px;line-height:1.1}
.tile .lbl{font-weight:bold;text-align:center;word-break:break-word}
.tile .inside{font-size:22px;letter-spacing:2px;min-height:26px}
.tile.fold{background:#fffbea}
.fsvg{width:92px;height:70px}
/* esplora */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.back{background:#fff;border:3px solid var(--teal);color:var(--teal);border-radius:14px;padding:10px 18px;font-size:1em;cursor:pointer;font-weight:bold;min-height:58px}
.back:disabled{opacity:.35;cursor:default}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;flex:1}
.crumbs button{background:var(--teal-l);border:0;border-radius:10px;padding:6px 12px;font-size:.9em;cursor:pointer;color:var(--ink)}
.crumbs button.cur{background:var(--teal);color:#fff;font-weight:bold}
.crumbs .sep{color:var(--muted)}
.hand{display:flex;align-items:center;gap:12px;background:var(--orange-l);border:3px dashed var(--orange);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.hand .ic{font-size:40px}
.hand .put{margin-left:auto}
.grid{display:flex;gap:16px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;min-height:220px}
.empty{color:var(--muted);align-self:center;margin:auto}
/* vista "computer vero" */
.win{background:#fff;border:1px solid #b9c2c9;border-radius:10px;overflow:hidden}
.win-bar{display:flex;gap:10px;align-items:center;background:#f3f3f3;border-bottom:1px solid #ddd;padding:8px 10px}
.win-bar .wback{width:48px;height:42px;border:1px solid #bbb;background:#fff;border-radius:8px;font-size:22px;cursor:pointer}
.win-bar .wback:disabled{opacity:.35}
.win-bar .addr{flex:1;background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;font-size:.8em}
.win-head,.wrow{display:grid;grid-template-columns:52px 1fr 220px;align-items:center}
.win-head{font-size:.7em;color:#555;background:#fafafa;border-bottom:1px solid #e3e3e3;padding:4px 0}
.wrow{width:100%;background:none;border:1px solid transparent;text-align:left;font-size:.85em;padding:4px 0;cursor:default;color:var(--ink)}
.wrow:hover{background:#eaf4fd}.wrow.sel{background:#cce8ff;border-color:#99d1ff}
.wrow .i{font-size:26px;text-align:center}
.wlist{min-height:230px;padding:4px 0}
.wstatus{font-size:.7em;color:#444;background:#fafafa;border-top:1px solid #e3e3e3;padding:4px 10px}
/* salva con nome */
.save{background:#fff;border:3px solid var(--teal);border-radius:18px;padding:16px 18px}
.save h3{margin:0 0 6px;color:var(--teal)}
.names{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.names button{background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 16px;font-size:1em;cursor:pointer;color:var(--ink)}
.names button.on{border-color:var(--teal);background:var(--teal-l);font-weight:bold}
.names button.no{border-color:#d9a0a0;background:#fbe9e9;text-decoration:line-through}
.stepno{display:inline-block;background:var(--orange);color:#fff;border-radius:50%;width:32px;height:32px;text-align:center;line-height:32px;font-weight:bold;margin-right:6px}
/* impostazioni e riepilogo */
.panel{position:fixed;right:16px;top:60px;z-index:30;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:15px;width:min(380px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.2)}
.panel h3{margin:0 0 8px;color:var(--teal)}
.panel label{display:block;margin:6px 0}
.panel .lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.panel .lv button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
table.rep{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
table.rep th,table.rep td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.rep th{background:var(--teal-l)}
.legend{font-size:14px;color:var(--muted)}
@media print{header,.controls,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
@media(max-width:700px){.tile{width:140px}.win-head,.wrow{grid-template-columns:44px 1fr}.win-head div:nth-child(3),.wrow div:nth-child(3){display:none}}
</style>
</head>
<body>
<header>
  <h1>🏠 La casa dei file</h1>
  <span id="h-name" style="font-size:16px"></span>
  <div class="stickers" id="stickers" aria-label="Adesivi raccolti"></div>
  <button class="gear" id="gear" aria-expanded="false">⚙ Insegnante</button>
</header>
<div class="panel hidden" id="panel">
  <h3>Impostazioni</h3>
  <label><input type="checkbox" id="s-voice" checked> Voce che legge le istruzioni</label>
  <label><input type="checkbox" id="s-slow" checked> Voce lenta</label>
  <label><input type="checkbox" id="s-small"> Testo un po' più piccolo</label>
  <label><input type="checkbox" id="s-simple"> Vista semplice anche nel livello 5</label>
  <div>Vai al livello:<div class="lv" id="s-levels"></div></div>
  <p style="margin:10px 0 4px"><button class="big alt" style="min-height:0;padding:6px 12px;font-size:14px" id="s-report">📋 Riepilogo per l'insegnante</button></p>
  <p style="margin:6px 0 0"><button class="linkish" id="s-reset" style="background:none;border:0;color:#b3261e;text-decoration:underline;cursor:pointer;font-size:14px;padding:0">Nuovo studente: cancella tutto</button></p>
</div>

<main>
  <section id="intro" class="card intro"></section>
  <section id="play" class="hidden">
    <div class="task"><button class="say" id="say" aria-label="Ascolta di nuovo">🔊</button><div class="txt" id="task-txt"></div><div class="dots" id="dots"></div></div>
    <div id="board"></div>
    <div class="fb hidden" id="fb" role="status" aria-live="polite"></div>
    <div class="controls">
      <button class="big alt" id="help">💡 Aiutami</button>
      <button class="big hidden" id="next">Avanti ➜</button>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const mem={};
const store={ get(k){ try{ const v=localStorage.getItem("casafile_"+k); return v?JSON.parse(v):(mem[k]??null);}catch(e){ return mem[k]??null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem("casafile_"+k, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith("casafile_")).forEach(k=>localStorage.removeItem(k)); }catch(e){} for(const k in mem) delete mem[k]; } };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pick = a => a[Math.floor(Math.random()*a.length)];
const PRAISE = ["Giusto!","Ottimo!","Ce l'hai fatta!","Perfetto!","Benissimo!"];
const nome = () => store.get("nome")||"";
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"mario";
const firstName = () => slug((nome().split(/\s+/)[0])||"");

/* ---------------- voce ---------------- */
const S = { voice: store.get("voice") ?? true, slow: store.get("slow") ?? true, small: store.get("small") ?? false, simple: store.get("simple") ?? false };
function speak(t){ if(!S.voice) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/[›»«]/g," ").replace(/<[^>]+>/g,"")); u.lang="it-IT"; u.rate=S.slow?.8:1; speechSynthesis.speak(u); }catch(e){} }

/* ---------------- cartelle e file ---------------- */
const FOLDER = (name, kids=[]) => ({name, folder:true, kids});
const FILE = (label, ic, kind, fname) => ({name:label, ic, kind, fname, folder:false});
const KIND = {foto:"una foto", doc:"un documento", musica:"una canzone", video:"un video"};
const KIND_TYPE = {foto:"File JPG", doc:"Documento", musica:"File MP3", video:"File MP4"};
const fsvg = (color="#F2C94C") => `<svg class="fsvg" viewBox="0 0 92 70" aria-hidden="true"><path d="M4 12a6 6 0 0 1 6-6h24l8 8h40a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="${color}" stroke="#c9a227" stroke-width="2"/><path d="M4 24h84v36a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#F7D774"/></svg>`;
const FOLDER_IC = {Foto:"🖼️", Documenti:"📄", Musica:"🎵", Video:"🎬", Vacanze:"🏖️", Compleanni:"🎂", Animali:"🐾", Lavoro:"💼", Viaggi:"🚆", Ricette:"🍰", Scuola:"🎒"};

function worldL2(){ return FOLDER("Il mio computer",[ FOLDER("Foto",[FILE("cane","🐶","foto","cane.jpg"), FILE("gatto","🐱","foto","gatto.jpg")]), FOLDER("Documenti",[FILE("biglietto del treno","🎫","doc","biglietto_treno.pdf")]), FOLDER("Musica",[FILE("canzone preferita","🎵","musica","canzone_preferita.mp3"), FILE("musica per la festa","🎶","musica","musica_festa.mp3")]) ]); }
function worldL3(){ return FOLDER("Il mio computer",[ FOLDER("Foto",[FOLDER("Vacanze",[FILE("mare","🌊","foto","mare.jpg"), FILE("montagna","⛰️","foto","montagna.jpg")]), FOLDER("Compleanni",[FILE("candeline","🕯️","foto","candeline.jpg")]), FILE("cane","🐶","foto","cane.jpg")]), FOLDER("Documenti",[FILE("biglietto del treno","🎫","doc","biglietto_treno.pdf")]), FOLDER("Musica",[FILE("canzone preferita","🎵","musica","canzone_preferita.mp3")]) ]); }
function worldL4(){ return FOLDER("Il mio computer",[ FOLDER("Foto",[FOLDER("Vacanze"), FOLDER("Compleanni")]), FOLDER("Documenti",[FOLDER("Lavoro"), FOLDER("Ricette"), FOLDER("Viaggi")]), FOLDER("Musica") ]); }
function worldL5(){
  const cv = store.get("cv") || `curriculum_${firstName()}`;
  return FOLDER("Il mio computer",[
    FOLDER("Documenti",[ FOLDER("Lavoro",[FILE(cv,"📝","doc",cv+".docx"), FILE("lettera per il negozio","✉️","doc","lettera_negozio.docx")]), FOLDER("Ricette",[FILE("ricetta della torta","🍰","doc","ricetta_torta.docx")]), FOLDER("Scuola",[FILE("compiti","📘","doc","compiti.docx")]), FOLDER("Viaggi",[FILE("biglietto del treno","🎫","doc","biglietto_treno.pdf"), FILE("prenotazione hotel","🏨","doc","prenotazione_hotel.pdf")]) ]),
    FOLDER("Foto",[ FOLDER("Animali",[FILE("gatto","🐱","foto","gatto.jpg")]), FOLDER("Compleanni",[FILE("torta","🎂","foto","torta.jpg")]), FOLDER("Vacanze",[FILE("mare","🌊","foto","mare.jpg")]) ]),
    FOLDER("Musica",[FILE("canzone preferita","🎵","musica","canzone_preferita.mp3"), FILE("musica per la festa","🎶","musica","musica_festa.mp3")]),
    FOLDER("Video",[FILE("video della festa","🎬","video","video_festa.mp4")]) ]);
}

/* ---------------- livelli ---------------- */
const LEVELS = [
 {id:1, sticker:"📦", title:"Ogni cosa al suo posto", pic:"📄 🖼️ 🎵 ➜ 📁",
  intro:"Nel computer ci sono <b>file</b> e <b>cartelle</b>.<br>Un <b>file</b> è una cosa: una foto, una lettera, una canzone.<br>Una <b>cartella</b> è come una <b>scatola</b>: tiene insieme le cose che si somigliano.",
  tasks:[
   {type:"sort", item:FILE("cane","🐶","foto"), answer:"Foto", model:true},
   {type:"sort", item:FILE("curriculum","📝","doc"), answer:"Documenti"},
   {type:"sort", item:FILE("canzone preferita","🎵","musica"), answer:"Musica"},
   {type:"sort", item:FILE("biglietto del treno","🎫","doc"), answer:"Documenti"},
   {type:"sort", item:FILE("torta di compleanno","🎂","foto"), answer:"Foto"},
   {type:"sort", item:FILE("musica per la festa","🎶","musica"), answer:"Musica"}]},
 {id:2, sticker:"🔑", title:"Apri e guarda dentro", pic:"📁 ➜ 🐶 🐱",
  intro:"Per vedere cosa c'è in una cartella, la <b>apri</b>.<br>Per uscire dalla cartella, premi <b>Indietro</b>.",
  world:worldL2,
  tasks:[
   {type:"open", target:["Foto"], say:"Apri la cartella Foto.", model:true},
   {type:"find", target:["Foto"], file:"cane", say:"Trova la foto del cane. Toccala."},
   {type:"open", target:[], say:"Premi Indietro per uscire dalla cartella."},
   {type:"find", target:["Musica"], file:"canzone preferita", say:"Trova la canzone preferita."}]},
 {id:3, sticker:"🧭", title:"Scatole dentro le scatole", pic:"📁 ➜ 📁 ➜ 🌊",
  intro:"Dentro una cartella ci possono essere <b>altre cartelle</b>.<br>In alto vedi la <b>strada</b> che hai fatto per arrivare.",
  world:worldL3,
  tasks:[
   {type:"open", target:["Foto","Vacanze"], say:"Apri la cartella Foto. Poi apri la cartella Vacanze.", model:true},
   {type:"find", target:["Foto","Vacanze"], file:"mare", say:"Trova la foto del mare."},
   {type:"place", item:FILE("torta","🎂","foto","torta.jpg"), target:["Foto","Compleanni"], say:"Hai una foto nuova: la torta. Mettila nella cartella Foto, poi Compleanni."},
   {type:"place", item:FILE("spiaggia","🏖️","foto","spiaggia.jpg"), target:["Foto","Vacanze"], say:"Hai la foto della spiaggia. Mettila nella cartella Foto, poi Vacanze."}]},
 {id:4, sticker:"💾", title:"Salva nel posto giusto", pic:"💾 ➜ 📁 + ✏️",
  intro:"Quando <b>salvi</b>, il computer ti chiede due cose:<br><b>1. dove</b> lo metti, <b>2. che nome</b> gli dai.<br>Un buon nome dice cosa c'è dentro.",
  world:worldL4,
  tasks:[
   {type:"save", item:FILE("curriculum","📝","doc"), target:["Documenti","Lavoro"], model:true,
    say:"Hai scritto il tuo curriculum. Salvalo in Documenti, poi Lavoro. Poi scegli il nome giusto.",
    names:()=>[{t:"Documento1", why:"«Documento1» non dice cosa c'è dentro. Tra un mese non lo ritrovi."},{t:`curriculum_${firstName()}`, ok:true},{t:"xkq7", why:"«xkq7» è un nome a caso. Non si capisce cosa c'è dentro."}]},
   {type:"save", item:FILE("ricetta della torta","🍰","doc"), target:["Documenti","Ricette"],
    say:"Hai scritto la ricetta della torta. Salvala nella cartella giusta, con il nome giusto.",
    names:()=>[{t:"nuovo", why:"«nuovo» non dice cosa c'è dentro."},{t:"ricetta", why:"Quale ricetta? Meglio dire anche «torta»."},{t:"ricetta_torta", ok:true}]}]},
 {id:5, sticker:"🔍", title:"Ritrova le tue cose", pic:"🖥️ 🔍",
  intro:"Adesso la finestra è <b>come sul computer vero</b>.<br>Per aprire una cartella fai <b>due clic veloci</b>.<br>Se ti serve, premi <b>Aiutami</b>.",
  world:worldL5, real:true,
  tasks:[
   {type:"find", target:["Documenti","Viaggi"], file:"biglietto del treno", say:"Sei in stazione. Il controllore vuole vedere il biglietto del treno. Trovalo."},
   {type:"find", target:["Musica"], file:"canzone preferita", say:"Un amico vuole sentire la tua canzone preferita. Trovala."},
   {type:"find", target:["Documenti","Lavoro"], file:"@cv", say:"Oggi hai un colloquio di lavoro. Ritrova il curriculum che hai salvato."},
   {type:"place", item:FILE("cane nuovo","🐕","foto","cane_nuovo.jpg"), target:["Foto","Animali"], say:"Hai fatto una foto al tuo cane nuovo. Mettila nella cartella Foto, poi Animali."}]}
];

/* ---------------- stato ---------------- */
let L=0, T=0, world=null, cwd=[], tstate={}, saved=store.get("results")||{};
const lv = () => LEVELS[L], task = () => lv().tasks[T];
const realView = () => lv().real && !S.simple;
const node = path => { let n=world; for(const p of path){ n=n.kids.find(k=>k.folder && k.name===p); if(!n) return null; } return n; };
const isPre = (a,b) => a.length<=b.length && a.every((x,i)=>x===b[i]);
const fileLabel = t => t.file==="@cv" ? (store.get("cv")||`curriculum_${firstName()}`) : t.file;

/* ---------------- intro / fine ---------------- */
function stickers(){ $("#stickers").innerHTML = LEVELS.map(l=>`<span class="${store.get("done"+l.id)?"got":""}" title="${esc(l.title)}">${l.sticker}</span>`).join(""); }
function showIntro(){
  $("#play").classList.add("hidden"); const el=$("#intro"); el.classList.remove("hidden");
  if(!nome()){
    el.innerHTML=`<div class="pic">🏠</div><h2>La casa dei file</h2><p>Il computer è come una casa: ogni cosa ha il suo posto.<br>Oggi impari a <b>mettere in ordine</b> e a <b>ritrovare</b> le tue cose.</p>
      <p><label for="n">Come ti chiami?</label><br><input id="n" autocomplete="off"></p><p><button class="big" id="go">Iniziamo ➜</button></p>`;
    const go=()=>{ const v=$("#n").value.trim(); if(v.length<2){ $("#n").focus(); return; } store.set("nome",v); $("#h-name").textContent=v; showIntro(); };
    $("#go").onclick=go; $("#n").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }); $("#n").focus(); return;
  }
  const l=lv();
  el.innerHTML=`<div class="small" style="color:var(--muted)">Livello ${l.id} di ${LEVELS.length}</div><div class="pic">${l.pic}</div><h2>${l.title}</h2><p>${l.intro}</p><p><button class="big" id="go">Iniziamo ➜</button> <button class="big alt" id="hear">🔊 Ascolta</button></p>`;
  $("#go").onclick=startLevel; $("#hear").onclick=()=>speak(l.title+". "+l.intro.replace(/<br>/g,". "));
  $("#go").focus(); speak(l.title+". "+l.intro.replace(/<br>/g,". "));
}
function showEnd(){
  $("#play").classList.add("hidden"); const el=$("#intro"); el.classList.remove("hidden");
  el.innerHTML=`<div class="pic">🏆</div><h2>Ottimo lavoro, ${esc(nome())}!</h2><p>Hai raccolto tutti gli adesivi:</p><div class="pic" style="font-size:54px">${LEVELS.map(l=>l.sticker).join(" ")}</div>
    <p>Adesso sai mettere le cose <b>al loro posto</b>, <b>salvarle</b> con un buon nome e <b>ritrovarle</b>.</p>
    <p><button class="big alt" id="again">↺ Rigioca un livello</button></p>`;
  $("#again").onclick=()=>{ openPanel(true); };
  speak(`Ottimo lavoro! Hai raccolto tutti gli adesivi. Adesso sai mettere le cose al loro posto, salvarle con un buon nome e ritrovarle.`);
}
function startLevel(){ T=0; world = lv().world ? lv().world() : null; $("#intro").classList.add("hidden"); $("#play").classList.remove("hidden"); startTask(); }

/* ---------------- compiti ---------------- */
function taskText(t){
  if(t.type==="sort") return `Dove va <b>${esc(t.item.name)}</b>? Tocca la cartella giusta.`;
  return esc(t.say);
}
function startTask(){
  const t=task(); tstate={err:0, help:0, done:false, hold: t.type==="place" ? t.item : null, name:null, sel:null};
  if(t.type!=="sort") cwd = t.type==="open" && t.target.length===0 ? ["Foto"] : (T===0 || t.type==="save" || lv().real ? [] : cwd);
  if(t.type==="save") cwd=[];
  $("#task-txt").innerHTML = taskText(t);
  $("#dots").innerHTML = lv().tasks.map((_,i)=>`<i class="${i<T?"done":i===T?"now":""}"></i>`).join("");
  $("#fb").className="fb hidden"; $("#next").classList.add("hidden"); $("#help").classList.remove("hidden");
  draw(); speak($("#task-txt").textContent);
  if(t.model) setTimeout(()=>hint(false), 400);   // modellamento: il primo compito di ogni livello mostra il passo giusto
}
function feedback(kind, html, voice){ const f=$("#fb"); f.className="fb "+kind; f.innerHTML=html; speak(voice||f.textContent); }
function success(msg){
  tstate.done=true; clearGlow();
  const res = tstate.err===0 && tstate.help===0 && !task().model ? "solo" : (tstate.err+tstate.help)<=1 ? "aiuto" : "aiuti";
  saved[`${lv().id}.${T}`]={res, err:tstate.err, help:tstate.help, model:!!task().model}; store.set("results",saved);
  const p=pick(PRAISE); feedback("ok", `✔ ${p} ${msg||""}`, `${p} ${msg||""}`);
  $("#help").classList.add("hidden"); const nb=$("#next"); nb.classList.remove("hidden");
  nb.textContent = T===lv().tasks.length-1 ? "Prendi l'adesivo ➜" : "Avanti ➜"; nb.focus();
}
function soft(msg, voice){ tstate.err++; feedback("soft", "💬 "+msg, voice); hint(true); }
$("#next").onclick=()=>{
  if(T<lv().tasks.length-1){ T++; startTask(); return; }
  store.set("done"+lv().id, true); stickers();
  if(L<LEVELS.length-1){ L++; store.set("level",L); showIntro(); } else showEnd();
};
$("#say").onclick=()=>speak($("#task-txt").textContent);

/* ---------------- aiuto: illumina il passo giusto ---------------- */
function clearGlow(){ document.querySelectorAll(".glow").forEach(e=>e.classList.remove("glow")); }
function glow(sel){ clearGlow(); const e=document.querySelector(sel); if(e){ e.classList.add("glow"); e.scrollIntoView({block:"nearest",behavior:"smooth"}); } }
function nextStep(){
  const t=task();
  if(t.type==="sort") return {sel:`[data-folder="${t.answer}"]`, say:`Guarda la cartella che si illumina: ${t.answer}.`};
  const target=t.target;
  if(t.type==="save" && tstate.name && !pathOK()){ /* prima il posto */ }
  if(!isPre(cwd,target)) return {sel:"#backbtn", say: realView() ? "Premi la freccia indietro, in alto." : "Premi Indietro."};
  if(cwd.length<target.length){ const n=target[cwd.length]; return {sel:`[data-folder="${n}"]`, say: realView() ? `Fai due clic veloci sulla cartella ${n}.` : `Apri la cartella ${n}.`}; }
  if(t.type==="find") return {sel:`[data-file="${CSS.escape(fileLabel(t))}"]`, say:`Eccolo! Tocca ${fileLabel(t)}.`};
  if(t.type==="place") return {sel:"#putbtn", say:"Sei nel posto giusto. Premi Metti qui."};
  if(t.type==="save"){ if(!tstate.name || !tstate.name.ok){ const i=t.names().findIndex(n=>n.ok); return {sel:`[data-name="${i}"]`, say:"Adesso scegli il nome che dice cosa c'è dentro."}; } return {sel:"#savebtn", say:"Premi Salva."}; }
  return null;
}
const pathOK = () => { const t=task(); return cwd.length===t.target.length && isPre(cwd,t.target); };
function hint(count){ if(tstate.done) return; const s=nextStep(); if(!s) return; if(count===undefined){ tstate.help++; } glow(s.sel); if(count===undefined) feedback("soft","💡 "+s.say, s.say); }
$("#help").onclick=()=>hint();

/* ---------------- disegno ---------------- */
function draw(){
  const t=task(), b=$("#board");
  if(t.type==="sort"){ drawSort(b,t); return; }
  if(t.type==="save"){ drawSave(b,t); return; }
  b.innerHTML = (tstate.hold ? handHtml() : "") + (realView() ? realHtml() : simpleHtml());
  bindExplore();
}
function drawSort(b,t){
  const F=["Foto","Documenti","Musica"];
  b.innerHTML=`<div class="holding"><div class="item"><div class="ic">${t.item.ic}</div><div class="nm">${esc(t.item.name)}</div></div></div>
    <div class="folders">${F.map(f=>`<button class="tile fold" data-folder="${f}">${fsvg()}<div class="lbl">${FOLDER_IC[f]} ${f}</div></button>`).join("")}</div>`;
  b.querySelectorAll("[data-folder]").forEach(el=>el.onclick=()=>{
    if(tstate.done) return;
    const f=el.dataset.folder;
    if(f===t.answer){ el.querySelector(".lbl").insertAdjacentHTML("afterend", `<div class="inside">${t.item.ic}</div>`); success(`${t.item.ic} va nella cartella ${f}.`); return; }
    el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400);
    soft(`Questa è ${KIND[t.item.kind]}. Nella cartella ${f} mettiamo ${f==="Foto"?"le foto":f==="Musica"?"la musica":"i documenti"}.`);
  });
}
function crumbsHtml(){
  const parts=[`<button data-crumb="-1" class="${cwd.length?"":"cur"}">🏠 ${esc(world.name)}</button>`].concat(cwd.map((p,i)=>`<span class="sep">›</span><button data-crumb="${i}" class="${i===cwd.length-1?"cur":""}">${FOLDER_IC[p]||"📁"} ${esc(p)}</button>`));
  return `<div class="crumbs" aria-label="La strada">${parts.join("")}</div>`;
}
function handHtml(){ const h=tstate.hold; return `<div class="hand"><span>In mano:</span><span class="ic">${h.ic}</span><b>${esc(realView()?h.fname:h.name)}</b><button class="big put" id="putbtn">📥 Metti qui</button></div>`; }
function kidsOf(){ const n=node(cwd); return n.kids.slice().sort((a,b)=>(b.folder-a.folder)||a.name.localeCompare(b.name,"it")); }
function simpleHtml(){
  const kids=kidsOf();
  const tiles=kids.map(k=> k.folder
    ? `<button class="tile fold" data-folder="${esc(k.name)}">${fsvg()}<div class="lbl">${FOLDER_IC[k.name]||""} ${esc(k.name)}</div></button>`
    : `<button class="tile" data-file="${esc(k.name)}"><div class="ic">${k.ic}</div><div class="lbl">${esc(k.name)}</div></button>`).join("");
  return `<div class="bar"><button class="back" id="backbtn" ${cwd.length?"":"disabled"}>⬅ Indietro</button>${crumbsHtml()}</div>
    <div class="grid">${tiles || '<div class="empty">Questa cartella è vuota.</div>'}</div>`;
}
function realHtml(){
  const kids=kidsOf();
  const rows=kids.map(k=>`<button class="wrow" ${k.folder?`data-folder="${esc(k.name)}"`:`data-file="${esc(k.name)}"`}><div class="i">${k.folder?"📁":k.ic}</div><div>${esc(k.folder?k.name:k.fname)}</div><div style="color:#555;font-size:.9em">${k.folder?"Cartella di file":KIND_TYPE[k.kind]}</div></button>`).join("");
  return `<div class="win"><div class="win-bar"><button class="wback" id="backbtn" ${cwd.length?"":"disabled"} aria-label="Indietro">←</button><div class="addr">🖥️ Questo PC${cwd.map(p=>" › "+esc(p)).join("")}</div></div>
    <div class="win-head"><div></div><div>Nome</div><div>Tipo</div></div><div class="wlist">${rows||'<div class="empty" style="padding:30px;text-align:center">Questa cartella è vuota.</div>'}</div>
    <div class="wstatus">${kids.length} elementi</div></div>`;
}
function go(path){
  const t=task(); cwd=path; tstate.sel=null; draw();
  if(tstate.done) return;
  if(t.type==="open" && cwd.length===t.target.length && isPre(cwd,t.target)){ success(t.target.length ? `Sei dentro la cartella ${t.target.at(-1)}.` : "Adesso sei fuori dalla cartella."); return; }
  if(t.type==="open" && t.target.length===0) return;
  if(!isPre(cwd,t.target)){ soft(`Qui siamo nella cartella ${cwd.at(-1)}. Non è la strada giusta: torniamo indietro.`); return; }
  if(t.model || tstate.err) hint(false);   // continua a mostrare il passo successivo
}
function bindExplore(){
  const t=task(), b=$("#board");
  const bk=$("#backbtn"); if(bk) bk.onclick=()=>go(cwd.slice(0,-1));
  b.querySelectorAll("[data-crumb]").forEach(c=>c.onclick=()=>go(cwd.slice(0,+c.dataset.crumb+1)));
  b.querySelectorAll("[data-folder]").forEach(el=>{
    if(realView()){
      el.addEventListener("mousedown", e=>{ b.querySelectorAll(".wrow.sel").forEach(r=>r.classList.remove("sel")); el.classList.add("sel"); if(e.detail>=2) go(cwd.concat(el.dataset.folder)); });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); go(cwd.concat(el.dataset.folder)); } });
    } else el.onclick=()=>go(cwd.concat(el.dataset.folder));
  });
  b.querySelectorAll("[data-file]").forEach(el=>el.onclick=()=>{
    if(tstate.done) return;
    b.querySelectorAll(".wrow.sel").forEach(r=>r.classList.remove("sel")); el.classList.add("sel");
    const n=el.dataset.file;
    if(t.type==="find" && n===fileLabel(t) && isPre(t.target,cwd) && cwd.length===t.target.length){ el.classList.add("glow"); success(`Hai trovato ${n}. Era in ${t.target.join(", poi ")}.`); return; }
    if(t.type==="find") soft(`Questo è «${n}». Stiamo cercando «${fileLabel(t)}».`);
    else if(t.type==="open") soft(`Questo è un file. Cerchiamo una cartella.`);
    else soft(`Hai già la foto in mano. Devi trovare la cartella giusta e premere Metti qui.`);
  });
  const put=$("#putbtn"); if(put) put.onclick=()=>{
    if(tstate.done) return;
    if(cwd.length===t.target.length && isPre(cwd,t.target)){ node(cwd).kids.push(tstate.hold); tstate.hold=null; draw(); success(`La foto è al suo posto: ${t.target.join(", poi ")}.`); return; }
    soft(cwd.length ? `Qui siamo in ${cwd.at(-1)}. La foto va in ${t.target.join(", poi ")}.` : `Prima apri la cartella ${t.target[0]}.`);
  };
}
function drawSave(b,t){
  const kids=kidsOf().filter(k=>k.folder), names=t.names();
  b.innerHTML=`<div class="save"><h3>💾 Salva con nome</h3><p style="margin:0 0 10px">Stai salvando: <b>${t.item.ic} ${esc(t.item.name)}</b></p>
    <p style="margin:8px 0"><span class="stepno">1</span><b>Dove?</b> Apri la cartella giusta.</p>
    <div class="bar"><button class="back" id="backbtn" ${cwd.length?"":"disabled"}>⬅ Indietro</button>${crumbsHtml()}</div>
    <div class="grid" style="min-height:0">${kids.map(k=>`<button class="tile fold" data-folder="${esc(k.name)}">${fsvg()}<div class="lbl">${FOLDER_IC[k.name]||""} ${esc(k.name)}</div></button>`).join("") || '<div class="empty">Qui dentro non ci sono altre cartelle.</div>'}</div>
    <p style="margin:14px 0 6px"><span class="stepno">2</span><b>Che nome?</b> Scegli il nome che dice cosa c'è dentro.</p>
    <div class="names">${names.map((n,i)=>`<button data-name="${i}" class="${tstate.name===n?"on":""} ${tstate.no&&tstate.no.includes(i)?"no":""}">${esc(n.t)}</button>`).join("")}</div>
    <p style="margin:12px 0 0"><button class="big" id="savebtn">💾 Salva</button></p></div>`;
  $("#backbtn").onclick=()=>{ cwd=cwd.slice(0,-1); drawSave(b,t); if(tstate.err||t.model) hint(false); };
  b.querySelectorAll("[data-crumb]").forEach(c=>c.onclick=()=>{ cwd=cwd.slice(0,+c.dataset.crumb+1); drawSave(b,t); });
  b.querySelectorAll("[data-folder]").forEach(el=>el.onclick=()=>{ cwd=cwd.concat(el.dataset.folder); drawSave(b,t);
    if(!isPre(cwd,t.target)) soft(`${t.item.name[0].toUpperCase()+t.item.name.slice(1)} non va nella cartella ${cwd.at(-1)}. Torniamo indietro.`);
    else if(tstate.err||t.model) hint(false); });
  b.querySelectorAll("[data-name]").forEach(el=>el.onclick=()=>{ const n=names[+el.dataset.name];
    if(!n.ok){ tstate.no=(tstate.no||[]).concat(+el.dataset.name); tstate.name=null; drawSave(b,t); soft(n.why); return; }
    tstate.name=n; drawSave(b,t); if(tstate.err||t.model) hint(false); });
  $("#savebtn").onclick=()=>{
    if(tstate.done) return;
    if(!pathOK()){ soft(cwd.length ? `Adesso sei in ${cwd.at(-1)}. ${t.item.name[0].toUpperCase()+t.item.name.slice(1)} va in ${t.target.join(", poi ")}.` : `Prima scegli dove: apri la cartella ${t.target[0]}.`); return; }
    if(!tstate.name){ soft("Manca il nome. Scegli il nome che dice cosa c'è dentro."); return; }
    if(t.model) store.set("cv", tstate.name.t);
    node(cwd).kids.push(FILE(tstate.name.t, t.item.ic, "doc", tstate.name.t+".docx"));
    success(`Hai salvato «${tstate.name.t}» in ${t.target.join(", poi ")}. Così lo ritrovi.`);
  };
}

/* ---------------- impostazioni e riepilogo ---------------- */
function openPanel(force){ const p=$("#panel"); const open = force===true ? true : p.classList.contains("hidden"); p.classList.toggle("hidden", !open); $("#gear").setAttribute("aria-expanded", String(open)); }
$("#gear").onclick=e=>{ e.stopPropagation(); openPanel(); };
document.addEventListener("click", e=>{ if(!e.target.closest("#panel") && !e.target.closest("#gear") && !e.target.closest("#again")) $("#panel").classList.add("hidden"); });
[["s-voice","voice"],["s-slow","slow"],["s-small","small"],["s-simple","simple"]].forEach(([id,k])=>{ const el=$("#"+id); el.checked=S[k]; el.onchange=()=>{ S[k]=el.checked; store.set(k,S[k]); document.body.classList.toggle("small-text",S.small); if(k==="simple" && !$("#play").classList.contains("hidden")) draw(); }; });
document.body.classList.toggle("small-text",S.small);
$("#s-levels").innerHTML = LEVELS.map((l,i)=>`<button data-l="${i}">${l.sticker} ${l.id}</button>`).join("");
$("#s-levels").querySelectorAll("button").forEach(b=>b.onclick=()=>{ L=+b.dataset.l; store.set("level",L); $("#panel").classList.add("hidden"); showIntro(); });
$("#s-reset").onclick=()=>{ if(confirm("Cancellare nome, adesivi e risultati?")){ store.clear(); location.reload(); } };
$("#s-report").onclick=()=>{
  $("#panel").classList.add("hidden"); $("#play").classList.add("hidden"); const el=$("#intro"); el.classList.remove("hidden");
  const lab={solo:"✅ in autonomia", aiuto:"🤝 con un aiuto", aiuti:"🧩 con più aiuti"};
  const rows=LEVELS.map(l=>l.tasks.map((t,i)=>{ const r=saved[`${l.id}.${i}`]; const what = t.type==="sort" ? `Mette «${t.item.name}» nella cartella giusta` : t.say;
    return `<tr><td>${i===0?`<b>${l.id}. ${l.title}</b>`:""}</td><td>${esc(what)}${t.model?' <span class="legend">(con dimostrazione)</span>':""}</td><td>${r?lab[r.res]:"—"}</td><td>${r?r.err:""}</td><td>${r?r.help:""}</td></tr>`; }).join("")).join("");
  el.innerHTML=`<div style="text-align:left"><h2 style="color:var(--teal)">📋 Riepilogo osservativo</h2>
    <p style="font-size:16px"><b>Studente:</b> ${esc(nome()||"—")} &nbsp; <b>Data:</b> ${new Date().toLocaleDateString("it-IT")}</p>
    <table class="rep"><tr><th>Livello</th><th>Compito</th><th>Esito</th><th>Tentativi non riusciti</th><th>Aiuti chiesti</th></tr>${rows}</table>
    <p class="legend">✅ in autonomia = nessun errore e nessun aiuto · 🤝 = un errore o un aiuto · 🧩 = più errori o aiuti. Nel primo compito di ogni livello il passo giusto viene mostrato (dimostrazione): conta come aiuto.<br>
    Il livello 5 usa una finestra simile a Esplora file ed è quello che dice di più sull'autonomia.</p>
    <p class="noprint"><button class="big" onclick="window.print()">🖨️ Stampa</button> <button class="big alt" id="back-game">⬅ Torna al gioco</button></p></div>`;
  $("#back-game").onclick=()=>showIntro();
};

/* ---------------- avvio ---------------- */
L = Math.min(store.get("level")||0, LEVELS.length-1);
$("#h-name").textContent = nome(); stickers(); showIntro();
</script>
</body>
</html>
