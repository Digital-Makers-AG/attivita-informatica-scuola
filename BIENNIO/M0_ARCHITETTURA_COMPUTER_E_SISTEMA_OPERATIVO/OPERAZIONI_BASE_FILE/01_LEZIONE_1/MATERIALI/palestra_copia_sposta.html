<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Copia o sposta? · Operazioni di base sui file</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%84%3C/text%3E%3C/svg%3E">
<style>
:root{--teal:#0B6E75;--teal-d:#085055;--teal-l:#E3F2F2;--orange:#D9661A;--orange-d:#9a4410;--orange-l:#FDEBDC;--ink:#1d2329;--muted:#5f6b73;--ok:#1e7d3a;--ok-l:#dff3e4;--ko:#b3261e;--ko-l:#fbe3e1;--mid:#7a5c00;--mid-l:#fff4cc;--bg:#f7f5f0;--line:#d5dade;--fs:16px}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.45}
body.bes{--fs:19px}
header{background:var(--teal);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}
header .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
.pbar{height:6px;background:#cfe3e4}.pbar div{height:100%;background:var(--orange);width:0;transition:width .4s}
main{max-width:1320px;margin:0 auto;padding:18px 20px 30px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.kbd{display:inline-block;border:1px solid #9aa4ab;border-bottom-width:3px;border-radius:5px;padding:0 7px;background:#fff;font-size:.9em;margin:0 1px;white-space:nowrap;color:var(--ink);font-weight:normal}
.keys{white-space:nowrap}
.menu-path{display:inline-block;background:#fff;border:1px solid #b9c2c9;border-radius:6px;padding:0 7px;font-size:.92em;white-space:nowrap}
code{background:#f1f1f1;border-radius:4px;padding:1px 5px;font-size:.92em;font-family:Consolas,"Courier New",monospace;overflow-wrap:anywhere}
.btn{background:var(--teal);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:1em;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal);border:2px solid var(--teal);padding:8px 14px}
.btn.hintb{background:#fff;color:var(--orange-d);border:2px solid var(--orange);padding:8px 14px}
.btn.skipb{background:#fff;color:var(--muted);border:2px solid var(--line);padding:8px 14px;margin-left:auto}
.btn.skipb:hover{background:#f2f4f5;color:var(--ink)}
.btn:focus-visible,input:focus-visible,.linkbtn:focus-visible,summary:focus-visible,.qopt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;font-family:inherit}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:14px;font-family:inherit}
/* schermate */
.screen{max-width:760px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.screen h2{color:var(--teal);margin:0 0 12px;font-size:1.6em}
.screen h3{color:var(--teal-d);margin:18px 0 6px}
.screen input[type=text]{font-size:1.1em;padding:9px 11px;border:2px solid var(--line);border-radius:8px;width:100%;max-width:360px;font-family:inherit}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--teal-l);border-radius:10px;padding:10px 14px;min-width:130px;flex:1}
.stat b{display:block;font-size:24px;color:var(--teal)}.stat small{display:block;color:var(--muted);font-size:13px}
.stat.tot{background:var(--orange-l)}.stat.tot b{color:var(--orange-d)}
details.review{background:#fffaf2;border:1px solid #f0d9bf;border-radius:10px;padding:8px 14px;margin:10px 0}
details.review summary{cursor:pointer;font-weight:bold;color:var(--orange-d)}
details.review li{margin:6px 0}
textarea.copy{width:100%;height:92px;font-family:"Courier New",monospace;font-size:14px;padding:8px;border:2px solid var(--line);border-radius:8px;resize:vertical}
/* lavoro */
.work{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:980px){.work{grid-template-columns:minmax(0,1fr)}.lesson{position:static!important}}
.lesson{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:sticky;top:12px}
.step-lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:bold;display:flex;align-items:center;gap:8px}
.lesson h2{margin:4px 0 10px;color:var(--teal);font-size:1.35em;outline:none}
.theory p{margin:0 0 10px}
.keybox{display:block;background:var(--teal-l);border-radius:10px;padding:10px 12px;margin:6px 0 12px;font-size:1em}
.taskbox{border-left:5px solid var(--orange);background:var(--orange-l);border-radius:8px;padding:10px 14px;margin:12px 0 4px}
.taskbox .lbl{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-d);font-weight:bold;margin-bottom:2px}
.taskbox.now{border-left-color:var(--teal);background:var(--teal-l)}
.taskbox.now .lbl{color:var(--teal-d)}
.dock.docked{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.dock.docked .quiz{margin-top:0}
.quiz{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qopt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98em;cursor:pointer;font-family:inherit;color:var(--ink)}
.qopt:hover{border-color:var(--teal)}
.qopt.wrong{border-color:var(--ko);background:var(--ko-l);text-decoration:line-through;cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-l);font-weight:bold}
.qopt.right::after{content:" ✔"}
.qopt:disabled{cursor:default;color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:12px;border-radius:8px;padding:10px 12px}
.fb.ok{background:var(--ok-l);color:#14532b}.fb.ko{background:var(--ko-l);color:#7d1a14}.fb.mid{background:var(--mid-l);color:var(--mid)}
.hinttext{margin-top:10px;background:#fff;border:2px dashed var(--orange);border-radius:8px;padding:8px 12px}
.speak{margin-left:auto;background:none;border:1px solid var(--line);border-radius:14px;padding:2px 9px;cursor:pointer;font-size:13px;font-family:inherit}
.pocket{position:absolute;right:20px;top:52px;z-index:20;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 16px;width:min(400px,calc(100vw - 32px))}
.pocket h3{margin:0 0 8px;color:var(--teal);font-size:16px}.pocket li{margin:0 0 6px}.pocket ul{padding-left:18px;margin:0}
.stage{min-width:0}
.stagecap{margin:8px 2px 0}
/* due finestre affiancate con il contatore */
.panes{display:grid;gap:12px}
.panes.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pane{min-width:0;container-type:inline-size}
.veil{background:var(--teal-l);border:2px dashed var(--teal);border-radius:10px;padding:8px 12px;margin:0 0 10px;color:var(--teal-d);font-weight:bold}
.veil.open{border-style:solid;font-weight:normal}
.stage.locked .panes,.stage.locked #gd-host{opacity:.5;filter:grayscale(.5);pointer-events:none}
.pane-h{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;min-height:30px}
.pane-h .lt{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:bold;flex:none}
.pane-h .fn{font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.pane-h .cnt{margin-left:auto;background:#fff;border:2px solid var(--line);border-radius:14px;padding:1px 10px;font-weight:bold;white-space:nowrap;transition:background .3s}
.pane-h .cnt.up{border-color:var(--ok);background:var(--ok-l)}
.pane-h .cnt.down{border-color:var(--ko);background:var(--ko-l)}
.pane-h .dl{font-size:12px;font-weight:bold;margin-left:4px}
/* ===== Esplora file (Windows 11) ===== */
.xp{position:relative;border:1px solid #c3cbd1;border-radius:10px;background:#fff;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#1b1b1b;box-shadow:0 6px 18px rgba(0,0,0,.08);user-select:none}
.xp button{font-family:inherit;color:#1b1b1b}
.xp-title{display:flex;align-items:flex-end;gap:8px;background:#e9edf0;padding:6px 12px 0;font-size:13px;min-height:34px}
.xp-title .tab{background:#fff;border-radius:8px 8px 0 0;padding:5px 14px;font-weight:600;max-width:65%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xp-ctl{margin-left:auto;letter-spacing:10px;color:#555;font-size:12px;align-self:center}
.xp-nav{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid #e5e5e5}
.nb{width:30px;height:30px;border:0;background:transparent;border-radius:6px;font-size:16px;cursor:pointer;flex:none}
.nb:hover:not(:disabled){background:#eef1f3}.nb:disabled{opacity:.3;cursor:default}
.nb:focus-visible,.xp-cmd button:focus-visible,.tn button:focus-visible,.cr:focus-visible,.xp-menu button:focus-visible,.xa-ico:focus-visible{outline:2px solid #0067c0;outline-offset:1px}
.xp-addr{flex:1;min-width:0;display:flex;align-items:center;border:1px solid #d3d3d3;border-radius:6px;height:32px;padding:0 4px;background:#f7f7f7;cursor:text;overflow:hidden}
.xp-addr:hover{background:#fff}
.crumbs{display:flex;align-items:center;white-space:nowrap;overflow:hidden;justify-content:flex-end;min-width:0;max-width:calc(100% - 48px)}
.xa-ico{border:0;background:transparent;padding:2px 5px;cursor:text;font-size:14px;flex:none;border-radius:4px}
.xa-ico:hover{background:#e3e7ea}
.cr{border:0;background:transparent;padding:3px 6px;border-radius:4px;font-size:13px;cursor:pointer;flex:none}
.cr:hover{background:#e3e7ea}
.crumbs .sep{color:#777;font-size:12px;padding:0 1px;flex:none}
.crumbs.ov{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px);mask-image:linear-gradient(90deg,transparent 0,#000 28px)}
.xa-in{width:100%;border:0;background:#fff;font:13px Consolas,"Courier New",monospace;outline:none;padding:0 6px;height:28px}
.xp-cmd{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid #e5e5e5;flex-wrap:wrap;min-height:40px}
.xp-cmd button{border:0;background:transparent;border-radius:6px;padding:5px 7px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.xp-cmd button:hover:not(:disabled){background:#eef1f3}
.xp-cmd button:disabled{opacity:.38;cursor:default}
.xp-cmd .vsep{width:1px;height:22px;background:#e0e0e0;margin:0 3px}
.xp-body{display:grid;grid-template-columns:200px minmax(0,1fr);height:300px}
.xp-body.notree{grid-template-columns:minmax(0,1fr)}
.xp-tree{position:relative;border-right:1px solid #ececec;overflow:auto;padding:6px 4px;font-size:13px}
.tn{display:flex;align-items:center;border-radius:5px;white-space:nowrap;min-height:26px}
.tn:hover{background:#eef3f7}.tn.cur{background:#dbe9f5}.tn.hlt{box-shadow:inset 4px 0 0 var(--orange)}
.tn.drop{background:#cfe3f7;outline:2px solid #0067c0;outline-offset:-2px}
.tn .tg{width:18px;flex:none;border:0;background:transparent;font-size:10px;color:#555;cursor:pointer;padding:4px 0;text-align:center}
.tn .tl{border:0;background:transparent;font-size:13px;cursor:pointer;padding:3px 6px 3px 2px;text-align:left;white-space:nowrap}
.xp-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.xp-head,.xr{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 70px;align-items:center}
.xp-head{font-size:12.5px;color:#555;border-bottom:1px solid #ececec;padding:5px 0}
.xp-head div{padding:0 6px}
.xp-list{flex:1;overflow:auto;outline:none;position:relative;min-height:0}
.xp-list:focus-visible{box-shadow:inset 0 0 0 2px #7fb7ff}
.xp-list.drop{background:#eef6fd;box-shadow:inset 0 0 0 2px #0067c0}
.xr{min-height:30px;font-size:13.5px;border:1px solid transparent;cursor:default;touch-action:pan-y}
.xr>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr>div:first-child{padding:0 0 0 7px;overflow:visible;text-overflow:clip}
.xr .c3,.xr .c4{color:#555}.xr .c4{text-align:right}
.xr:hover{background:#eaf4fd}
.xr.sel{background:#cce8ff;border-color:#99d1ff}
.xr.foc{outline:1px dotted #555;outline-offset:-2px}
.xr.cut{opacity:.45}
.xr.drop{background:#cfe3f7;outline:2px solid #0067c0;outline-offset:-2px}
.xr.hl{box-shadow:inset 5px 0 0 var(--orange);background:#fff1e4}
.xr.hl.sel{background:#cce8ff}
.xr.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#ffe08a}100%{background:transparent}}
.xr input.ren{width:100%;font:13.5px "Segoe UI",Arial,sans-serif;border:1px solid #0067c0;padding:2px 4px;outline:none;user-select:text}
.xp-empty{padding:24px;color:#777;font-size:13px;text-align:center}
.xp-status{display:flex;gap:12px;font-size:12.5px;color:#444;padding:5px 12px;border-top:1px solid #ececec;background:#fafafa;min-height:28px;flex-wrap:wrap}
.xp-status .clip{margin-left:auto;color:var(--orange-d)}
.xp-toast{position:absolute;left:12px;right:12px;bottom:36px;background:#1d2329;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.xp-toast.on{opacity:.95;transform:none}
.xp-menu{position:absolute;z-index:30;background:#fff;border:1px solid #d0d0d0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:200px}
.xp-menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:6px 10px;border-radius:5px;font-size:13px;text-align:left;cursor:pointer}
.xp-menu button:hover:not(:disabled){background:#eef3f7}
.xp-menu button:disabled{color:#9a9a9a;cursor:default}
.xp-menu .ck{width:16px;flex:none;text-align:center}
.xp-menu .arr{margin-left:auto;color:#666}
.xp-menu hr{border:0;border-top:1px solid #eee;margin:3px 0}
.dragghost{position:fixed;z-index:80;pointer-events:none;background:#fff;border:1px solid #99d1ff;border-radius:6px;padding:4px 9px;font:13px "Segoe UI",Arial,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.2);max-width:300px}
.dragghost .act{display:block;font-size:12.5px;color:#0067c0;margin-top:2px;font-weight:600}
.dragghost .act.cp{color:#1e7d3a}
.dragghost .act.no{color:#b3261e}
/* finestra stretta (due finestre affiancate, tablet, telefono): via la colonna Tipo */
@container (max-width:480px){
  .xp-head,.xr{grid-template-columns:28px minmax(0,1fr) 86px}
  .xp-head .c3,.xr .c3{display:none}
  .xp-cmd .lab:not(.keep){display:none}
  .xp.inbin .xp-head,.xp.inbin .xr{grid-template-columns:28px minmax(0,1fr) minmax(0,1.2fr)}
  .xp.inbin .xp-head .c3,.xp.inbin .xr .c3{display:block}
  .xp.inbin .xp-head .c4,.xp.inbin .xr .c4{display:none}
}
.xp.inbin .xr .c3{direction:rtl;text-align:left}
.dlg-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.dlg{background:#fff;border-radius:10px;max-width:470px;width:100%;padding:16px 18px;font-family:"Segoe UI",Arial,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.3);color:#1b1b1b}
.dlg h4{margin:0 0 8px;font-size:15px}
.dlg p{margin:0 0 10px;font-size:13.5px}
.dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dlg .opts button{text-align:left;border:1px solid #d6d6d6;background:#fafafa;border-radius:6px;padding:8px 10px;font:inherit;font-size:13.5px;cursor:pointer}
.dlg .opts button:hover,.dlg .opts button:focus-visible{border-color:#0067c0;background:#eef6fd;outline:none}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.dlg .row button{border:1px solid #c9c9c9;background:#fff;border-radius:6px;padding:6px 18px;font:inherit;cursor:pointer}
.dlg .row button.pri{background:#0067c0;color:#fff;border-color:#0067c0}
.dlg .row button:focus-visible{outline:2px solid #0067c0;outline-offset:2px}
/* ===== Google Drive nel browser ===== */
.gd{position:relative;border:1px solid #c3cbd1;border-radius:10px;background:#f8fafd;overflow:hidden;font-family:Roboto,"Segoe UI",Arial,sans-serif;color:#1f1f1f;box-shadow:0 6px 18px rgba(0,0,0,.08);user-select:none}
.gd button{font-family:inherit;color:#1f1f1f}
.gd-bar{display:flex;align-items:center;gap:6px;background:#dee3e8;padding:6px 10px;font-size:12.5px}
.gd-bar .url{flex:1;background:#fff;border-radius:14px;padding:4px 12px;color:#444;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gd-top{display:flex;align-items:center;gap:14px;padding:8px 14px}
.gd-logo{display:flex;align-items:center;gap:8px;font-size:20px;color:#444;flex:none}
.gd-logo svg{width:30px;height:27px}
.gd-search{flex:1;max-width:520px;background:#e9eef6;border-radius:24px;padding:9px 16px;color:#555;font-size:14px}
.gd-body{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:330px}
.gd-nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.gd-new{display:inline-flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:16px;padding:14px 18px;margin:0 0 10px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:14px;width:max-content;cursor:default}
.gd-ni{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:16px;padding:6px 14px;font-size:14px;text-align:left;cursor:pointer}
.gd-ni:hover:not(:disabled){background:#e8ecf2}.gd-ni.on{background:#c2e7ff;font-weight:600}
.gd-ni:disabled{color:#8a8a8a;cursor:default}
.gd-quota{font-size:12px;color:#555;padding:8px 14px}
.gd-main{background:#fff;border-radius:16px 0 0 0;padding:10px 14px;min-width:0}
.gd-crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:20px;margin:2px 0 8px}
.gd-crumbs button{border:0;background:transparent;font-size:20px;padding:2px 8px;border-radius:16px;cursor:pointer}
.gd-crumbs button:hover{background:#e8ecf2}
.gd-crumbs .sep{color:#777;font-size:16px}
.gd-selbar{display:flex;align-items:center;gap:4px;background:#e8ecf2;border-radius:20px;padding:4px 8px;margin:0 0 8px;font-size:13.5px;min-height:38px;flex-wrap:wrap}
.gd-selbar button{border:0;background:transparent;border-radius:16px;padding:5px 9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.gd-selbar button:hover:not(:disabled){background:#d3dae4}.gd-selbar button:disabled{opacity:.4;cursor:default}
.gd-selbar .hint{color:#555;padding:0 6px}
.gd-banner{background:#e8f0fe;border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.gd-head,.gr{display:grid;grid-template-columns:minmax(0,1fr) 100px 140px 100px 40px;align-items:center}
.gd-head{font-size:13px;color:#444;border-bottom:1px solid #e0e0e0;padding:6px 0;font-weight:600}
.gd-head div,.gr>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr{min-height:44px;font-size:14px;border-bottom:1px solid #eee;cursor:default;border-radius:0}
.gr:hover{background:#f0f4f9}
.gr.sel{background:#c2e7ff}
.gr.new{animation:flash 1.6s ease-out}
.gr .nm{display:flex;gap:10px;align-items:center}
.gr .dots{border:0;background:transparent;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.gr .dots:hover{background:#dde3ea}
.gr.hl{box-shadow:inset 5px 0 0 var(--orange)}
.gd-empty{padding:30px;text-align:center;color:#666;font-size:14px}
.gd-toast{position:absolute;left:16px;bottom:16px;background:#1f1f1f;color:#fff;border-radius:6px;padding:10px 16px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%}
.gd-toast.on{opacity:.95}
.gd .xp-menu{min-width:230px;border-radius:6px;padding:6px 0}

<script>
"use strict";
/* =====================================================================
   UTILITÀ
   ===================================================================== */
const $ = s => document.querySelector(s);
const IS_MAC = /Mac|iPhone|iPad/i.test(navigator.platform || navigator.userAgent || "");
const CT = IS_MAC ? "Cmd" : "Ctrl";
const K = (...keys) => `<span class="keys">${keys.map(k => `<span class="kbd">${k}</span>`).join("+")}</span>`;
const MP = (...items) => items.map(i => `<span class="menu-path">${i}</span>`).join(" › ");
const PFX = "hwsmov_", KEEP = "hist", mem = {};
const store = {
  get(k){ try{ const v=localStorage.getItem(PFX+k); if(v!==null) return JSON.parse(v); }catch(e){} return k in mem ? mem[k] : null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(PFX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(PFX+k); }catch(e){} },
  clear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(PFX) && k!==PFX+KEEP).forEach(k=>localStorage.removeItem(k)); }catch(e){} for(const k in mem) if(k!==KEEP) delete mem[k]; }
};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
const val = v => typeof v==="function" ? v() : (v||"");
const plain = h => { const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); };
const nameKey = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim().split(" ").sort().join(" ");
const djb = s => { let h=5381; for(let k=0;k<s.length;k++){ h=((h<<5)+h+s.charCodeAt(k))>>>0; } return h.toString(36); };
const hashName = n => djb("nome*"+nameKey(n));
const cognome = () => { const w=(store.get("nome")||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g," ").trim().split(/\s+/).filter(Boolean); return w.length ? w[w.length-1] : "cognome"; };
let BES = !!store.get("bes") || /bes/i.test(location.search + location.hash);

/* =====================================================================
   FILE SYSTEM SIMULATO
   ===================================================================== */
const BS = "\\";
const lc = s => String(s).toLowerCase();
const extOf = n => ((String(n).match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
const F = (name, size, date) => ({name, type:"file", size, date:date||"2026-09-20"});
const DIR = (name, children=[]) => ({name, type:"dir", children});
const clone = o => JSON.parse(JSON.stringify(o));
const KIND = {docx:"Documento di Microsoft Word", pdf:"Documento PDF", jpg:"File JPG", png:"File PNG", txt:"Documento di testo", mp3:"File MP3", mp4:"File MP4", pptx:"Presentazione di Microsoft PowerPoint", xlsx:"Foglio di lavoro di Microsoft Excel", zip:"Cartella compressa"};
const ICO = {docx:"📘", pdf:"📕", jpg:"🖼️", png:"🖼️", txt:"📝", mp3:"🎵", mp4:"🎬", pptx:"📙", xlsx:"📗", zip:"🗜️"};
const isCont = n => !!n && (n.type==="dir" || n.type==="drive" || n.type==="root");
const pathEq = (a,b) => a.length===b.length && a.every((x,i)=>lc(x)===lc(b[i]));
const within = (p, base) => p.length>=base.length && base.every((x,i)=>lc(x)===lc(p[i]));
const pstr = p => !p.length ? "Questo PC" : p.length===1 ? p[0]+BS : p.join(BS);
let FS=null, BIN=[], CLIP=null, EXT=true, USED=new Set(), OPS=[];
function nodeAt(path){ let n=FS; for(const p of path){ if(!isCont(n)) return null; n=n.children.find(c=>lc(c.name)===lc(p)); if(!n) return null; } return n; }
function resolve(parts){ let n=FS; const out=[]; for(const p of parts){ if(!isCont(n)) return null; const c=n.children.find(x=>lc(x.name)===lc(p)); if(!c) return null; out.push(c.name); n=c; } return {node:n, path:out}; }
const childOf = (d,name) => d.children.find(c=>lc(c.name)===lc(name));
const namesAt = path => { const n=nodeAt(path); return n && isCont(n) ? n.children.map(c=>c.name) : []; };
const has = (path,name) => { const n=nodeAt(path); return !!(n && isCont(n) && childOf(n,name)); };
const fileAt = (path,name) => { const n=nodeAt(path); return n && isCont(n) ? childOf(n,name) : null; };

/* =====================================================================
   ESPLORA FILE (Windows 11): una o due finestre sullo stesso computer
   ===================================================================== */
const XP = (()=>{
  const all=[]; let D=null, dlgOpen=false, onRender=null;
  const sorted = n => n.children.slice().sort((a,b)=> ((a.type==="file")-(b.type==="file")) || a.name.localeCompare(b.name,"it",{numeric:true,sensitivity:"base"}));
  const disp = c => c.type==="drive" ? c.label : c.type==="file" && !EXT ? c.name.replace(/\.[^.]+$/,"") : c.name;
  const kindOf = c => c.type==="dir" ? "Cartella di file" : c.type==="drive" ? (c.usb?"Unità rimovibile":"Disco locale") : (KIND[extOf(c.name)] || ("File "+extOf(c.name).toUpperCase()));
  const icoOf = c => c.type==="dir" ? "📁" : c.type==="drive" ? (c.usb?"💾":"💽") : (ICO[extOf(c.name)]||"📄");
  const kb = b => (b===0?0:Math.ceil(b/1024)).toLocaleString("it-IT")+" KB";
  const human = b => b<1024 ? b+" byte" : b<1048576 ? Math.ceil(b/1024).toLocaleString("it-IT")+" KB" : (Math.round(b/1048576*10)/10).toLocaleString("it-IT")+" MB";
  const dname = p => p[0]==="::bin" ? "Cestino" : !p.length ? "Questo PC" : p.length===1 ? ((FS.children.find(d=>lc(d.name)===lc(p[0]))||{}).label||p[0]) : p[p.length-1];
  const dateIt = d => (d||"").split("-").reverse().join("/");
  const J = v => esc(JSON.stringify(v));
  const inBin = X => X.cwd[0]==="::bin";
  const isSel = (X,k) => [...X.sel].some(s=>lc(s)===lc(k));

  function load(fs, o={}){ FS=fs; BIN=(o.bin||[]).map(b=>({node:b.node, from:b.from.slice()})); CLIP=null; EXT=o.ext!==false; USED=new Set(); OPS=[]; all.length=0; closeMenus(); }
  function mount(host, o){
    const X={host, o, cwd:o.cwd.slice(), back:[], fwd:[], sel:new Set(), anchor:null, foc:0, ren:null, addr:false,
      exp:new Set(), hl:new Set((o.hl||[]).map(lc)), hlt:new Set(), lastTap:null, flash:new Set(), order:[], items:[], idx:all.length};
    (o.expand||[]).forEach(p=>expandTo(X,p,true)); expandTo(X, X.cwd, true);
    all.push(X); render(X); return X;
  }
  function expandTo(X, p, inclusive){ for(let i=1;i<=p.length-(inclusive?0:1);i++) X.exp.add(lc(pstr(p.slice(0,i)))); }
  function refresh(focusX){ all.forEach(X=>render(X, X===focusX)); }

  function render(X, keepFocus){
    if(!inBin(X)) while(X.cwd.length && !nodeAt(X.cwd)) X.cwd.pop();
    const here = inBin(X) ? null : X.cwd.length ? nodeAt(X.cwd) : FS;
    const items = inBin(X) ? BIN.map((b,i)=>Object.assign({}, b.node, {_bin:i, _from:b.from})) : sorted(here);
    X.items=items; X.order = items.map(c=> c._bin!=null ? "#"+c._bin : c.name);
    if(X.foc>=items.length) X.foc=Math.max(0,items.length-1);
    [...X.sel].forEach(k=>{ if(!X.order.some(o=>lc(o)===lc(k))) X.sel.delete(k); });
    const selItems = items.filter((c,i)=>isSel(X, X.order[i]));
    const bin=inBin(X), atPC=!X.cwd.length, canSel=X.sel.size>0 && !bin && !atPC;
    const crumbs = bin ? [[["::bin"],"Cestino"]] : [[[],"Questo PC"], ...X.cwd.map((_,i)=>[X.cwd.slice(0,i+1), dname(X.cwd.slice(0,i+1))])];
    const addr = X.addr ? `<input class="xa-in" value="${esc(bin?"Cestino":pstr(X.cwd))}" aria-label="Percorso della cartella" spellcheck="false" autocomplete="off">`
      : `<button type="button" class="xa-ico" aria-label="Mostra il percorso scritto" title="Mostra il percorso scritto">${bin?"🗑️":atPC?"🖥️":"📁"}</button><div class="crumbs">${crumbs.map((c,i)=>`${i?'<span class="sep">›</span>':""}<button type="button" class="cr" data-cr="${i}">${esc(c[1])}</button>`).join("")}</div>`;
    const cmd = bin
      ? `<button type="button" data-a="restore" ${X.sel.size?"":"disabled"}>↩️ <span class="lab keep">Ripristina gli elementi selezionati</span></button>`
      : `<button type="button" data-a="new" ${atPC?"disabled":""} aria-haspopup="true">➕ <span class="lab">Nuovo</span> ▾</button><span class="vsep"></span>
        <button type="button" data-a="cut" title="Taglia (${CT}+X)" aria-label="Taglia" ${canSel?"":"disabled"}>✂️ <span class="lab keep">Taglia</span></button>
        <button type="button" data-a="copy" title="Copia (${CT}+C)" aria-label="Copia" ${canSel?"":"disabled"}>⧉ <span class="lab keep">Copia</span></button>
        <button type="button" data-a="paste" title="Incolla (${CT}+V)" aria-label="Incolla" ${CLIP && !atPC?"":"disabled"}>📋 <span class="lab keep">Incolla</span></button>
        <button type="button" data-a="ren" title="Rinomina (F2)" aria-label="Rinomina" ${X.sel.size===1 && !atPC?"":"disabled"}>✏️ <span class="lab">Rinomina</span></button>
        <button type="button" data-a="del" title="Elimina (Canc)" aria-label="Elimina" ${canSel?"":"disabled"}>🗑️ <span class="lab">Elimina</span></button>`;
    const head = `<div class="xp-head"><div></div><div>Nome</div><div class="c3">${bin?"Percorso originale":"Tipo"}</div><div class="c4">Dimensione</div></div>`;
    const cutNow = c => CLIP && CLIP.mode==="cut" && !bin && pathEq(CLIP.src, X.cwd) && CLIP.names.some(n=>lc(n)===lc(c.name));
    const rows = items.map((c,i)=>{ const k=X.order[i], s=isSel(X,k), rn = X.ren && !bin && lc(X.ren.name)===lc(c.name);
      const drop = !bin && (c.type==="dir"||c.type==="drive") ? ` data-drop="${J(X.cwd.concat(c.name))}"` : "";
      const nm = rn ? `<input class="ren" value="${esc(X.ren.value)}" aria-label="Nuovo nome" spellcheck="false" autocomplete="off">` : esc(disp(c));
      return `<div class="xr${s?" sel":""}${i===X.foc?" foc":""}${cutNow(c)?" cut":""}${X.hl.has(lc(c.name))?" hl":""}${X.flash.has(lc(c.name))?" new":""}" data-i="${i}" role="option" aria-selected="${s}"${drop}${bin?` title="Percorso originale: ${esc(pstr(c._from))}"`:""}><div aria-hidden="true">${icoOf(c)}</div><div class="nm">${nm}</div><div class="c3">${esc(bin?pstr(c._from):kindOf(c))}</div><div class="c4">${c.type==="file"?kb(c.size):""}</div></div>`; }).join("");
    X.flash.clear();
    const tot=selItems.filter(c=>c.type==="file").reduce((a,c)=>a+c.size,0);
    const selInfo = X.sel.size ? `${X.sel.size} selezionat${X.sel.size===1?"o":"i"}${tot?" · "+human(tot):""}` : "";
    const clipInfo = CLIP ? `📋 Appunti: ${CLIP.names.length===1?"«"+esc(CLIP.names[0])+"»":CLIP.names.length+" elementi"} ${CLIP.mode==="cut"?"(tagliato)":"(copiato)"}` : "";
    const tree = X.o.tree===false ? "" : `<nav class="xp-tree" aria-label="Albero delle cartelle">${treeHtml(X)}</nav>`;
    X.host.innerHTML = `<div class="xp${bin?" inbin":""}">
      <div class="xp-title"><span class="tab">${bin?"🗑️":atPC?"🖥️":"📁"} ${esc(dname(X.cwd))}</span><span class="xp-ctl" aria-hidden="true">─ ▢ ✕</span></div>
      <div class="xp-nav"><button type="button" class="nb" data-a="back" ${X.back.length?"":"disabled"} aria-label="Indietro" title="Indietro">←</button><button type="button" class="nb" data-a="up" ${atPC||bin?"disabled":""} aria-label="Su di un livello" title="Su di un livello (Alt+↑)">↑</button>
        <div class="xp-addr" title="Clic qui per vedere e scrivere il percorso">${addr}</div></div>
      <div class="xp-cmd">${cmd}</div>
      <div class="xp-body${X.o.tree===false?" notree":""}">${tree}<div class="xp-main">${head}<div class="xp-list" tabindex="0" role="listbox" aria-multiselectable="true" aria-label="Contenuto di ${esc(dname(X.cwd))}" data-drop="${J(bin?"::bin":X.cwd)}">${rows || `<div class="xp-empty">${bin?"Il Cestino è vuoto.":"Questa cartella è vuota."}</div>`}</div></div></div>
      <div class="xp-status"><span>${items.length} element${items.length===1?"o":"i"}</span><span>${selInfo}</span><span class="clip">${clipInfo}</span></div>
      <div class="xp-toast" aria-live="polite"></div></div>`;
    wire(X);
    const cr=X.host.querySelector(".crumbs"); if(cr){ const w=[...cr.children].reduce((a,c)=>a+c.offsetWidth,0); cr.classList.toggle("ov", w>cr.clientWidth+1); }
    const list=X.host.querySelector(".xp-list"), fr=list.querySelector(`.xr[data-i="${X.foc}"]`);
    if(fr && X.sel.size){ const t=fr.offsetTop, b=t+fr.offsetHeight; if(t<list.scrollTop) list.scrollTop=t; else if(b>list.scrollTop+list.clientHeight) list.scrollTop=b-list.clientHeight; }
    if(X.ren){ const inp=X.host.querySelector("input.ren"); if(inp){ inp.focus({preventScroll:true}); const dot = X.ren.isFile && EXT ? X.ren.value.lastIndexOf(".") : -1; inp.setSelectionRange(0, dot>0?dot:X.ren.value.length); } }
    else if(X.addr){ const a=X.host.querySelector(".xa-in"); a.focus(); a.select(); }
    else if(keepFocus) list.focus({preventScroll:true});
    if(onRender) onRender(X);
  }
  function treeHtml(X){
    const row=(path,label,ico,depth,kids,open)=>`<div class="tn${pathEq(path,X.cwd)?" cur":""}" style="padding-left:${2+depth*14}px" data-drop="${J(path.length&&path[0]==="::bin"?"::bin":path)}">${kids?`<button type="button" class="tg" data-tg="${J(path)}" aria-label="${open?"Chiudi":"Apri"} il ramo ${esc(label)}" aria-expanded="${open}">${open?"▾":"▸"}</button>`:`<span class="tg"></span>`}<button type="button" class="tl" data-go="${J(path)}">${ico} ${esc(label)}</button></div>`;
    let h=row([], "Questo PC", "🖥️", 0, false, true);
    const walk=(n,path,depth)=>{ n.children.filter(c=>c.type==="dir").sort((a,b)=>a.name.localeCompare(b.name,"it",{numeric:true,sensitivity:"base"})).forEach(c=>{
      const p=path.concat(c.name), kids=c.children.some(x=>x.type==="dir"), open=kids && X.exp.has(lc(pstr(p)));
      h+=row(p, c.name, "📁", depth, kids, open); if(open) walk(c,p,depth+1); }); };

const SEC = {A:{code:"PREVEDERE", name:"Prevedere"}, B:{code:"OPERARE", name:"Copiare e spostare"}, C:{code:"DRIVE", name:"Google Drive"}};
const cntOpts = (ok, fbs) => [["A: −1 · B: +1"],["A: uguale · B: +1"],["A: −1 · B: uguale"],["A: uguale · B: uguale"]].map((t,i)=> i===ok ? {t:t[0], ok:true} : {t:t[0], fb:fbs[i]});

const STEPS = [
 {id:"w", screen:"welcome"},

 {id:"g1", phase:"g", title:"Prima si sceglie", env:{panes:[DL], hl:["esercizi_geometria.pdf","scheda_inglese.pdf"]},
  theory:()=>`<p>Prima di copiare o spostare, devi dire al computer <b>su quali file</b> agire: si chiama <b>selezionare</b>. Il file scelto diventa azzurro.</p><p>Un ${K("clic")} sceglie un file solo. ${K(CT,"clic")} <b>aggiunge</b> un file a quelli già scelti. ${K("Shift","clic")} prende tutti i file <b>da… a…</b></p>`,
  keys:()=>`${K("clic")} uno · ${K(CT,"clic")} aggiungi · ${K("Shift","clic")} da… a…`,
  task:`Nella cartella Download seleziona <b>insieme</b> i due file PDF: <b>esercizi_geometria.pdf</b> e <b>scheda_inglese.pdf</b>. Non sono vicini.`,
  check:()=>{ const s=[...XP.all[0].sel].map(lc), want=["esercizi_geometria.pdf","scheda_inglese.pdf"];
    if(!s.length) return {ok:false, noTry:true, msg:"Non hai selezionato niente."};
    if(s.length===1 && want.includes(s[0])) return {ok:false, msg:`Ne hai scelto uno solo: un clic normale toglie gli altri. Clic sul primo, poi ${CT}+clic sul secondo.`};
    if(s.length===2 && want.every(w=>s.includes(w))) return {ok:true};
    return {ok:false, msg:`Hai scelto ${s.length} file: servono solo i due .pdf. Clic sul primo, poi ${CT}+clic sul secondo.`}; },
  hint:()=>`Clic su esercizi_geometria.pdf. Poi tieni premuto ${CT} e, senza lasciarlo, clic su scheda_inglese.pdf.`,
  success:"In basso la barra dice <b>2 selezionati</b>. Ora qualunque operazione vale per tutti e due.",
  learn:{k:()=>`${K(CT,"clic")}`, d:"aggiunge un file alla selezione"}},

 {id:"g2", phase:"g", title:"Copiare", env:{panes:[IT, BK], hl:["tema_estate.docx"]},
  theory:()=>`<p><b>Copiare</b> crea un secondo file uguale: l'originale resta dov'era.</p><p>Si fa in due mosse: <b>⧉ Copia</b> (${K(CT,"C")}) sul file, poi <b>📋 Incolla</b> (${K(CT,"V")}) nella cartella di arrivo. Tra le due mosse il file aspetta negli <b>Appunti</b>.</p>`,
  keys:()=>`⧉ Copia ${K(CT,"C")} → clic nell'altra finestra → 📋 Incolla ${K(CT,"V")}`,
  predict:{q:"Copi <b>tema_estate.docx</b> dalla finestra A (italiano) alla finestra B (backup_scuola). Come cambiano i contatori?",
    opts:cntOpts(1,["Questo succede quando sposti. Copiando, l'originale resta in italiano.",null,"Il file non sparisce da italiano: copiando, arriva un file nuovo in B.","In B arriva un file nuovo: il contatore di B sale."])},
  task:()=>`Seleziona <b>tema_estate.docx</b> nella finestra A, premi <b>⧉ Copia</b>, poi fai clic nella finestra B e premi <b>📋 Incolla</b>.`,
  check:()=>placeCheck("tema_estate.docx", IT, BK, "copy"),
  hint:"Clic su tema_estate.docx in A › ⧉ Copia (in alto nella finestra A) › clic in uno spazio vuoto della finestra B › 📋 Incolla (in alto nella finestra B).",
  success:"Contatori: <b>A uguale, B +1</b>. Ora ci sono due file uguali, in due posti diversi.",
  learn:{k:()=>`⧉ Copia ${K(CT,"C")} · 📋 Incolla ${K(CT,"V")}`, d:"un file in due posti"}},

 {id:"g3", phase:"g", title:"Spostare", env:{panes:[DL, STO], hl:["riassunto_storia.docx"]},
  theory:()=>`<p><b>Spostare</b>: il file lascia la cartella di partenza e arriva in quella nuova.</p><p>Si fa con <b>✂️ Taglia</b> (${K(CT,"X")}) e <b>📋 Incolla</b> (${K(CT,"V")}). Dopo Taglia il file diventa più chiaro: aspetta di essere incollato.</p>`,
  keys:()=>`✂️ Taglia ${K(CT,"X")} → clic nell'altra finestra → 📋 Incolla ${K(CT,"V")}`,
  predict:{q:"Sposti <b>riassunto_storia.docx</b> dalla finestra A (Download) alla finestra B (storia). Come cambiano i contatori?",
    opts:cntOpts(0,[null,"Questo è copiare. Spostando, il file lascia Download.","Il file non sparisce: arriva in storia, quindi B sale.","Qualcosa cambia: il file passa da A a B."])},
  task:()=>`Seleziona <b>riassunto_storia.docx</b> nella finestra A, premi <b>✂️ Taglia</b> (o ${K(CT,"X")}), poi clic nella finestra B e <b>📋 Incolla</b> (o ${K(CT,"V")}).`,
  check:()=>placeCheck("riassunto_storia.docx", DL, STO, "move"),
  hint:()=>`Clic su riassunto_storia.docx › ${CT}+X › clic in uno spazio vuoto della finestra B › ${CT}+V.`,
  success:"Contatori: <b>A −1, B +1</b>. Il file è uno solo, e adesso sta in storia.",
  learn:{k:()=>`✂️ Taglia ${K(CT,"X")} · 📋 Incolla ${K(CT,"V")}`, d:"il file cambia posto"}},

 {id:"g4", phase:"g", title:"Copia e originale", env:{panes:[IT, BK], mod:cp("tema_estate.docx", IT, BK)},
  theory:`<p>Copia e originale sono <b>due file separati</b>, anche se hanno lo stesso nome e lo stesso contenuto.</p>`,
  task:"In backup_scuola (B) c'è la copia di <b>tema_estate.docx</b>. Apri la copia, correggi un errore e salvi. Il file in italiano (A) cambia?",
  quiz:[{t:"Sì: copia e originale si aggiornano insieme.", fb:"No: sono due file distinti. Cambiare uno non cambia l'altro."},
        {t:"No: sono due file separati, l'originale resta com'era.", ok:true},
        {t:"Sì, ma solo se hanno lo stesso nome.", fb:"Il nome uguale non li collega: sono due file distinti, in due cartelle diverse."}],
  hint:"Pensa a una fotocopia: se scrivi sulla fotocopia, il foglio originale cambia?",
  success:"Per questo bisogna sapere sempre <b>quale</b> file si sta modificando. E per questo il backup funziona: se rovini l'originale, la copia è salva.",
  learn:{k:"copia ≠ originale", d:"due file separati: cambiare uno non cambia l'altro"}},

 {id:"g5", phase:"g", title:"Trascinare sullo stesso disco", env:{panes:[DL, ING], hl:["scheda_inglese.pdf"]},
  theory:`<p>Puoi anche <b>trascinare</b>: tieni premuto il tasto sinistro del mouse sul file, portalo sull'altra finestra e lascia.</p><p>Se le due cartelle sono sullo <b>stesso disco</b> (qui C:), trascinare <b>sposta</b>. Con il dito: tieni premuto e trascina prima di lato.</p>`,
  keys:`trascina sullo stesso disco = <b>sposta</b>`,
  predict:{q:"Trascini <b>scheda_inglese.pdf</b> dalla finestra A (Download) alla B (inglese). Sono tutte e due sul disco C:. Come cambiano i contatori?",
    opts:cntOpts(0,[null,"Sullo stesso disco trascinare non copia: sposta.","Il file arriva in inglese: B sale.","Il file passa da A a B: cambiano tutti e due."])},
  task:"Trascina <b>scheda_inglese.pdf</b> dalla finestra A alla finestra B. Mentre trascini, leggi che cosa scrive Windows accanto al file.",
  check:()=>need(placeCheck("scheda_inglese.pdf", DL, ING, "move"), ()=>USED.has("drag"), "il trascinamento"),
  hint:"Punta il mouse su scheda_inglese.pdf, tieni premuto il tasto sinistro, porta il file sopra la finestra B e lascia il tasto.",
  success:"Mentre trascinavi Windows scriveva <b>«→ Sposta in inglese»</b>: sullo stesso disco trascinare sposta.",
  learn:{k:"trascina (stesso disco)", d:"sposta"}},

 {id:"g6", phase:"g", title:"La trappola della chiavetta", env:{panes:[IT, USB], hl:["poesia_autunno.docx"]},
  theory:`<p>Tra due <b>unità diverse</b>, per esempio dal disco C: alla chiavetta E:, trascinare <b>non sposta: copia</b>. L'originale resta dov'era.</p><p>È una trappola classica: pensi di aver portato via il file, invece è ancora lì.</p>`,
  keys:`trascina su un'altra unità = <b>copia</b>`,
  predict:{q:"Ora trascini <b>poesia_autunno.docx</b> da C: (italiano, finestra A) alla <b>chiavetta E:</b> (finestra B). Come cambiano i contatori?",
    opts:cntOpts(1,["È la trappola: tra due unità diverse trascinare copia, non sposta. L'originale resta su C:.",null,"Il file arriva sulla chiavetta: B sale.","Qualcosa cambia: sulla chiavetta arriva il file."])},
  task:"Trascina <b>poesia_autunno.docx</b> sulla chiavetta (finestra B) e guarda i contatori.",
  check:()=>{ const r=placeCheck("poesia_autunno.docx", IT, USB, "copy"); if(!r.ok && has(USB,"poesia_autunno.docx") && !has(IT,"poesia_autunno.docx")) return {ok:false, reset:true, msg:"Il file si è spostato: forse hai tenuto premuto Shift, o hai usato Taglia. Rimetti tutto com'era e trascina senza tasti."}; return need(r, ()=>USED.has("dragdrive"), "il trascinamento"); },
  hint:"Trascina poesia_autunno.docx dalla finestra A sopra la finestra B (Chiavetta E:) e lascia il tasto.",
  success:"Mentre trascinavi Windows scriveva <b>«+ Copia in Chiavetta (E:)»</b>: contatori <b>A uguale, B +1</b>. Per spostare davvero su un'altra unità usa Taglia e Incolla.",
  learn:{k:"trascina (altra unità)", d:"copia: l'originale resta"}},

 {id:"g7", phase:"g", title:"Cambiare nome", env:{panes:[DL], hl:["Documento senza titolo.docx"]},
  theory:`<p>Per cambiare nome: seleziona il file e premi <b>F2</b> (o ✏️ Rinomina). Windows evidenzia solo il <b>nome</b>, non l'estensione: scrivi il nuovo nome e premi Invio.</p><p>Se cambi l'estensione, Windows ti avvisa: il file potrebbe non aprirsi più. Regola dei nomi: minuscolo, _ al posto degli spazi, niente accenti.</p>`,
  keys:()=>`${K("F2")} › scrivi il nome › ${K("Invio")}`,
  task:"Rinomina <b>Documento senza titolo.docx</b> in <b>ricerca_vulcani.docx</b>. Cambia solo il nome: l'estensione .docx resta.",
  check:()=>{ if(has(DL,"ricerca_vulcani.docx") && fileAt(DL,"ricerca_vulcani.docx").name==="ricerca_vulcani.docx") return {ok:true};
    const r=lastOp("rename"); if(!r) return {ok:false, noTry:idle(), msg:"Il file si chiama ancora «Documento senza titolo.docx»."};
    if(!extOf(r.to)) return {ok:false, reset:true, msg:`Ora si chiama «${esc(r.to)}»: hai tolto l'estensione, e Windows non sa più che è un documento Word. Rimetti tutto com'era e riprova.`};
    if(extOf(r.to)!=="docx") return {ok:false, reset:true, msg:`Ora si chiama «${esc(r.to)}»: hai cambiato l'estensione. Deve restare .docx.`};
    return {ok:false, msg:`Ora si chiama «${esc(r.to)}». Deve chiamarsi esattamente ricerca_vulcani.docx: tutto minuscolo, con il _ al posto dello spazio.`}; },
  hint:"Clic su «Documento senza titolo.docx», premi F2, scrivi ricerca_vulcani (il .docx resta da solo) e premi Invio.",
  success:"Il nome ora dice che cosa c'è dentro, e l'estensione è rimasta: il file si apre con Word come prima.",
  learn:{k:()=>K("F2"), d:"rinomina; l'estensione non si tocca"}},

 {id:"g8", phase:"g", title:"Il Cestino", env:{panes:[IT, ["::bin"]], bin:()=>[{node:F("tema_estate.docx",36870,"2026-09-14"), from:IT}], mod:()=>{ const d=nodeAt(IT); d.children=d.children.filter(c=>c.name!=="tema_estate.docx"); }, hl:["vecchio_orario.pdf"]},
  theory:`<p><b>Elimina</b> (o il tasto Canc) non cancella per sempre: il file va nel <b>Cestino</b>, e da lì si può <b>ripristinare</b>. Torna nella cartella da cui era partito.</p><p>Attenzione: dalla <b>chiavetta</b> i file si eliminano subito, per sempre.</p>`,
  keys:`🗑️ Elimina → Cestino · ↩️ Ripristina → torna al suo posto`,
  task:"Elimina <b>vecchio_orario.pdf</b> dalla finestra A e guarda dove finisce. Poi, nella finestra B (il Cestino), ripristina <b>tema_estate.docx</b>: era finito lì per sbaglio.",
  check:()=>{ const inBin=n=>BIN.some(b=>lc(b.node.name)===lc(n));
    if(idle()) return {ok:false, noTry:true, msg:"Non hai ancora fatto niente."};
    if(has(IT,"vecchio_orario.pdf")) return {ok:false, msg:"vecchio_orario.pdf è ancora in italiano: selezionalo e premi 🗑️ Elimina (o Canc)."};
    if(!inBin("vecchio_orario.pdf")) return {ok:false, reset:true, msg:"vecchio_orario.pdf non è nel Cestino: rimetti tutto com'era e riprova."};
    if(!has(IT,"tema_estate.docx")) return {ok:false, msg:"Ora ripristina tema_estate.docx: selezionalo nella finestra B (Cestino) e premi ↩️ Ripristina gli elementi selezionati."};
    return {ok:true}; },
  hint:"Finestra A: clic su vecchio_orario.pdf › 🗑️ Elimina. Finestra B: clic su tema_estate.docx › ↩️ Ripristina gli elementi selezionati.",
  success:"vecchio_orario.pdf è nel Cestino (si potrebbe ancora recuperare) e tema_estate.docx è tornato in italiano.",
  learn:{k:"🗑️ Cestino", d:"i file eliminati si possono ripristinare (non dalla chiavetta)"}},

 {id:"g9", phase:"g", title:"Lo stesso nome", env:{panes:[DL, SCI], hl:["relazione_scienze.docx"]},
  theory:`<p>Se nella cartella di arrivo c'è già un file con lo <b>stesso nome</b>, Windows chiede che cosa fare: <b>Sostituisci</b> (il file che c'era si perde) oppure <b>Ignora</b> (quel file non viene spostato).</p><p>Prima di scegliere guarda le date: qual è il più recente?</p>`,
  task:"In A (Download) c'è la <b>relazione_scienze.docx</b> nuova, del 28/09. Spostala in B (scienze), dove c'è quella vecchia del 12/09. Quando Windows chiede, scegli in modo che in scienze resti la versione <b>nuova</b>.",
  check:()=>{ const f=fileAt(SCI,"relazione_scienze.docx"), inDl=has(DL,"relazione_scienze.docx");
    if(f && f.date===NEW && !inDl) return {ok:true};
    if(f && f.date===NEW && inDl) return {ok:false, reset:true, msg:"In scienze c'è la nuova, ma ce n'è ancora una anche in Download: l'hai copiata. Rimetti tutto com'era e spostala."};
    if(USED.has("skip")) return {ok:false, reset:true, msg:"Hai scelto <b>Ignora</b>: in scienze c'è ancora la versione vecchia (12/09) e la nuova è rimasta in Download. Rimetti tutto com'era e scegli <b>Sostituisci</b>."};
    return {ok:false, noTry:idle(), msg:"Sposta la relazione da A a B (trascinala, oppure Taglia e Incolla): Windows ti farà una domanda."}; },
  hint:"Trascina relazione_scienze.docx da A a B. Nella finestra che compare scegli «Sostituisci il file nella destinazione».",
  success:"Scelta giusta: la versione nuova ha preso il posto di quella vecchia. Attenzione però: <b>Sostituisci</b> butta via il file che c'era, senza passare dal Cestino.",
  learn:{k:"Sostituisci · Ignora", d:"stesso nome: guarda le date prima di scegliere"}},

 {id:"g10", phase:"g", title:"In Google Drive", env:{drive:true, hl:["tema_estate.docx","orario.pdf"]},
  theory:()=>`<p>In <b>Google Drive</b>, nel browser, non c'è Taglia e Incolla: le operazioni sono nel menu <b>⋮</b> di ogni file (o con il tasto destro).</p><p>${MP("⋮","Organizza","Sposta")} = <b>spostare</b>. ${MP("⋮","Crea una copia")} = <b>copiare</b>: Drive mette la copia nella stessa cartella e la chiama «Copia di …».</p>`,
  keys:()=>`${MP("⋮","Organizza","Sposta")} · ${MP("⋮","Crea una copia")}`,
  task:()=>`Sei nella tua cartella di Drive, <b>primo_anno_${esc(cognome())}</b>. Sposta <b>tema_estate.docx</b> nella cartella <b>italiano</b>, poi crea una copia di <b>orario.pdf</b>.`,
  check:()=>{ const r=["primo_anno_"+cognome()], it=GD.at(r.concat("italiano")), root=GD.at(r);
    const moved = it && it.children.some(c=>c.name==="tema_estate.docx") && !root.children.some(c=>c.name==="tema_estate.docx");
    const copied = root.children.some(c=>c.name==="Copia di orario.pdf") && root.children.some(c=>c.name==="orario.pdf");
    if(moved && copied) return {ok:true};
    if(!GD.G.ops.length) return {ok:false, noTry:true, msg:"Non hai ancora fatto niente: apri il menu ⋮ della riga tema_estate.docx."};
    if(!moved) return {ok:false, msg: GD.G.ops.some(o=>o.op==="move") ? "tema_estate.docx non è finito in italiano: controlla dove l'hai spostato." : "Manca lo spostamento: ⋮ di tema_estate.docx › Organizza › Sposta › italiano › Sposta."};
    return {ok:false, msg:"Manca la copia: ⋮ di orario.pdf › Crea una copia."}; },
  hint:"Clic sui tre puntini ⋮ della riga tema_estate.docx › Organizza › Sposta › scegli italiano › Sposta. Poi ⋮ di orario.pdf › Crea una copia.",
  success:"In Drive le operazioni hanno nomi diversi, ma l'idea è la stessa: <b>Sposta</b> toglie il file da dov'era, <b>Crea una copia</b> lascia l'originale.",
  learn:{k:()=>`${MP("⋮","Organizza","Sposta")} · ${MP("⋮","Crea una copia")}`, d:"spostare e copiare in Drive"}},

 {id:"g11", phase:"g", title:"Il Cestino di Drive", env:{drive:true, hl:["appunti_vecchi.docx"]},
  theory:`<p>Anche Drive ha un <b>Cestino</b>: «Sposta nel cestino» non cancella subito. I file restano lì <b>30 giorni</b>, poi Drive li elimina per sempre.</p><p>Per recuperarne uno: apri il Cestino a sinistra, seleziona il file e premi <b>Ripristina</b>.</p>`,
  keys:()=>`${MP("⋮","Sposta nel cestino")} · Cestino › ${MP("Ripristina")}`,
  task:"Sposta nel cestino <b>appunti_vecchi.docx</b>. Poi apri il <b>Cestino</b> (a sinistra) e ripristinalo.",
  check:()=>{ const r=["primo_anno_"+cognome()], root=GD.at(r), back=root.children.some(c=>c.name==="appunti_vecchi.docx");
    if(GD.G.used.has("trash") && GD.G.used.has("restore") && back) return {ok:true};
    if(!GD.G.used.has("trash")) return {ok:false, noTry:!GD.G.ops.length, msg:"Prima sposta nel cestino appunti_vecchi.docx: ⋮ › Sposta nel cestino."};
    return {ok:false, msg:"Ora apri il Cestino nel menu a sinistra, seleziona appunti_vecchi.docx e premi ↩️ Ripristina."}; },
  hint:"⋮ di appunti_vecchi.docx › Sposta nel cestino. Poi clic su «🗑️ Cestino» a sinistra › clic sul file › ↩️ Ripristina.",
  success:"Nel Cestino hai visto l'avviso: dopo <b>30 giorni</b> i file vengono eliminati per sempre. Se elimini qualcosa per sbaglio, non aspettare troppo.",
  learn:{k:"Cestino di Drive", d:"30 giorni, poi i file spariscono per sempre"}},

        <p><button type="button" class="btn" id="w-go">Inizia →</button></p>`;
      const go1=()=>{ const v=$("#w-name").value.replace(/\s+/g," ").trim();
        if(v.length<3){ const er=$("#w-err"); er.textContent="Scrivi il tuo nome e cognome (almeno 3 lettere), poi premi Inizia."; er.classList.remove("hidden"); $("#w-name").focus(); return; }
        const old=curName(), any=STEPS.some(s=>res(s.id));
        if(old && nameKey(old)!==nameKey(v) && any && !store.get("nome0")) store.set("nome0", old);
        restoreHistory(v); store.set("nome", v); next(); };
      $("#w-go").onclick=go1; $("#w-name").addEventListener("keydown", e=>{ if(e.key==="Enter") go1(); }); $("#w-name").focus();
    },
    finalX(el){
      el.innerHTML = `<h2>🏁 Sfida finale</h2>
        <p><b>${CHAL.length} compiti</b> in tre gruppi: prevedere che cosa succede, copiare e spostare davvero, Google Drive. Ogni compito dice solo <b>che cosa</b> ottenere: <b>come</b> lo scegli tu.</p>
        <p>Conta il <b>primo tentativo</b>. Se sbagli, leggi perché e riprova: alla fine trovi l'elenco delle cose da ripassare. Puoi anche saltare un compito, ma vale zero.</p>
        <p class="small">Durante la sfida la 🎒 Tasca resta chiusa: conta quello che ricordi. La ritrovi alla fine.</p>
        <p><button type="button" class="btn" id="s-go">Inizia la sfida →</button></p>`;
      $("#s-go").onclick=next; $("#s-go").focus();
    },
    end(el){
      const t=tally();
      el.innerHTML = `<h2>${t.miss===0 && !t.skips.length?"🎉 Palestra completata":"📋 Riepilogo"}</h2>${codeBlock()}
        ${restartBox()}
        <details style="margin-top:14px"><summary class="small">Area docente: verifica un codice</summary>
          <textarea class="copy" id="r-verify" style="height:62px" aria-label="Codice da verificare"></textarea><p><button type="button" class="btn alt" id="r-vbtn">Verifica</button> <b id="r-vres" aria-live="polite"></b></p></details>`;
      $("#e-redo").onclick=e=>askRestart("sfida", e.currentTarget); $("#e-zero").onclick=e=>askRestart("zero", e.currentTarget);
      $("#r-vbtn").onclick=()=>{ const raw=$("#r-verify").value.replace(/\s+/g," ").trim(), k=raw.lastIndexOf(" | #"), r=$("#r-vres");
        if(k<0 || !/^HWS-[A-Z]{3} \|/.test(raw)){ r.textContent="✘ Codice incompleto"; r.style.color="#b3261e"; return; }
        const ok = sig(raw.slice(0,k), raw.slice(4, raw.indexOf(" |")))===raw.slice(k+4).trim();
        r.textContent = ok ? "✔ Codice valido" : "✘ Codice NON valido: il testo è stato modificato"; r.style.color = ok ? "#1e7d3a" : "#b3261e"; };
    }
  };

  $("#b-check").onclick=check; $("#b-next").onclick=next; $("#b-hint").onclick=hint; $("#b-skip").onclick=skip;
  $("#l-speak").onclick=()=>{ try{ speechSynthesis.cancel(); const step=STEPS[pos], quiz=step.predict?step.predict.opts:step.quiz;
    const txt=[$("#l-title").innerText, $("#l-theory").innerText, $("#l-task").innerText, quiz?quiz.map((o,i)=>String.fromCharCode(65+i)+". "+plain(o.t)).join(". "):"", !$("#l-do").classList.contains("hidden")?$("#l-dotext").innerText:""].filter(Boolean).join(". ");
    const u=new SpeechSynthesisUtterance(txt); u.lang="it-IT"; u.rate=.95; speechSynthesis.speak(u); }catch(e){} };
  /* RIAVVIO-JS inizio: scelta alla fine e avviso grande prima di cancellare il codice */
  function redoChallenge(){ CHAL.forEach(q=>store.del("r_"+q.id)); store.set("rip", rip()+1); go(idx("x0")); }
  function resetAll(){ saveHistory(); store.clear(); window.scrollTo(0,0); location.reload(); }
  function restartBox(){
    const n=curName();
    return `<div class="restart"><h3>Vuoi ricominciare?</h3>
      <p>${n?`Questo è il lavoro di <b>${esc(n)}</b>. `:""}<b>Prima incolla il codice ${RS.dove}</b>: se ricominci, il codice qui sopra si cancella e alla fine ne avrai uno nuovo.</p>
      <p><button type="button" class="btn alt" id="e-redo">↺ Rifai solo la sfida</button> <span class="rs-note">Restano il nome e i passi guidati. Rifai solo ${RS.prove} della sfida.</span></p>
      <p><button type="button" class="btn danger" id="e-zero">🗑️ Ricomincia tutto da zero</button> <span class="rs-note">Si cancella tutto, anche il nome. Serve anche quando tocca a un compagno.</span></p>
      ${RS.lv?`<p>Vuoi fare l'altro livello? Ricomincia tutto da zero: lo scegli nella prima schermata.</p>`:""}
      <p class="small">Puoi ricominciare quante volte vuoi: il codice nuovo conta le ripetizioni e ricorda tutti gli errori.</p></div>`;
  }
  function askRestart(kind, opener){
    if(document.getElementById("rs-wrap")) return;
    const zero=kind==="zero", n=curName(), who=n?`il codice di ${esc(n)}`:"il codice salvato su questo computer";
    try{ speechSynthesis.cancel(); }catch(e){}
    const w=document.createElement("div"); w.id="rs-wrap"; w.className="modal rs-wrap";
    w.innerHTML=`<div class="screen warn" role="alertdialog" aria-modal="true" aria-labelledby="rs-t" aria-describedby="rs-d">
      <div class="warn-body">
        <div class="warn-ic" aria-hidden="true">⚠️</div>
        <h2 id="rs-t">${zero?"Ricominci tutto da zero?":"Rifai solo la sfida?"}</h2>
        <p class="warn-key" id="rs-d">Attenzione: <b>${zero?who:"il codice di adesso"} si perde per sempre</b>. È il codice da consegnare all'insegnante.</p>
        <p>${zero ? (n?`<b>Sei tu?</b> Prima incolla il codice ${RS.dove}. <b>Non sei tu?</b> Chiedi a ${esc(n)} se l'ha già copiato.`:`<b>È tuo?</b> Prima incolla il codice ${RS.dove}.`) : `<b>Non l'hai ancora incollato ${RS.dove}?</b> Copialo adesso.`}</p>
        <textarea class="copy" readonly aria-label="Il codice di adesso">${esc(code())}</textarea>
        <p><button type="button" class="btn alt" data-copy>📋 Copia il codice</button> <span class="rs-copied" data-copied aria-live="polite"></span></p>
        <p>${zero?`Si cancella tutto: nome, ${RS.lv?"livello, ":""}passi guidati e sfida. Se ricominci tu${RS.lv?" con lo stesso livello":""}, il codice nuovo conta la ripetizione e ricorda gli errori di prima.`:`${RS.risp} di adesso si cancellano; nome e passi guidati restano. Se ti fermi a metà, nel codice nuovo il resto risulta non fatto. Il codice nuovo conta la ripetizione e ricorda gli errori di prima.`}</p>
      </div>
      <div class="warn-acts"><button type="button" class="btn" id="rs-no">No, lascio tutto com'è</button><button type="button" class="btn danger" id="rs-yes">🗑️ ${zero?"Sì, cancello tutto e ricomincio":"Sì, cancello e rifaccio la sfida"}</button></div></div>`;
    document.body.appendChild(w);
    const t0=Date.now(), no=w.querySelector("#rs-no"), yes=w.querySelector("#rs-yes");
    const onKey=e=>{ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if(e.key==="Tab"){ const f=[...w.querySelectorAll("button,textarea")], a=f[0], z=f[f.length-1];
        if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } } };
    const onFocus=e=>{ if(!w.contains(e.target)) no.focus({preventScroll:true}); };
    function close(back){ document.removeEventListener("keydown", onKey, true); document.removeEventListener("focusin", onFocus, true); w.remove();
      if(back && opener && document.contains(opener)) opener.focus({preventScroll:true}); }
    document.addEventListener("keydown", onKey, true); document.addEventListener("focusin", onFocus, true);
    /* i primi 600 ms non contano: il secondo colpo di un doppio clic non conferma e non chiude */
    no.onclick=()=>{ if(Date.now()-t0<600) return; close(true); };
    yes.onclick=()=>{ if(Date.now()-t0<600) return; close(false); if(zero) resetAll(); else redoChallenge(); };
    no.focus({preventScroll:true}); w.querySelector(".warn-body").scrollTop=0;
  }
  /* RIAVVIO-JS fine */
  $("#f-code").onclick=()=>{ const m=$("#modal"); m.innerHTML=`<div class="screen">${codeBlock()}<p><button type="button" class="btn alt" id="m-close">Chiudi e continua</button></p></div>`; m.classList.remove("hidden"); $("#m-close").onclick=()=>{ m.classList.add("hidden"); $("#f-code").focus(); }; $("#m-close").focus(); };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#modal").classList.contains("hidden")){ $("#modal").classList.add("hidden"); $("#f-code").focus(); } });
  $("#o-bes").checked=BES; document.body.classList.toggle("bes", BES);
  $("#o-bes").onchange=e=>{ BES=e.target.checked; store.set("bes", BES); document.body.classList.toggle("bes", BES); render(); };
  $("#o-reset").onclick=e=>{ if(!anyWork()){ resetAll(); return; } askRestart("zero", e.currentTarget); };
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ $("#opts").open=false; go(idx(b.dataset.jump)); });

  return {render};
})();
App.render();
</script>
</body>
</html>
